    A.fill(b, 0, 0, TS, TS, P.c[st.inner]);
    // 层理只在部分变体出现，否则所有瓦片会拼出一张规则网点
    if (variant & 1) A.dither(b, 0, 5, TS, 1, P.c[st.innerHi], 3);
    // 大颗粒岩块，而不是单像素噪点
    var n = 1 + ((rng.f() * 2) | 0);
    for (var i = 0; i < n; i++) {
      var bx = 1 + ((rng.f() * (TS - 5)) | 0);
      var by = 1 + ((rng.f() * (TS - 5)) | 0);
      A.fill(b, bx, by, 2 + ((rng.f() * 2) | 0), 1, P.c[st.innerHi]);
    }
  }

  // 土层：地表之下 1~2 格，仍是土但没有草皮，越深越暗
  function buildShallow(c, mask, variant) {
    var P = c.P, st = c.style;
    var b = A.buf(TS, TS);
    var rng = new CT.Rng((CT.hash2(mask, variant, c.seed ^ 0x2b1f) >>> 0));
    drawBody(b, c, rng, 0, TS);
    A.dither(b, 0, 6, TS, 3, P.c[st.inner], 3);
    A.dither(b, 0, 10, TS, 4, P.c[st.inner], 6);
    A.dither(b, 0, 14, TS, 2, P.c[st.inner], 10);
    if (!(mask & DOWN)) A.hline(b, 0, TS - 1, TS, P.c[st.inner]);
    if (!(mask & LEFT)) A.vline(b, 0, 0, TS, P.c[st.edge]);
    if (!(mask & RIGHT)) A.vline(b, TS - 1, 0, TS, P.c[st.edge]);
    return b;
  }

  // ------------------------------------------------------------------ 地面
  function buildGround(c, mask, variant, depthClass) {
    var P = c.P, st = c.style;
    var b = A.buf(TS, TS);
    var rng = new CT.Rng((CT.hash2(mask, variant, c.seed) >>> 0));
    var topOpen = !(mask & UP);

    if (depthClass === 2) {
      // 深层岩体
      drawInterior(b, c, rng, variant);
      if (!(mask & LEFT)) A.vline(b, 0, 0, TS, P.c[st.edgeSoft]);
      if (!(mask & RIGHT)) A.vline(b, TS - 1, 0, TS, P.c[st.edgeSoft]);
      return b;
    }
    if (depthClass === 1) {
      return buildShallow(c, mask, variant);
    }

    if (topOpen) {
      drawBody(b, c, rng, 4, TS);
      drawCap(b, c, rng);
      // 顶面接触阴影：草根与土之间的一条暗压
      A.dither(b, 0, 4, TS, 1, st.capShadow !== undefined ? P.c[st.capShadow] : P.c[st.deep], 3);
      // 向深层岩体过渡：由稀到密地抖动到 inner 色
      A.dither(b, 0, 12, TS, 2, P.c[st.inner], 4);
      A.dither(b, 0, 14, TS, 2, P.c[st.inner], 8);
    } else {
      drawBody(b, c, rng, 0, TS);
    }

    // 底面
    if (!(mask & DOWN)) {
      A.dither(b, 0, 12, TS, 2, P.c[st.edgeSoft], 5);
      A.hline(b, 0, 14, TS, P.c[st.edgeSoft]);
      A.hline(b, 0, 15, TS, P.c[st.edge]);
    }

    // 左右收边
    var edgeTop = topOpen ? 1 : 0;
    if (!(mask & LEFT)) {
      A.vline(b, 0, edgeTop, TS - edgeTop, P.c[st.edge]);
      A.dither(b, 1, edgeTop, 1, TS - edgeTop, P.c[st.edgeSoft], 9);
    }
    if (!(mask & RIGHT)) {
      A.vline(b, TS - 1, edgeTop, TS - edgeTop, P.c[st.edge]);
      A.dither(b, TS - 2, edgeTop, 1, TS - edgeTop, P.c[st.edgeSoft], 9);
    }

    // 转角圆润（顶面与侧面同时裸露）
    if (topOpen && !(mask & LEFT)) {
      A.set(b, 0, 0, 0);
      A.set(b, 0, 1, P.c[st.capDeep]);
      A.set(b, 1, 0, P.c[st.cap]);
    }
    if (topOpen && !(mask & RIGHT)) {
      A.set(b, TS - 1, 0, 0);
      A.set(b, TS - 1, 1, P.c[st.capDeep]);
      A.set(b, TS - 2, 0, P.c[st.cap]);
    }
    // 内侧凹角压暗，避免顶面与侧墙交界处发亮
    if (!topOpen && !(mask & LEFT)) A.set(b, 1, 0, P.c[st.edgeSoft]);
    if (!topOpen && !(mask & RIGHT)) A.set(b, TS - 2, 0, P.c[st.edgeSoft]);

    accent(b, c, rng);
    return b;
  }

  // ---------------------------------------------------------------- 单向平台
  function buildPlatform(c, mask, variant) {
    var P = c.P, st = c.style;
    var b = A.buf(TS, TS);
    var rng = new CT.Rng((CT.hash2(mask, variant, c.seed ^ 0x5f3a) >>> 0));
    var th = 7;
    A.fill(b, 0, 0, TS, th, P.c[st.body]);
    drawCap(b, c, rng);
    drawBody(b, c, rng, 5, th);
    A.dither(b, 0, th - 2, TS, 1, P.c[st.edgeSoft], 6);
    A.hline(b, 0, th - 1, TS, P.c[st.edgeSoft]);
    A.hline(b, 0, th, TS, P.c[st.edge]);
    if (!(mask & LEFT)) { A.vline(b, 0, 1, th - 1, P.c[st.edge]); }
    if (!(mask & RIGHT)) { A.vline(b, TS - 1, 1, th - 1, P.c[st.edge]); }
    // 两端下缘倒角
    A.set(b, 0, th, 0);
    A.set(b, TS - 1, th, 0);
    return b;
  }

  // ------------------------------------------------------------------ 背景墙
  function buildWall(c, mask, variant) {
    var P = c.P, st = c.style;
    var b = A.buf(TS, TS);
    var rng = new CT.Rng((CT.hash2(mask, variant, c.seed ^ 0x9e17) >>> 0));
    A.fill(b, 0, 0, TS, TS, P.c[st.bodyDark]);
    var off = (variant & 1) ? 4 : 8;
    // 砖缝
    A.dither(b, 0, 7, TS, 1, P.c[st.deep], 10);
    A.dither(b, 0, 15, TS, 1, P.c[st.deep], 7);
    A.dither(b, off, 0, 1, 7, P.c[st.deep], 10);
    A.dither(b, (off + 8) % TS, 8, 1, 7, P.c[st.deep], 10);
    // 砖面轻微高光，让墙不至于死平
    A.dither(b, 0, 1, TS, 1, P.c[st.bodyDark], 0);
    for (var i = 0; i < 5; i++) {
      A.set(b, (rng.f() * TS) | 0, (rng.f() * TS) | 0, P.c[st.tex]);
    }
    if (rng.f() < 0.5) {
      var x = 2 + ((rng.f() * 12) | 0), y = 2 + ((rng.f() * 12) | 0);
      A.set(b, x, y, P.c[st.deep]);
      A.set(b, x + 1, y, P.c[st.deep]);
    }
    return b;
  }

  // ------------------------------------------------------------------- 斜坡
  // SLOPE_R：左低右高；SLOPE_L：左高右低。表面为 45°。
  function buildSlope(c, variant, dir) {
    var P = c.P, st = c.style;
    var b = A.buf(TS, TS);
    var rng = new CT.Rng((CT.hash2(dir, variant, c.seed ^ 0x1234) >>> 0));
    A.fill(b, 0, 0, TS, TS, P.c[st.body]);
    var x, y0, y;
    for (x = 0; x < TS; x++) {
      var hgt = dir === KIND.SLOPE_R ? (x + 1) : (TS - x);
      y0 = TS - hgt;
      for (y = 0; y < y0; y++) A.set(b, x, y, 0);
      A.set(b, x, y0, P.c[st.cap]);
      if (y0 + 1 < TS) A.set(b, x, y0 + 1, P.c[st.capDeep]);
      if (y0 + 2 < TS) A.dither(b, x, y0 + 2, 1, 3, P.c[st.capShadow], 6);
    }
    // 坡面高光断续
    for (var k = 0; k < 6; k++) {
      var hx = 1 + ((rng.f() * 14) | 0);
      var hh = dir === KIND.SLOPE_R ? (hx + 1) : (TS - hx);
      var hy = TS - hh;
      if (hy >= 0 && hy < TS) A.set(b, hx, hy, P.c[st.capHi]);
    }
    A.hline(b, 0, TS - 1, TS, P.c[st.edge]);
    return b;
  }

  // ------------------------------------------------------------------ 接口
  function getTile(themeKey, kind, mask, variant, depthClass) {
    var c = cacheFor(themeKey);
    variant = variant & 3;
    depthClass = depthClass || 0;
    var key = kind * 16384 + (mask & 255) * 64 + variant * 4 + depthClass;
    var t = c.tiles.get(key);
    if (t) return t;
    if (kind === KIND.GROUND) t = buildGround(c, mask, variant, depthClass);
    else if (kind === KIND.PLATFORM) t = buildPlatform(c, mask, variant);
    else if (kind === KIND.WALL) t = buildWall(c, mask, variant);
    else if (kind === KIND.SLOPE_R || kind === KIND.SLOPE_L) t = buildSlope(c, variant, kind);
    else throw new Error('tiles: bad kind ' + kind);
    c.tiles.set(key, t);
    return t;
  }

  function cacheSize(themeKey) {
    var c = caches[themeKey];
    return c ? c.tiles.size : 0;
  }
  function reset() { caches = {}; }

  CT.Tiles = {
    TS: TS,
    KIND: KIND,
    MASK: { UP: UP, DOWN: DOWN, LEFT: LEFT, RIGHT: RIGHT, UL: UL, UR: UR, DL: DL, DR: DR },
    getTile: getTile,
    cacheSize: cacheSize,
    reset: reset,
    STYLE: STYLE,
  };
})();

</script>
  <script>
/* ==== src/art/gen_bg.js ==== */
﻿/* 晶途拾光 — 三层视差背景
 * --------------------------------------------------------------------------
 * §5.4 视差背景三层：
 *   远层 2 至 4 色的山形或云层剪影          —— 跟随镜头 0.15
 *   中层 主题建筑或植被轮廓                  —— 跟随镜头 0.35
 *   近层 半透明枝叶或光斑                    —— 跟随镜头 0.60
 *
 * 每层是一条水平可无缝循环的条带（2~4 屏宽）。高度场由整周期正弦叠加而成，
 * 因此条带首尾天然连续，循环时看不到接缝。
 *
 * 远层刻意分成两重山脊（较亮的远景 + 稍暗的近景），用大气透视拉开纵深；
 * 抖动只用于山脊下方数像素的过渡，不做整片抖动，否则会变成「布纹」。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});
  var A = CT.Art;

  // 逻辑分辨率不再是常量，跟随 CT.View（窗口变大时视野变大）
  function curVW() { return (CT.View && CT.View.VW) || 480; }
  function curVH() { return (CT.View && CT.View.VH) || 270; }
  var FACTOR = { far: 0.15, mid: 0.35, near: 0.60 };

  // 天空竖直渐变（上 -> 地平线），取值全部来自主题 16 色板
  var SKY = {
    forest: { top: 2, bot: 1 },
    amber: { top: 13, bot: 5 },
    cloud: { top: 2, bot: 0 },
    water: { top: 3, bot: 1 },
    star: { top: 14, bot: 6 },
  };

  // 远层配色：[远脊亮色, 近脊暗色, 脊线高光, 脊下过渡]
  var FAR = {
    forest: { a: 3, b: 5, rim: 2, body: 5 },
    amber: { a: 6, b: 12, rim: 8, body: 13 },
    cloud: { a: 2, b: 4, rim: 0, body: 4 },
    water: { a: 2, b: 4, rim: 1, body: 4 },
    star: { a: 11, b: 12, rim: 8, body: 12 },
  };

  // 中层配色：[主体, 暗部, 高光]
  var MID = {
    forest: { main: 6, dark: 12, rim: 3 },
    amber: { main: 6, dark: 13, rim: 8 },
    cloud: { main: 4, dark: 12, rim: 1 },
    water: { main: 6, dark: 13, rim: 2 },
    star: { main: 11, dark: 13, rim: 8 },
  };

  var caches = {};

  function mod(v, n) { return ((v % n) + n) % n; }

  // 整周期高度场：所有分量周期都能整除 LW，首尾完全连续
  function makeHeight(rng, LW, base, comps) {
    var hs = new Float32Array(LW);
    var terms = [];
    for (var i = 0; i < comps; i++) {
      terms.push({
        k: 1 + i * 3,
        a: 10 + rng.f() * 22,
        p: rng.f() * Math.PI * 2,
      });
    }
    for (var x = 0; x < LW; x++) {
      var v = base;
      for (var t = 0; t < terms.length; t++) {
        v += Math.sin((Math.PI * 2 * terms[t].k * x) / LW + terms[t].p) * terms[t].a;
      }
      hs[x] = v;
    }
    return hs;
  }

  function wrapBlit(b, obj, x, y) {
    A.blit(b, mod(x, b.w), y, obj);
    if (mod(x, b.w) + obj.w > b.w) A.blit(b, mod(x, b.w) - b.w, y, obj);
  }

  // ---------------------------------------------------------------- 天空
  function buildSky(P, key) {
    var cfg = SKY[key];
    var top = P.c[cfg.top], bot = P.c[cfg.bot];
    var b = A.buf(curVW(), curVH());
    for (var y = 0; y < curVH(); y++) {
      // 竖直两色抖动过渡（§7.2 渐变只用抖动实现），过渡集中在 25%~75% 高度
      var t = (y / (curVH() - 1) - 0.22) / 0.62;
      if (t < 0) t = 0; else if (t > 1) t = 1;
      t = t * t * (3 - 2 * t); // smoothstep，让两端更干净
      var lv = Math.round(t * 16);
      var row = y * curVW();
      for (var x = 0; x < curVW(); x++) {
        var d = CT.BAYER4[(y & 3) * 4 + (x & 3)];
        b.d[row + x] = d < lv ? bot : top;
      }
    }
    return b;
  }

  // ------------------------------------------------------------- 远层
  function ridge(b, LW, hs, col, rim, bodyCol) {
    var x, y;
    for (x = 0; x < LW; x++) {
      var top = Math.round(hs[x]);
      if (top < 0) top = 0;
      for (y = top; y < curVH(); y++) b.d[y * LW + x] = col;
      b.d[top * LW + x] = rim;                       // 脊线高光 1 像素
      // 脊下 4 像素做过渡抖动（硬切 1 像素，其余抖动），避免「布纹」
      for (y = top + 1; y < top + 5 && y < curVH(); y++) {
        var lv = 10 - (y - top) * 2;
        if (lv > 0 && CT.BAYER4[(y & 3) * 4 + (x & 3)] < lv) b.d[y * LW + x] = rim;
      }
      // 体部极轻纹理，只出现在山体内部
      for (y = top + 6; y < curVH(); y += 1) {
        if (CT.BAYER4[(y & 3) * 4 + (x & 3)] < 2) b.d[y * LW + x] = bodyCol;
      }
    }
  }

  function buildFar(P, key) {
    var LW = 960;
    var b = A.buf(LW, curVH());
    var rng = new CT.Rng(CT.seedOf('far:' + key));
    var cfg = FAR[key];

    // 后一重山：位置更高、颜色更接近天空（大气透视）
    var hsBack = makeHeight(rng, LW, 132, 2);
    ridge(b, LW, hsBack, P.c[cfg.a], P.c[cfg.rim], P.c[cfg.a]);

    // 前一重山：更低、更暗
    var hsFront = makeHeight(rng, LW, 168, 3);
    ridge(b, LW, hsFront, P.c[cfg.b], P.c[cfg.rim], P.c[cfg.body]);

    var i, obj, x0;
    if (key === 'cloud') {
      // 云海：远层加几团松软云块
      for (i = 0; i < 10; i++) {
        var cw = 54 + ((rng.f() * 70) | 0), ch = 14 + ((rng.f() * 10) | 0);
        obj = A.buf(cw, ch);
        A.ellipse(obj, cw / 2 | 0, ch / 2 | 0, cw / 2, ch / 2, P.c[0]);
        A.dither(obj, 0, (ch >> 1), cw, ch >> 1, P.c[2], 5);
        wrapBlit(b, obj, (rng.f() * LW) | 0, 96 + ((rng.f() * 60) | 0));
      }
    } else if (key === 'star') {
      // 远景殿门拱
      for (i = 0; i < 6; i++) {
        x0 = (i * LW) / 6 + rng.f() * 40;
        obj = A.buf(28, 54);
        A.fill(obj, 0, 10, 28, 44, P.c[cfg.b]);
        A.fill(obj, 4, 16, 20, 38, 0);
        A.ellipse(obj, 14, 16, 10, 9, P.c[cfg.b]);
        A.fill(obj, 4, 16, 20, 38, 0);
        A.rect(obj, 4, 13, 20, 1, P.c[cfg.rim]);
        A.fill(obj, 0, 8, 28, 2, P.c[cfg.rim]);
        wrapBlit(b, obj, x0 | 0, 104);
      }
    } else if (key === 'forest') {
      // 远树冠轮廓，压在两道山脊之上
      for (i = 0; i < 18; i++) {
        var tw = 34 + ((rng.f() * 30) | 0), th = 20 + ((rng.f() * 14) | 0);
        obj = A.buf(tw, th);
        A.ellipse(obj, tw >> 1, th >> 1, tw >> 1, th >> 1, P.c[cfg.b]);
        A.ellipse(obj, (tw >> 1) - 5, (th >> 1) - 3, tw >> 2, th >> 2, P.c[cfg.rim]);
        wrapBlit(b, obj, (rng.f() * LW) | 0, 128 + ((rng.f() * 34) | 0));
      }
    } else if (key === 'amber') {
      // 洞顶垂石
      for (i = 0; i < 26; i++) {
        var w2 = 4 + ((rng.f() * 8) | 0), h2 = 12 + ((rng.f() * 30) | 0);
        obj = A.buf(w2, h2);
        for (var yy = 0; yy < h2; yy++) {
          var ww = Math.max(1, Math.round(w2 * (1 - yy / h2)));
          A.fill(obj, (w2 - ww) >> 1, yy, ww, 1, P.c[cfg.b]);
        }
        wrapBlit(b, obj, (rng.f() * LW) | 0, 0);
      }
    } else {
      // 水面横纹
      for (i = 0; i < 6; i++) A.dither(b, 0, 190 + i * 11, LW, 2, P.c[cfg.a], 4);
    }
    return b;
  }

  // ------------------------------------------------------------- 中层
  function buildMid(P, key) {
    var LW = 1440;   // 3 屏宽，与 480 视口成整除关系
    var b = A.buf(LW, curVH());
    var rng = new CT.Rng(CT.seedOf('mid:' + key));
    var cfg = MID[key];
    var main = P.c[cfg.main], dark = P.c[cfg.dark], rim = P.c[cfg.rim];
    var i, x0, obj, w, h;

    if (key === 'forest') {
      for (i = 0; i < 8; i++) {
        x0 = (i * LW) / 8 + rng.f() * 80;
        w = 9 + ((rng.f() * 5) | 0);          // 树干根宽
        h = 120 + ((rng.f() * 70) | 0);
        var cw = w + 56;                       // 画布要容得下树冠
        obj = A.buf(cw, h + 60);
        var cx = cw >> 1;
        // 树干：下宽上窄，左侧一条背光面
        for (var ty = 40; ty < 40 + h; ty++) {
          var tt = (ty - 40) / h;
          var tw2 = Math.max(3, Math.round(w * (1 - tt * 0.42)));
          A.fill(obj, cx - (tw2 >> 1), ty, tw2, 1, main);
          A.fill(obj, cx - (tw2 >> 1), ty, 1, 1, dark);
        }
        // 侧枝
        A.fill(obj, cx - 17, 76, 15, 3, main);
        A.fill(obj, cx + 3, 100, 15, 3, main);
        A.fill(obj, cx - 17, 76, 3, 2, dark);
        // 树冠：多团椭圆叠加，外形不规则才不像蘑菇
        A.ellipse(obj, cx, 26, 30, 20, main);
        A.ellipse(obj, cx - 21, 35, 15, 12, main);
        A.ellipse(obj, cx + 21, 33, 14, 11, main);
        A.ellipse(obj, cx - 8, 13, 16, 11, main);
        A.ellipse(obj, cx + 11, 19, 13, 10, main);
        // 受光顶面（左上受光）
        A.ellipse(obj, cx - 10, 13, 12, 7, rim);
        A.ellipse(obj, cx + 6, 21, 8, 5, rim);
        // 暗调：底部实压，边缘抖动过渡
        A.dither(obj, 0, 40, cw, 16, dark, 6);
        A.dither(obj, 0, 22, cw, 20, dark, 2);
        wrapBlit(b, obj, x0 | 0, 84 + ((rng.f() * 22) | 0));
      }
    } else if (key === 'amber') {
      for (i = 0; i < 13; i++) {
        x0 = (i * LW) / 13 + rng.f() * 50;
        w = 14 + ((rng.f() * 18) | 0);
        h = 60 + ((rng.f() * 90) | 0);
        obj = A.buf(w, h);
        for (var yy = 0; yy < h; yy++) {
          var ww = Math.max(2, Math.round(w * (yy / h)));
          A.fill(obj, (w - ww) >> 1, yy, ww, 1, yy < 8 ? dark : main);
        }
        A.fill(obj, (w >> 1) - 1, 0, 2, h, dark);
        A.dither(obj, 0, 0, w, h, rim, 2);
        wrapBlit(b, obj, x0 | 0, curVH() - h - 8);
      }
    } else if (key === 'cloud') {
      for (i = 0; i < 7; i++) {
        x0 = (i * LW) / 7 + rng.f() * 60;
        w = 70 + ((rng.f() * 50) | 0);
        h = 70 + ((rng.f() * 40) | 0);
        obj = A.buf(w, h);
        A.ellipse(obj, w >> 1, 12, w >> 1, 12, rim);         // 顶面云被
        A.fill(obj, 2, 12, w - 4, h - 12, main);
        for (var y2 = 12; y2 < h; y2++) {                    // 岛体收成锥形
          var t2 = (y2 - 12) / (h - 12);
          var ww2 = Math.round((w - 4) * (1 - t2 * 0.9));
          var l2 = (w - ww2) >> 1;
          A.fill(obj, 0, y2, w, 1, 0);
          A.fill(obj, l2, y2, ww2, 1, main);
        }
        A.dither(obj, 0, 12, w, 10, dark, 4);
        wrapBlit(b, obj, x0 | 0, 104 + ((rng.f() * 24) | 0));
      }
    } else if (key === 'water') {
      for (i = 0; i < 6; i++) {
        x0 = (i * LW) / 6 + rng.f() * 70;
        obj = A.buf(56, 70);
        A.fill(obj, 2, 40, 52, 7, main);                     // 台基
        A.fill(obj, 12, 16, 5, 24, main);                    // 柱
        A.fill(obj, 40, 16, 5, 24, main);
        A.fill(obj, 27, 16, 4, 24, main);
        A.fill(obj, 0, 6, 56, 10, dark);                     // 檐
        A.fill(obj, 4, 12, 48, 4, rim);
        wrapBlit(b, obj, x0 | 0, 122);
      }
    } else {
      for (i = 0; i < 8; i++) {
        x0 = (i * LW) / 8 + rng.f() * 60;
        w = 18 + ((rng.f() * 8) | 0);
        h = 130 + ((rng.f() * 50) | 0);
        obj = A.buf(w, h);
        A.fill(obj, 1, 12, w - 2, h - 12, main);
        A.fill(obj, 1, 12, 2, h - 12, dark);
        A.fill(obj, w - 3, 12, 2, h - 12, dark);
        A.fill(obj, 0, 4, w, 8, dark);
        A.fill(obj, 0, 5, w, 2, rim);
        A.fill(obj, 0, h - 10, w, 10, dark);
        A.dither(obj, 0, 24, w, h - 40, rim, 2);
        wrapBlit(b, obj, x0 | 0, curVH() - h);
      }
    }
    return b;
  }

  // ------------------------------------------------------------- 近层
  function buildNear(P, key) {
    var LW = 1920;   // 4 屏宽
    var b = A.buf(LW, curVH());
    var rng = new CT.Rng(CT.seedOf('near:' + key));
    var ALPHA = 0x80000000; // §7.2 透明度 50% 档
    var fidx;
    if (key === 'forest') fidx = 7;
    else if (key === 'amber') fidx = 7;
    else if (key === 'cloud') fidx = 0;
    else if (key === 'water') fidx = 2;
    else fidx = 2;
    var foliage = (((P.c[fidx] >>> 0) & 0x00ffffff) | ALPHA) >>> 0;
    // 光斑要用亮色，否则落在浅色天空上会变成脏点
    var lightIdx = key === 'amber' ? 0 : (key === 'star' ? 0 : 0);
    var light = (((P.c[lightIdx] >>> 0) & 0x00ffffff) | ALPHA) >>> 0;

    var i, x0, obj, y, len;
    if (key === 'forest' || key === 'water' || key === 'star') {
      // 顶部垂下的枝叶 / 藤蔓（半透明）
      for (i = 0; i < 14; i++) {
        x0 = (rng.f() * LW) | 0;
        len = 26 + ((rng.f() * 54) | 0);
        var W2 = 20;
        obj = A.buf(W2, len);
        var cxx = W2 >> 1;
        for (y = 0; y < len; y++) {
          var sway = Math.round(Math.sin((y / len) * Math.PI * 1.4) * 3);
          var thick = y < len * 0.55 ? 3 : (y < len * 0.8 ? 2 : 1);
          A.fill(obj, cxx + sway - (thick >> 1), y, thick, 1, foliage);
          if (y % 8 < 3) A.fill(obj, cxx + sway - 5, y, 3, 1, foliage);   // 侧叶
          if (y % 8 === 5) A.fill(obj, cxx + sway + 3, y, 3, 1, foliage);
        }
        wrapBlit(b, obj, x0, 0);
      }
    }
    // 光斑与浮游光点：圆形抖动光晕，不能用方形抖动块（会出现方块状亮斑）
    for (i = 0; i < 64; i++) {
      var lx = (rng.f() * LW) | 0;
      var ly = 110 + ((rng.f() * (curVH() - 150)) | 0);
      var r = 1 + ((rng.f() * 2) | 0);
      A.ellipse(b, lx, ly, r, r, light);
      if (rng.f() < 0.4) {
        var halo = 3 + ((rng.f() * 2) | 0);
        for (var oy = -halo; oy <= halo; oy++) {
          for (var ox2 = -halo; ox2 <= halo; ox2++) {
            var dd = ox2 * ox2 + oy * oy;
            if (dd > halo * halo) continue;
            if (CT.BAYER4[(((ly + oy) & 3) * 4) + ((lx + ox2) & 3)] < (dd < (halo * halo) / 2 ? 6 : 3)) {
              A.set(b, lx + ox2, ly + oy, light);
            }
          }
        }
      }
    }
    return b;
  }

  // ---------------------------------------------------------------- 接口
  function build(themeKey) {
    var c = caches[themeKey];
    if (c) return c;
    var P = CT.Palette.get(themeKey);
    c = caches[themeKey] = {
      key: themeKey,
      P: P,
      sky: buildSky(P, themeKey),
      far: buildFar(P, themeKey),
      mid: buildMid(P, themeKey),
      near: buildNear(P, themeKey),
      factor: FACTOR,
    };
    return c;
  }

  function drawLayer(fb, layer, offsetX, blend) {
    var LW = layer.w;
    var ox = mod(offsetX | 0, LW);
    var drawn = 0;
    var vw = curVW(), vh = curVH();
    while (drawn < vw) {
      var seg = Math.min(LW - ox, vw - drawn);
      fb.setClip(drawn, 0, seg, vh);
      if (blend) fb.blitBlend(layer.d, LW, vh, drawn, 0, false, ox);
      else fb.blit(layer.d, LW, vh, drawn, 0, false, ox);
      fb.resetClip();
      drawn += seg;
      ox = 0;
    }
  }

  // 天空缓冲必须和画布同尺寸；尺寸变了就重建（build 的缓存键里带了尺寸）
  function drawSky(fb, sky) {
    if (sky.d.length === fb.data.length) { fb.data.set(sky.d); return; }
    var vw = curVW(), vh = curVH();
    var srcW = sky.w || vw;
    for (var y = 0; y < vh && y < (sky.h || vh); y++) {
      var so = y * srcW, dOff = y * vw;
      for (var x = 0; x < vw; x++) fb.data[dOff + x] = sky.d[so + (x % srcW)];
    }
  }
  function reset() { caches = {}; }

  CT.BG = {
    build: build, drawSky: drawSky, drawLayer: drawLayer,
    FACTOR: FACTOR,
    get curVW() { return curVW(); },
    get curVH() { return curVH(); },
    reset: reset,
  };
})();

</script>
  <script>
/* ==== src/art/gen_sprites.js ==== */
/* 晶途拾光 — 角色 / NPC / 宝物 / 装饰物 生成
 * --------------------------------------------------------------------------
 * §3.1 主角规格：16 × 24 像素（含帽子与靴子），脚底留 1 像素透明边；
 *      色数单帧不超过 12 色；1 像素深色描边（非纯黑，取主题最深色）。
 * §3.2 主角共 6 组动作，8 至 12 帧每秒，逐帧硬切：
 *      待机 4 / 行走 6 / 跳跃 4 / 拾取 4 / 对话 2 / 庆祝 6
 * §3.4 造型红线：2 至 3 头身、圆润、无生物恐怖元素。
 *
 * 角色用 ASCII 像素图描述：头 / 身 / 腿三段积木按动作表拼装，眼睛单独盖印，
 * 描边由 Art.addOutline 统一生成。这样 26 帧动作共享同一套积木，
 * 既保证比例不漂移，也让「同一帧内不超过 12 色」在结构上成立。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});
  var A = CT.Art;
  var G = CT.Palette.G;
  var gc = CT.Palette.gc;

  var HERO_W = 16, HERO_H = 24;

  // 11 色调色表 + 描边 = 12 色，正好打在 §3.1 的上限
  function heroMap() {
    return {
      H: gc(G.HOOD), h: gc(G.HOOD_M), d: gc(G.HOOD_D),
      S: gc(G.SHIRT), s: gc(G.SHIRT_M), t: gc(G.SHIRT_D),
      P: gc(G.PANTS), p: gc(G.PANTS_M),
      B: gc(G.BOOT), K: gc(G.SKIN), k: gc(G.SKIN_D),
    };
  }

  // ------------------------------------------------------------ 头部积木
  // 8 行；第 3~6 行是脸，眼睛盖印在第 3~4 行。
  // 兜帽三段色（亮/中/暗）明确分开，否则米白帽与肤色糊成一片。
  // 头部重新分配比例：兜帽 4 行（尖顶 + 帽檐），脸 4 行且加宽到 10 像素。
  // 之前脸只占 8 像素宽、2 行可见，远看就是一团米白。
  var HEAD_A = [
    '.....HHHHHH.....',
    '...HHHHHHHHHH...',
    '..HHhhhhhhhhHH..',
    '..HdkkkkkkkkdH..',
    '..HdKKKKKKKkdH..',
    '..HdKKKKKKKkdH..',
    '...dKKKKKKkd...',
    '....kKKKKKKk....',
  ];
  // 呼吸帧：帽顶收窄 1 像素，读作轻微起伏
  // 行走时的轻微起伏：帽檐宽 1 像素，读作兜帽随步幅上下
  var HEAD_B = [
    '.....HHHHHH.....',
    '..HHHHHHHHHHHH..',
    '..HHhhhhhhhhHH..',
    '..HdkkkkkkkkdH..',
    '..HdKKKKKKKkdH..',
    '..HdKKKKKKKkdH..',
    '...dKKKKKKkd...',
    '....kKKKKKKk....',
  ];
  // 对话帧：点头，帽檐压下一线
  var HEAD_TALK = [
    '.....HHHHHH.....',
    '...HHHHHHHHHH...',
    '..HHhhhhhhhhHH..',
    '..HdkkkkkkkkdH..',
    '..HdKKKKKKKkdH..',
    '..HdKKKKKKKkdH..',
    '...dKKKKKKkd...',
    '....kKKKKKKk....',
  ];

  // ------------------------------------------------------------ 躯干积木
  // 7 行。手臂用 t（上衣暗部）与躯干的 S/s 拉开，轮廓才读得出
  var TORSO_A = [
    '....sSSSSSSs....',
    '..BtSSSSSSSSt...',
    '..BtSSSSSSSSt...',
    '.BBtSSSSSSSSt...',
    '..BtSSSSSSSSt...',
    '...KSSSSSSSSK...',
    '....PPPPPPPP....',
  ];
  var TORSO_UP = [
    '...KSSSSSSSSK...',
    '..BtSSSSSSSSt...',
    '..BtSSSSSSSSt...',
    '..BtSSSSSSSSt...',
    '...BsSSSSSSs....',
    '....PPPPPPPP....',
    '....PPPPPPPP....',
  ];
  var TORSO_LEAN = [
    '.....sSSSSSs....',
    '...BBsSSSSSSs...',
    '...BBtSSSSSts...',
    '...BBtSSSSSts...',
    '....BtSSSSSts...',
    '....KSSSSSSSK...',
    '.....PPPPPPP....',
  ];

  // ------------------------------------------------------------ 腿部积木
  var LEGS = {
    stand: [
      '....PPPPPPPP....',
      '....PPPPPPPP....',
      '.....PP..PP.....',
      '.....PP..PP.....',
      '.....BB..BB.....',
      '.....BB..BB.....',
      '....BBB..BBB....',
    ],
    strideA: [
      '....PPPPPPPP....',
      '....PPPPPPPP....',
      '....PPP..PP.....',
      '....PP...PP.....',
      '...BB....BB.....',
      '...BB....BB.....',
      '..BBB...BBB.....',
    ],
    strideB: [
      '....PPPPPPPP....',
      '....PPPPPPPP....',
      '.....PPPPP......',
      '.....PP.PP......',
      '.....BB.BB......',
      '....BB...BB.....',
      '...BBB..BBB.....',
    ],
    strideC: [
      '....PPPPPPPP....',
      '....PPPPPPPP....',
      '....PP..PPP.....',
      '....PP...PP.....',
      '....BB....BB....',
      '....BB....BB....',
      '...BBB...BBB....',
    ],
    strideD: [
      '....PPPPPPPP....',
      '....PPPPPPPP....',
      '.....PPPPP......',
      '......PP.PP.....',
      '......BB.BB.....',
      '.....BB...BB....',
      '....BBB..BBB....',
    ],
    // 上升：屈膝收腿
    tuck: [
      '....PPPPPPPP....',
      '....PPPPPPPP....',
      '....PPP.PPP.....',
      '...BB.....BB....',
      '...BB.....BB....',
      '................',
      '................',
    ],
    // 下落：伸腿
    spread: [
      '....PPPPPPPP....',
      '....PPPPPPPP....',
      '....PPP..PP.....',
      '....PP....PP....',
      '...BB......BB...',
      '...BB......BB...',
      '..BBB.....BBB...',
    ],
    // 落地缓冲：屈膝下蹲
    land: [
      '....PPPPPPPP....',
      '...PPPPPPPPPP...',
      '...PPP....PPP...',
      '....BB....BB....',
      '....BB....BB....',
      '...BBB....BBB...',
      '................',
    ],
    // 拾取：深蹲
    crouch: [
      '....PPPPPPPP....',
      '...PPPPPPPPPP...',
      '...PPP....PPP...',
      '....BB..BB......',
      '....BB..BB......',
      '...BBB..BBB.....',
      '................',
    ],
    // 庆祝：双腿分开小跳
    hop: [
      '....PPPPPPPP....',
      '....PPPPPPPP....',
      '...PPP....PPP...',
      '..BB........BB..',
      '..BB........BB..',
      '.BBB........BBB.',
      '................',
    ],
  };

  // ------------------------------------------------------------- 拼装
  function assemble(head, torso, legs, eyes, outlineColor) {
    var rows = head.concat(torso, legs); // 8 + 7 + 7 = 22 行
    var b = A.fromRows(rows, heroMap());
    stampEyes(b, eyes, outlineColor);
    // 拼装结果贴在 16×24 画布第 1 行，四周各留 1 像素给描边（§3.1 脚底留 1 像素透明边）
    var canvas = A.buf(HERO_W, HERO_H);
    A.blit(canvas, 0, 1, b);
    return A.addOutline(canvas, outlineColor);
  }

  function stampEyes(b, mode, eyeColor) {
    if (mode === 'none') return;
    var eye = eyeColor;   // 与描边同色，才能守住 §3.1「单帧不超过 12 色」
    // 眼睛落在头部第 3~4 行（拼装后即缓冲区第 3、4 行）
    // 脸现在占第 4~7 行，眼睛落在第 5~6 行，左右对称
    if (mode === 'open') {
      A.fill(b, 5, 5, 2, 2, eye);
      A.fill(b, 9, 5, 2, 2, eye);
      // 一点高光，让眼神不呆
      A.set(b, 5, 5, gc(G.WHITE));
      A.set(b, 9, 5, gc(G.WHITE));
    } else if (mode === 'blink') {
      A.fill(b, 5, 6, 2, 1, eye);
      A.fill(b, 9, 6, 2, 1, eye);
    } else if (mode === 'up') {
      // 庆祝时眼睛看向上方
      A.fill(b, 5, 5, 2, 2, eye);
      A.fill(b, 9, 5, 2, 2, eye);
      A.set(b, 6, 5, gc(G.WHITE));
      A.set(b, 10, 5, gc(G.WHITE));
    }
  }

  // 6 组动作的帧表（§3.2）
  var ANIM = {
    idle: {
      fps: 8, frames: [
        { head: HEAD_A, torso: TORSO_A, legs: LEGS.stand, eyes: 'open' },
        { head: HEAD_B, torso: TORSO_A, legs: LEGS.stand, eyes: 'open' },
        { head: HEAD_A, torso: TORSO_A, legs: LEGS.stand, eyes: 'open' },
        { head: HEAD_B, torso: TORSO_A, legs: LEGS.stand, eyes: 'blink' },
      ],
    },
    walk: {
      fps: 10, frames: [
        { head: HEAD_A, torso: TORSO_A, legs: LEGS.strideA, eyes: 'open' },
        { head: HEAD_B, torso: TORSO_A, legs: LEGS.strideB, eyes: 'open' },
        { head: HEAD_A, torso: TORSO_A, legs: LEGS.strideC, eyes: 'open' },
        { head: HEAD_B, torso: TORSO_A, legs: LEGS.strideD, eyes: 'open' },
        { head: HEAD_A, torso: TORSO_A, legs: LEGS.strideC, eyes: 'open' },
        { head: HEAD_B, torso: TORSO_A, legs: LEGS.strideB, eyes: 'open' },
      ],
    },
    jump: {
      fps: 12, frames: [
        { head: HEAD_A, torso: TORSO_A, legs: LEGS.land, eyes: 'open' },
        { head: HEAD_A, torso: TORSO_A, legs: LEGS.tuck, eyes: 'open' },
        { head: HEAD_B, torso: TORSO_A, legs: LEGS.tuck, eyes: 'open' },
        { head: HEAD_A, torso: TORSO_A, legs: LEGS.spread, eyes: 'open' },
      ],
    },
    pickup: {
      fps: 10, frames: [
        { head: HEAD_A, torso: TORSO_LEAN, legs: LEGS.stand, eyes: 'open' },
        { head: HEAD_A, torso: TORSO_LEAN, legs: LEGS.crouch, eyes: 'blink' },
        { head: HEAD_B, torso: TORSO_LEAN, legs: LEGS.crouch, eyes: 'blink' },
        { head: HEAD_A, torso: TORSO_A, legs: LEGS.stand, eyes: 'open' },
      ],
    },
    talk: {
      fps: 8, frames: [
        { head: HEAD_A, torso: TORSO_A, legs: LEGS.stand, eyes: 'open' },
        { head: HEAD_TALK, torso: TORSO_A, legs: LEGS.stand, eyes: 'open' },
      ],
    },
    celebrate: {
      fps: 12, frames: [
        { head: HEAD_A, torso: TORSO_UP, legs: LEGS.land, eyes: 'up' },
        { head: HEAD_B, torso: TORSO_UP, legs: LEGS.hop, eyes: 'up' },
        { head: HEAD_A, torso: TORSO_UP, legs: LEGS.hop, eyes: 'up' },
        { head: HEAD_B, torso: TORSO_UP, legs: LEGS.hop, eyes: 'up' },
        { head: HEAD_A, torso: TORSO_UP, legs: LEGS.spread, eyes: 'up' },
        { head: HEAD_A, torso: TORSO_UP, legs: LEGS.land, eyes: 'up' },
      ],
    },
  };

  var heroCache = {};
  function buildHero(themeKey) {
    if (heroCache[themeKey]) return heroCache[themeKey];
    var outline = CT.Palette.get(themeKey).c[14]; // §3.1 描边用主题最深色
    var out = {};
    for (var name in ANIM) {
      var def = ANIM[name];
      var frames = [];
      for (var i = 0; i < def.frames.length; i++) {
        var f = def.frames[i];
        frames.push(assemble(f.head, f.torso, f.legs, f.eyes, outline));
      }
      out[name] = { fps: def.fps, frames: frames };
    }
    heroCache[themeKey] = out;
    return out;
  }

  // -------------------------------------------------------------- 主角光效
  // §3.1 脚下 9 × 3 像素椭圆微光；收集彩晶后光色切换为主题主色
  function buildFootGlow(color) {
    var b = A.buf(9, 3);
    A.ellipse(b, 4, 1, 4, 1, color);
    return b;
  }

  // ---------------------------------------------------------------- 宝物
  // 主线彩晶：菱形晶体。外描边用主题最深色（§3.1 非纯黑描边）
  function buildCrystal(color, accent, outline) {
    var shape = [
      '.......##.......',
      '......####......',
      '.....######.....',
      '....########....',
      '...##########...',
      '...##########...',
      '..############..',
      '...##########...',
      '...##########...',
      '....########....',
      '.....######.....',
      '......####......',
      '.......##.......',
    ];
    var b = A.fromRows(shape, { '#': color });
    // 内部高光：左上受光棱面
    A.fill(b, 6, 5, 2, 4, accent);
    A.fill(b, 7, 4, 1, 1, accent);
    A.fill(b, 5, 6, 1, 2, accent);
    // 右下暗面
    A.dither(b, 8, 7, 6, 6, gc(G.SHADE), 6);
    return A.addOutline(b, outline === undefined ? gc(G.OUTLINE) : outline);
  }

  // 拾遗宝物：系带小盒，五行内可辨；局部像素闪光由渲染层叠加
  function buildTreasure(color, accent) {
    var b = A.buf(12, 12);
    A.fill(b, 1, 4, 10, 6, color);              // 盒身
    A.fill(b, 1, 3, 10, 1, accent);             // 盒盖
    A.fill(b, 1, 9, 10, 1, gc(G.SHADE));        // 底暗线
    A.fill(b, 6, 3, 2, 7, accent);              // 竖向缎带
    A.fill(b, 1, 6, 10, 1, accent);             // 横向缎带
    A.set(b, 3, 5, gc(G.WARM));
    A.set(b, 9, 7, gc(G.WARM));
    A.fill(b, 7, 2, 2, 1, accent);              // 顶部小绳结
    return A.addOutline(b, gc(G.OUTLINE));
  }

  // 守护印记：环状符文
  function buildMark(color, accent) {
    var b = A.buf(12, 12);
    A.ellipse(b, 6, 6, 5, 5, color);
    A.ellipse(b, 6, 6, 3, 3, 0);
    // 内部菱形符文
    A.set(b, 6, 3, accent);
    A.fill(b, 5, 4, 3, 1, accent);
    A.fill(b, 4, 5, 5, 2, accent);
    A.fill(b, 5, 7, 3, 1, accent);
    A.set(b, 6, 8, accent);
    return A.addOutline(b, gc(G.OUTLINE));
  }

  // ---------------------------------------------------------------- NPC
  // 全部为友善或中立的自然生灵，尺寸 16×16 至 24×24，不得大于主角 1.5 倍
  var npcCache = {};
  function buildNpc(kind, P) {
    var key = kind;
    if (npcCache[key]) return npcCache[key];
    var b, i;
    var outline = P.c[14];   // §3.1 非纯黑描边，取主题最深色
    if (kind === 'firefly') {
      // 林间萤灵：三颗光点加一对薄翼
      b = A.buf(20, 20);
      A.ellipse(b, 10, 10, 5, 5, P.c[4]);
      A.ellipse(b, 10, 10, 4, 4, P.c[15]);
      A.ellipse(b, 10, 10, 2, 2, gc(G.WHITE));
      for (i = 0; i < 3; i++) {
        var ang = (i / 3) * Math.PI * 2 + 0.4;
        A.set(b, Math.round(10 + Math.cos(ang) * 7), Math.round(10 + Math.sin(ang) * 7), P.c[0]);
      }
      // 薄翼：两片抖动叶
      for (var wy = -3; wy <= 3; wy++) {
        var ww = 4 - Math.abs(wy);
        A.fill(b, 3, 10 + wy, ww, 1, P.c[1]);
        A.fill(b, 17 - ww, 10 + wy, ww, 1, P.c[1]);
      }
      A.fill(b, 2, 9, 1, 3, P.c[0]);
      A.fill(b, 17, 9, 1, 3, P.c[0]);
    } else if (kind === 'elder') {
      // 石苔长老：圆润石块 + 青苔 + 两只小眼（无尖角，§3.4）
      b = A.buf(24, 22);
      A.ellipse(b, 12, 12, 10, 9, P.c[11]);
      A.ellipse(b, 12, 11, 9, 8, P.c[3]);
      for (var py = 4; py < 20; py++) {
        var t = (py - 4) / 16;
        if (t > 0.45) A.fill(b, 3 + Math.round(t * 2), py, 18 - Math.round(t * 4), 1, P.c[11]);
      }
      A.ellipse(b, 10, 8, 6, 4, P.c[2]);
      A.ellipse(b, 6, 6, 3, 2, P.c[1]);
      // 青苔斑
      A.fill(b, 5, 5, 4, 1, P.c[7]);
      A.fill(b, 14, 6, 3, 1, P.c[7]);
      A.fill(b, 8, 16, 5, 2, P.c[12]);
      A.hline(b, 4, 19, 16, P.c[12]);
      A.set(b, 8, 10, gc(G.OUTLINE)); A.set(b, 9, 10, gc(G.OUTLINE));
      A.set(b, 14, 10, gc(G.OUTLINE)); A.set(b, 15, 10, gc(G.OUTLINE));
      A.set(b, 8, 10, gc(G.WHITE)); A.set(b, 14, 10, gc(G.WHITE));
    } else if (kind === 'messenger') {
      // 云絮信使：蓬松云团，边缘柔和（用抖动做柔边，不用渐变）
      b = A.buf(24, 20);
      A.ellipse(b, 12, 13, 10, 6, P.c[1]);
      A.ellipse(b, 8, 9, 6, 5, P.c[0]);
      A.ellipse(b, 15, 10, 5, 4, P.c[0]);
      A.ellipse(b, 12, 7, 5, 4, P.c[1]);
      A.dither(b, 3, 15, 18, 4, P.c[2], 7);
      A.dither(b, 3, 17, 18, 2, P.c[3], 4);
      A.set(b, 9, 12, gc(G.OUTLINE)); A.set(b, 14, 12, gc(G.OUTLINE));
      A.hline(b, 10, 15, 3, P.c[3]);
      A.hline(b, 13, 15, 3, P.c[3]);
    } else if (kind === 'clam') {
      // 河蚌灵：半开贝壳 + 珍珠光
      b = A.buf(22, 18);
      A.ellipse(b, 11, 12, 10, 5, P.c[11]);
      A.ellipse(b, 11, 11, 9, 4, P.c[2]);
      A.ellipse(b, 11, 8, 9, 3, P.c[3]);
      A.ellipse(b, 11, 6, 7, 2, P.c[2]);
      // 壳纹
      for (i = -3; i <= 3; i++) A.vline(b, 11 + i * 3, 9, 3, P.c[4]);
      A.ellipse(b, 11, 9, 3, 2, gc(G.WARM));
      A.set(b, 11, 9, gc(G.WHITE));
      A.hline(b, 2, 16, 18, P.c[12]);
      A.set(b, 7, 10, gc(G.OUTLINE)); A.set(b, 15, 10, gc(G.OUTLINE));
    } else {
      // 苔痕向导：两片叶子 + 一根木杖
      b = A.buf(22, 22);
      A.fill(b, 5, 6, 2, 15, P.c[9]);          // 木杖（2 像素宽）
      A.set(b, 5, 5, P.c[8]);
      A.set(b, 4, 20, P.c[8]);
      A.ellipse(b, 13, 11, 6, 7, P.c[5]);      // 叶身
      A.ellipse(b, 13, 9, 4, 5, P.c[4]);
      A.vline(b, 13, 4, 8, P.c[6]);            // 叶脉
      A.fill(b, 10, 8, 3, 1, P.c[6]);
      A.fill(b, 14, 11, 3, 1, P.c[6]);
      A.ellipse(b, 12, 6, 3, 3, P.c[3]);       // 小芽
      A.set(b, 14, 11, gc(G.OUTLINE)); A.set(b, 15, 11, gc(G.OUTLINE));
      A.set(b, 14, 11, gc(G.WHITE));
      A.dither(b, 0, 18, 16, 4, P.c[12], 7);
    }
    var out = A.addOutline(b, outline);
    npcCache[key] = out;
    return out;
  }

  // ------------------------------------------------------------ 装饰物积木
  /* §5.4：每屏至少 8 个装饰物件，同一装饰不得连续重复 3 次，同类装饰必须准备
   * 2 至 3 个变体。这里提供一组参数化积木，每主题用它们组出 8 类以上装饰。 */

  // 装饰物积木（第二版）
  // 第一版是 7~14 像素的椭圆 + 噪点，缩到 16 像素瓦片的尺度后成了「认识的形状里
  // 最不认识的那一类」。这一版的原则：每件东西 14~28 像素、轮廓用明确的几何体、
  // 顶部一定有一行亮色压边、底部一定有一行暗色投影。数量上也做了减法。
  function pTuft(P, rng, cols) {               // 蕨类 / 草丛
    var w = 15 + ((rng.f() * 5) | 0);
    var h = 16 + ((rng.f() * 7) | 0);
    var b = A.buf(w, h + 3);
    var bx = w >> 1;
    var n = 5 + ((rng.f() * 3) | 0);
    for (var i = 0; i < n; i++) {
      var spread = (i - (n - 1) / 2) / Math.max(1, (n - 1) / 2);
      var len = Math.round(h * (0.66 + rng.f() * 0.34) * (1 - Math.abs(spread) * 0.22));
      for (var s = 0; s < len; s++) {
        var t = s / len;
        var px = bx + spread * 5.5 * t * t;
        var py = h - 1 - s;
        A.set(b, Math.round(px), py, t > 0.7 ? cols[0] : (t > 0.32 ? cols[1] : cols[2]));
        if (s > 2 && s % 4 === 0) A.set(b, Math.round(px) + (spread >= 0 ? 1 : -1), py, cols[2]);
      }
    }
    A.fill(b, bx - 3, h, 7, 2, cols[2]);
    A.hline(b, bx - 4, h + 2, 9, cols[2]);
    return b;
  }

  function pMushroom(P, rng, cols) {           // 蘑菇：伞 + 菌褶 + 柄 + 白点
    var w = 13 + ((rng.f() * 3) | 0) * 2;
    var capH = 6;
    var stemH = 7 + ((rng.f() * 3) | 0);
    var b = A.buf(w, capH + stemH + 3);
    var cx = w >> 1;
    for (var y = 0; y < capH; y++) {
      var t = y / (capH - 1);
      var half = Math.round((w / 2 - 1) * Math.sqrt(Math.max(0, 1 - (1 - t) * (1 - t))));
      A.fill(b, cx - half, y, half * 2 + 1, 1, y < 2 ? cols[1] : cols[0]);
    }
    A.hline(b, 1, capH - 1, w - 2, cols[3]);
    A.fill(b, cx - 2, capH, 5, 1, cols[3]);
    A.fill(b, cx - 1, capH + 1, 3, stemH, cols[2]);
    A.vline(b, cx - 1, capH + 1, stemH, cols[3]);
    A.set(b, cx, 1, gc(G.WHITE));
    A.set(b, cx - 3, 2, gc(G.WHITE));
    A.set(b, cx + 3, 3, gc(G.WHITE));
    A.hline(b, cx - 3, capH + stemH + 1, 7, cols[3]);
    return b;
  }

  function pStone(P, rng, cols) {              // 圆润石块：受光面 + 投影
    var w = 14 + ((rng.f() * 6) | 0);
    var h = 9 + ((rng.f() * 4) | 0);
    var b = A.buf(w, h + 3);
    var cx = w >> 1;
    for (var y = 0; y < h; y++) {
      var t = y / (h - 1);
      var half = Math.round((w / 2 - 1) * Math.sqrt(Math.max(0, 1 - Math.pow(t * 2 - 1, 2))));
      A.fill(b, cx - half, y, half * 2 + 1, 1, t < 0.36 ? cols[1] : cols[0]);
    }
    A.fill(b, cx - 4, 2, 5, 2, cols[1]);
    A.hline(b, 2, h - 1, w - 4, cols[2]);
    A.hline(b, 1, h + 1, w - 2, cols[2]);
    if (rng.f() < 0.7) {
      for (var i = 0; i < 3; i++) A.set(b, 3 + ((rng.f() * (w - 6)) | 0), 1 + ((rng.f() * 2) | 0), cols[3]);
    }
    return b;
  }

  function pFlower(P, rng, cols) {             // 小花：茎 + 五瓣花冠
    var h = 13 + ((rng.f() * 5) | 0);
    var b = A.buf(11, h + 3);
    var cx = 5;
    A.fill(b, cx, 5, 1, h - 4, cols[2]);
    A.set(b, cx - 1, h - 5, cols[2]);
    A.set(b, cx + 1, h - 7, cols[2]);
    A.fill(b, cx - 1, 1, 3, 1, cols[0]);
    A.fill(b, cx - 2, 2, 5, 3, cols[0]);
    A.fill(b, cx - 1, 5, 3, 1, cols[0]);
    A.set(b, cx, 3, cols[1]);
    A.hline(b, cx - 2, h + 1, 5, cols[2]);
    return b;
  }

  function pCrystal(P, rng, cols) {            // 晶簇：2~3 根带棱面的尖柱
    var w = 13 + ((rng.f() * 5) | 0);
    var h = 16 + ((rng.f() * 8) | 0);
    var b = A.buf(w, h + 3);
    var n = 2 + ((rng.f() * 2) | 0);
    for (var i = 0; i < n; i++) {
      var bx = 2 + ((rng.f() * (w - 6)) | 0);
      var bh = Math.round(h * (0.55 + rng.f() * 0.45));
      var bw = 4 + ((rng.f() * 2) | 0);
      for (var y = 0; y < bh; y++) {
        var t = y / bh;
        var shrink = t > 0.7 ? Math.round((t - 0.7) * bw * 2.2) : 0;
        var ww = Math.max(1, bw - shrink);
        var lx = bx + ((bw - ww) >> 1);
        A.fill(b, lx, h - y, ww, 1, y < bh * 0.25 ? cols[1] : cols[0]);
        if (ww > 1) A.set(b, lx, h - y, cols[2]);        // 左侧暗棱
      }
    }
    A.hline(b, 1, h + 1, w - 2, cols[2]);
    return b;
  }

  function pVine(P, rng, cols) {               // 垂落藤蔓：主蔓 + 明显的叶
    var len = 18 + ((rng.f() * 14) | 0);
    var b = A.buf(13, len);
    for (var y = 0; y < len; y++) {
      var xx = 6 + Math.round(Math.sin(y * 0.34) * 3);
      A.fill(b, xx, y, 2, 1, cols[0]);
      if (y % 6 === 2) { A.fill(b, xx + 2, y, 4, 2, cols[1]); A.set(b, xx + 2, y, cols[0]); }
      if (y % 6 === 5) { A.fill(b, xx - 4, y, 4, 2, cols[1]); A.set(b, xx - 2, y, cols[0]); }
    }
    return b;
  }

  function pLily(P, rng, cols) {               // 荷叶：圆盘 + 缺口 + 叶脉
    var w = 16 + ((rng.f() * 6) | 0);
    var b = A.buf(w, 9);
    var cx = w >> 1, cy = 4;
    for (var y = 0; y < 8; y++) {
      var t = y / 7;
      var half = Math.round((w / 2 - 1) * Math.sqrt(Math.max(0, 1 - Math.pow(t * 2 - 1, 2))));
      A.fill(b, cx - half, y, half * 2 + 1, 1, t < 0.4 ? cols[1] : cols[0]);
    }
    A.set(b, cx + 1, cy, 0);
    A.set(b, cx + 2, cy, 0);
    A.set(b, cx, cy, cols[2]);
    for (var k = 1; k <= 4; k++) A.set(b, cx - k, cy - (k >> 1), cols[2]);
    A.hline(b, 2, 8, w - 4, cols[2]);
    return b;
  }

  function pCoral(P, rng, cols) {              // 珊瑚丛：三根分叉的枝
    var w = 15 + ((rng.f() * 6) | 0);
    var h = 14 + ((rng.f() * 7) | 0);
    var b = A.buf(w, h + 3);
    for (var i = 0; i < 3; i++) {
      var bx = 3 + i * 4 + ((rng.f() * 2) | 0);
      var bh = Math.round(h * (0.6 + rng.f() * 0.4));
      for (var y = 0; y < bh; y++) {
        var xx = bx + Math.round(Math.sin(y * 0.5 + i * 2) * 1.5);
        A.set(b, xx, h - y, y > bh - 3 ? cols[1] : cols[0]);
        if (y === Math.round(bh * 0.55)) A.set(b, xx + 1, h - y, cols[1]);
      }
    }
    A.hline(b, 1, h + 1, w - 2, cols[2]);
    return b;
  }

  function pShell(P, rng, cols) {              // 贝壳：扇形 + 放射纹
    var w = 13 + ((rng.f() * 4) | 0);
    var b = A.buf(w, 10);
    var cx = w >> 1;
    for (var y = 0; y < 9; y++) {
      var t = y / 8;
      var half = Math.round(t * (w / 2 - 1));
      A.fill(b, cx - half, y, half * 2 + 1, 1, y < 2 ? cols[1] : cols[0]);
    }
    for (var i = -2; i <= 2; i++) {
      for (var s = 2; s < 9; s++) A.set(b, cx + Math.round(i * s * 0.32), s, cols[1]);
    }
    A.hline(b, 2, 9, w - 4, cols[2]);
    return b;
  }

  function pFlag(P, rng, cols) {               // 飘带旗
    var h = 20 + ((rng.f() * 10) | 0);
    var b = A.buf(16, h + 2);
    A.vline(b, 1, 1, h - 1, cols[2]);
    A.set(b, 1, 0, cols[1]);
    for (var y = 2; y < h - 5; y++) {
      var ww = 9 + Math.round(Math.sin(y * 0.55) * 3);
      A.fill(b, 2, y, ww, 1, ((y >> 1) & 1) ? cols[0] : cols[1]);
    }
    A.hline(b, 0, h, 5, cols[2]);
    return b;
  }

  function pPillar(P, rng, cols) {             // 石笋 / 水晶立柱
    var w = 12 + ((rng.f() * 7) | 0);
    var h = 18 + ((rng.f() * 16) | 0);
    var b = A.buf(w, h + 3);
    for (var y = 0; y < h; y++) {
      var t = y / h;
      var ww = Math.max(2, Math.round(w * (1 - t * 0.55)));
      var lx = (w - ww) >> 1;
      A.fill(b, lx, y, ww, 1, y < 3 ? cols[1] : cols[0]);
      A.set(b, lx, y, cols[2]);
    }
    A.hline(b, 1, h + 1, w - 2, cols[2]);
    return b;
  }

  function pRing(P, rng, cols) {               // 铜色机关环
    var w = 15 + ((rng.f() * 7) | 0);
    var b = A.buf(w, 9);
    A.ellipse(b, w >> 1, 4, (w >> 1) - 1, 3, cols[0]);
    A.ellipse(b, w >> 1, 4, (w >> 1) - 4, 1, 0);
    A.set(b, (w >> 1) - 2, 2, cols[1]);
    A.set(b, (w >> 1) + 2, 3, cols[1]);
    A.hline(b, 2, 8, w - 4, cols[1]);
    return b;
  }

  function pPuff(P, rng, cols) {               // 云絮 / 云块
    var w = 18 + ((rng.f() * 12) | 0);
    var b = A.buf(w, 12);
    A.ellipse(b, w >> 1, 7, (w >> 1) - 1, 4, cols[0]);
    A.ellipse(b, (w >> 1) - 4, 5, (w >> 2), 3, cols[1]);
    A.ellipse(b, (w >> 1) + 5, 6, (w >> 3) + 1, 3, cols[1]);
    A.dither(b, 1, 9, w - 2, 3, cols[2], 6);
    return b;
  }

  function pLog(P, rng, cols) {                // 倒伏树干：圆柱 + 端面年轮
    var w = 26 + ((rng.f() * 10) | 0);
    var h = 11 + ((rng.f() * 3) | 0);
    var b = A.buf(w, h + 3);
    var cy = (h - 1) / 2;
    for (var x = 0; x < w; x++) {
      var edge = Math.min(1, Math.min(x, w - 1 - x) / 3);
      var half = Math.round((h / 2 - 1) * (0.55 + 0.45 * edge));
      for (var y = 0; y < h; y++) {
        var d = Math.abs(y - cy);
        if (d <= half) A.set(b, x, y, d < half * 0.45 ? cols[1] : cols[0]);
      }
    }
    for (var i = 0; i < 5; i++) {
      var lx = 5 + ((rng.f() * (w - 12)) | 0);
      A.hline(b, lx, Math.round(cy) - 1, 4 + ((rng.f() * 4) | 0), cols[2]);
    }
    A.ellipse(b, w - 4, Math.round(cy), 3, 3, cols[2]);
    A.ellipse(b, w - 4, Math.round(cy), 1, 1, cols[1]);
    A.hline(b, 2, h + 1, w - 4, cols[3]);
    return b;
  }

  function pMural(P, rng, cols) {              // 星象壁画 / 符文砖
    var w = 18 + ((rng.f() * 8) | 0);
    var h = 14 + ((rng.f() * 6) | 0);
    var b = A.buf(w, h + 3);
    A.fill(b, 0, 0, w, h, cols[0]);
    A.rect(b, 0, 0, w, h, cols[1]);
    for (var i = 0; i < 4; i++) {
      A.set(b, 2 + ((rng.f() * (w - 4)) | 0), 2 + ((rng.f() * (h - 4)) | 0), cols[2]);
    }
    A.hline(b, 3, h >> 1, w - 6, cols[2]);
    A.hline(b, 2, h + 1, w - 4, cols[1]);
    return b;
  }

  // 每主题的装饰配方：8 类以上，各含 2~3 变体（§5.4）
  var PROP_SETS = {
    forest: [
      { fn: 'tuft', cols: [4, 3, 6], c: [1, 2, 3] },
      { fn: 'mushroom', cols: [4, 2, 9, 10], c: [1, 2, 3] },
      { fn: 'flower', cols: [0, 15, 5], c: [1, 2] },
      { fn: 'stone', cols: [11, 7, 12, 6], c: [1, 2, 3] },
      { fn: 'log', cols: [9, 8, 10, 6], c: [1, 2] },
      { fn: 'vine', cols: [5, 4], c: [1, 2, 3] },
      { fn: 'tuft', cols: [3, 2, 5], c: [1, 2] },
    ],
    amber: [
      { fn: 'crystal', cols: [8, 11, 4], c: [1, 2, 3] },
      { fn: 'pillar', cols: [5, 8, 4], c: [1, 2] },
      { fn: 'stone', cols: [6, 4, 7, 9], c: [1, 2, 3] },
      { fn: 'vine', cols: [8, 5], c: [1, 2] },
      { fn: 'flower', cols: [2, 11, 6], c: [1, 2] },
      { fn: 'crystal', cols: [11, 0, 5], c: [1, 2] },
      { fn: 'tuft', cols: [5, 6, 7], c: [1, 2] },
    ],
    cloud: [
      { fn: 'puff', cols: [0, 1, 2], c: [1, 2, 3] },
      { fn: 'flag', cols: [4, 8, 3], c: [1, 2] },
      { fn: 'flower', cols: [0, 8, 5], c: [1, 2] },
      { fn: 'stone', cols: [5, 6, 12, 3], c: [1, 2] },
      { fn: 'vine', cols: [2, 3], c: [1, 2] },
      { fn: 'puff', cols: [1, 2, 3], c: [1, 2] },
      { fn: 'tuft', cols: [2, 4, 6], c: [1, 2] },
    ],
    water: [
      { fn: 'lily', cols: [9, 8, 6], c: [1, 2, 3] },
      { fn: 'coral', cols: [9, 8, 6], c: [1, 2] },
      { fn: 'shell', cols: [2, 1, 4], c: [1, 2, 3] },
      { fn: 'flower', cols: [11, 1, 8], c: [1, 2] },
      { fn: 'stone', cols: [6, 4, 12, 10], c: [1, 2] },
      { fn: 'coral', cols: [8, 11, 6], c: [1, 2] },
      { fn: 'tuft', cols: [9, 8, 6], c: [1, 2] },
    ],
    star: [
      { fn: 'pillar', cols: [5, 2, 7], c: [1, 2, 3] },
      { fn: 'mural', cols: [6, 8, 0], c: [1, 2] },
      { fn: 'ring', cols: [8, 11], c: [1, 2, 3] },
      { fn: 'crystal', cols: [2, 0, 4], c: [1, 2] },
      { fn: 'stone', cols: [5, 6, 12, 8], c: [1, 2] },
      { fn: 'vine', cols: [11, 2], c: [1, 2] },
      { fn: 'flower', cols: [0, 8, 5], c: [1, 2] },
    ],
  };

  var propCache = new Map();
  function buildProp(themeKey, setIndex, variant) {
    var key = themeKey + ':' + setIndex + ':' + variant;
    var hit = propCache.get(key);
    if (hit) return hit;
    var P = CT.Palette.get(themeKey);
    var sets = PROP_SETS[themeKey];
    var spec = sets[setIndex % sets.length];
    var cols = spec.cols.map(function (i) { return P.c[i]; });
    var rng = new CT.Rng(CT.hash2(setIndex, variant, CT.seedOf('prop:' + themeKey)));
    var fn = PROPS[spec.fn];
    var b = fn(P, rng, cols);
    // 前景装饰统一加深色描边：地形本身也是同色系，没有描边装饰会糊进地面
    b = A.addOutline(b, P.c[14]);
    propCache.set(key, b);
    return b;
  }

  var PROPS = {
    tuft: pTuft, mushroom: pMushroom, stone: pStone, flower: pFlower,
    crystal: pCrystal, vine: pVine, lily: pLily, coral: pCoral,
    shell: pShell, flag: pFlag, pillar: pPillar, ring: pRing,
    puff: pPuff, log: pLog, mural: pMural,
  };

  function propSetCount(themeKey) { return PROP_SETS[themeKey].length; }

  // -------------------------------------------------------------- UI 面板
  // §7.5 单线像素边框，边框线宽 1 像素
  function buildPanel(w, h, P, accent) {
    var b = A.buf(w, h);
    A.fill(b, 0, 0, w, h, gc(G.PANEL));
    A.rect(b, 0, 0, w, h, gc(G.PANEL_HI));
    A.rect(b, 1, 1, w - 2, h - 2, gc(G.PANEL_LO));
    // 四角装饰角标
    var c = accent !== undefined ? accent : gc(G.ACCENT);
    A.set(b, 2, 2, c); A.set(b, 3, 2, c);
    A.set(b, w - 3, 2, c); A.set(b, w - 4, 2, c);
    A.set(b, 2, h - 3, c); A.set(b, 3, h - 3, c);
    A.set(b, w - 3, h - 3, c); A.set(b, w - 4, h - 3, c);
    return b;
  }

  CT.Sprites = {
    HERO_W: HERO_W, HERO_H: HERO_H,
    ANIM: ANIM,
    buildHero: buildHero,
    buildFootGlow: buildFootGlow,
    buildCrystal: buildCrystal,
    buildTreasure: buildTreasure,
    buildMark: buildMark,
    buildNpc: buildNpc,
    buildProp: buildProp,
    propSetCount: propSetCount,
    buildPanel: buildPanel,
    PROP_SETS: PROP_SETS,
    reset: function () { heroCache = {}; npcCache = {}; propCache.clear(); },
  };
})();

  <script>
/* ==== src/art/gen_illustrations.js ==== */
/* 晶途拾光 — 旅途留影（图鉴插画）
 * --------------------------------------------------------------------------
 * 每拾起一枚本源彩晶，图鉴里解锁一张 192 × 128 的场景插画。
 * 这些不是游戏截图 —— 是单独的构图：更大的画幅、更细的抖动渐变、
 * 分层剪影、明确的光向和引导线，主角在画面里只占很小一块。
 *
 * 需求要求「精致一点」，所以这里比游戏内美术多做几件事：
 *   · 天光用多级抖动过渡，而不是单一色块
 *   · 每张图都有明确的光源方向与地面反光
 *   · 前景压暗取景框（vignette），把视线收到主角身上
 *   · 主角用 2 倍整像素放大（32 × 48），在 192 × 128 画布里仍是小人物
 *
 * 调色板仍然只用该主题的 16 色 + 全局角色色，符合 §7.2。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});
  var A = CT.Art;
  var G = CT.Palette.G;
  var gc = CT.Palette.gc;

  var W = 192, H = 128;

  // ---------------------------------------------------------------- 公共件
  // 天空：分层色带 + 3 行窄抖动过渡。
  // 整片 16 级抖动在大画幅上远看是一层噪点，分层色带才有插画感。
  function skyGradient(b, P, topIdx, botIdx, y0, y1) {
    var top = P.c[topIdx], bot = P.c[botIdx];
    var bandH = 7;
    for (var y = y0; y < y1; y++) {
      var t = (y - y0) / Math.max(1, (y1 - y0 - 1));
      var band = Math.floor(t * bandH);
      var inBand = (y - y0) % (bandH * 1) ;
      var edge = t * bandH - band;                 // 0..1，处于带内位置
      var useBot = edge > 0.62;                     // 后 38% 换下一档色
      var blink = CT.BAYER4[(y & 3) * 4];
      for (var x = 0; x < W; x++) {
        var c = top;
        if (useBot) {
          // 窄过渡：只在带尾 3 行做抖动
          var nearEdge = edge > 0.86;
          c = (!nearEdge || CT.BAYER4[(y & 3) * 4 + (x & 3)] < 6) ? bot : top;
        } else if (band > 0) {
          c = (band >= bandH - 1) ? top : bot;
        }
        b.d[y * W + x] = c;
      }
    }
  }

  function ridge(b, P, color, baseY, amp, freq, phase) {
    for (var x = 0; x < W; x++) {
      var h = Math.sin((x / W) * Math.PI * 2 * freq + phase) * amp
            + Math.sin((x / W) * Math.PI * 2 * (freq * 2.3) + phase * 1.7) * amp * 0.35;
      var top = Math.round(baseY + h);
      if (top < 0) top = 0;
      if (top < H) b.d[top * W + x] = P.c[color];
      for (var y = top; y < H; y++) b.d[y * W + x] = P.c[color];
    }
  }

  function lightShaft(b, P, x0, y0, spread, height, colorIdx, strength) {
    for (var y = 0; y < height; y++) {
      var t = y / height;
      var half = Math.round(spread * (0.35 + t * 0.9));
      var cx = x0 + Math.round(t * 6);
      for (var x = cx - half; x <= cx + half; x++) {
        if (x < 0 || x >= W) continue;
        var yy = y0 + y;
        if (yy < 0 || yy >= H) continue;
        var lv = Math.round(strength * (1 - t * 0.75));
        if (CT.BAYER4[(yy & 3) * 4 + (x & 3)] < lv) b.d[yy * W + x] = P.c[colorIdx];
      }
    }
  }

  function groundGlow(b, P, y0, colorIdx, strength) {
    for (var y = y0; y < Math.min(H, y0 + 26); y++) {
      var lv = Math.round(strength * (1 - (y - y0) / 26));
      for (var x = 0; x < W; x++) {
        if (CT.BAYER4[(y & 3) * 4 + (x & 3)] < lv) b.d[y * W + x] = P.c[colorIdx];
      }
    }
  }

  function vignette(b, color) {
    for (var y = 0; y < H; y++) {
      for (var x = 0; x < W; x++) {
        var dx = (x - W / 2) / (W / 2);
        var dy = (y - H / 2) / (H / 2);
        var d = dx * dx + dy * dy;
        if (d < 0.78) continue;
        var lv = Math.min(3, Math.round((d - 0.78) * 8));
        if (CT.BAYER4[(y & 3) * 4 + (x & 3)] < lv) b.d[y * W + x] = color;
      }
    }
  }

  // 主角：取一帧动作，2 倍整像素放大后贴上去
  function stampHero(b, heroFrames, anim, frameIdx, x, y, flip) {
    var def = heroFrames[anim];
    var f = def.frames[Math.min(frameIdx, def.frames.length - 1)];
    for (var sy = 0; sy < 24; sy++) {
      for (var sx = 0; sx < 16; sx++) {
        var c = f.d[sy * 16 + (flip ? 15 - sx : sx)];
        if (c === 0) continue;
        for (var oy = 0; oy < 2; oy++) {
          for (var ox = 0; ox < 2; ox++) {
            var tx = x + sx * 2 + ox, ty = y + sy * 2 + oy;
            if (tx < 0 || tx >= W || ty < 0 || ty >= H) continue;
            b.d[ty * W + tx] = c;
          }
        }
      }
    }
  }

  function dots(b, P, colorIdx, n, rng, y0, y1) {
    for (var i = 0; i < n; i++) {
      var x = (rng.f() * W) | 0;
      var y = y0 + ((rng.f() * (y1 - y0)) | 0);
      if (y < 0 || y >= H) continue;
      b.d[y * W + x] = P.c[colorIdx];
      if (rng.f() < 0.3 && x + 1 < W) b.d[y * W + x + 1] = P.c[colorIdx];
    }
  }

  // ---------------------------------------------------------------- 五张图
  // 1 青藓初林 — 雨里的第一段路
  function sceneForest(P, hero, rng) {
    var b = A.buf(W, H);
    skyGradient(b, P, 2, 1, 0, 74);
    ridge(b, P, 10, 58, 10, 3, 0.4);
    ridge(b, P, 6, 72, 8, 5, 1.9);
    for (var i = 0; i < 6; i++) {
      var tx = 8 + i * 34 + ((rng.f() * 10) | 0);
      var tw = 5 + ((rng.f() * 3) | 0);
      for (var y = 22; y < 96; y++) {
        for (var x = tx; x < tx + tw && x < W; x++) b.d[y * W + x] = P.c[9];
      }
      A.ellipse(b, tx + (tw >> 1), 26, 18, 9, P.c[6]);
      A.ellipse(b, tx + (tw >> 1) - 6, 22, 10, 6, P.c[5]);
    }
    for (var r = 0; r < 130; r++) {
      var rx = (rng.f() * (W + 20)) | 0;
      var ry = (rng.f() * 92) | 0;
      var len = 3 + ((rng.f() * 4) | 0);
      for (var k = 0; k < len; k++) {
        var px = rx - k, py = ry + k;
        if (px >= 0 && px < W && py < H) b.d[py * W + px] = P.c[3];
      }
    }
    ridge(b, P, 8, 96, 2, 2, 0.9);
    for (var lx = 0; lx < W; lx++) {
      var ly = 98 + Math.round(Math.sin(lx * 0.08) * 2);
      for (var yy = ly; yy < H; yy++) b.d[yy * W + lx] = P.c[5];
      b.d[ly * W + lx] = P.c[1];
    }
    groundGlow(b, P, 99, 2, 4);
    lightShaft(b, P, 132, 6, 16, 74, 0, 7);
    stampHero(b, hero, 'walk', 2, 96, 54, false);
    dots(b, P, 15, 26, rng, 40, 96);
    vignette(b, P.c[14]);
    return b;
  }

  // 2 琥珀岩窟 — 黑暗里学会坐着
  function sceneAmber(P, hero, rng) {
    var b = A.buf(W, H);
    b.d.fill(P.c[13]);
    ridge(b, P, 12, 34, 12, 2, 0.6);
    for (var i = 0; i < 16; i++) {
      var tx = (rng.f() * W) | 0;
      var hh = 10 + ((rng.f() * 26) | 0);
      var ww = 3 + ((rng.f() * 4) | 0);
      for (var y = 0; y < hh; y++) {
        var w2 = Math.max(1, Math.round(ww * (1 - y / hh)));
        for (var x = tx; x < tx + w2 && x < W; x++) b.d[y * W + x] = P.c[12];
      }
    }
    for (var gy = 96; gy < H; gy++) {
      for (var gx = 0; gx < W; gx++) {
        b.d[gy * W + gx] = gy < 99 ? P.c[6] : P.c[5];
      }
    }
    groundGlow(b, P, 96, 8, 7);
    for (var c = 0; c < 7; c++) {
      var cx = 10 + ((rng.f() * (W - 20)) | 0);
      var ch = 12 + ((rng.f() * 22) | 0);
      for (var yy = 0; yy < ch; yy++) {
        var ww2 = Math.max(1, Math.round(4 * (yy / ch)));
        for (var xx = cx; xx < cx + ww2 && xx < W; xx++) b.d[(96 - yy) * W + xx] = P.c[8];
      }
      if (cx < W) b.d[(96 - ch) * W + cx] = P.c[11];
    }
    for (var ry = 0; ry < 18; ry++) {
      var lv = Math.round(8 * (1 - ry / 18));
      for (var rx = 0; rx < 44; rx++) {
        var px = 74 + rx, py = 96 + ry;
        if (px < W && py < H && CT.BAYER4[(py & 3) * 4 + (px & 3)] < lv) b.d[py * W + px] = P.c[11];
      }
    }
    lightShaft(b, P, 150, 4, 10, 60, 8, 5);
    stampHero(b, hero, 'pickup', 1, 84, 80, false);
    dots(b, P, 8, 22, rng, 30, 96);
    vignette(b, P.c[14]);
    return b;
  }

  // 3 云漫高台 — 被风抛起来
  function sceneCloud(P, hero, rng) {
    var b = A.buf(W, H);
    skyGradient(b, P, 3, 0, 0, 110);
    for (var i = 0; i < 9; i++) {
      var cx = (rng.f() * W) | 0;
      var cy = 30 + ((rng.f() * 46) | 0);
      var cw = 24 + ((rng.f() * 34) | 0);
      A.ellipse(b, cx, cy, cw >> 1, 5 + ((rng.f() * 4) | 0), P.c[2]);
      A.ellipse(b, cx - 8, cy - 3, (cw >> 2), 4, P.c[1]);
    }
    for (var k = 0; k < 4; k++) {
      var ix = 14 + k * 46 + ((rng.f() * 12) | 0);
      var iy = 78 + ((rng.f() * 18) | 0);
      var iw = 26 + ((rng.f() * 20) | 0);
      // 平整草地顶面 + 下面收窄的岩体，才像块浮岛而不是三角锥
      for (var tx2 = ix - (iw >> 1); tx2 <= ix + (iw >> 1); tx2++) {
        if (tx2 < 0 || tx2 >= W) continue;
        for (var ty2 = iy - 1; ty2 <= iy + 2; ty2++) {
          if (ty2 >= 0 && ty2 < H) b.d[ty2 * W + tx2] = P.c[1];
        }
        if (iy + 3 < H) b.d[(iy + 3) * W + tx2] = P.c[3];
      }
      for (var yy = iy + 4; yy < Math.min(H, iy + 22); yy++) {
        var t = (yy - (iy + 4)) / 18;
        var ww = Math.round((iw / 2) * (1 - t * 0.9));
        for (var xx = ix - ww; xx <= ix + ww; xx++) {
          if (xx >= 0 && xx < W) b.d[yy * W + xx] = t > 0.5 ? P.c[4] : P.c[5];
        }
      }
    }
    for (var w = 0; w < 26; w++) {
      var wx = (rng.f() * W) | 0;
      var wy = 20 + ((rng.f() * 90) | 0);
      var len = 8 + ((rng.f() * 16) | 0);
      for (var s = 0; s < len; s++) {
        var px = wx + s, py = wy + Math.round(s * 0.25);
        if (px < W && py < H && CT.BAYER4[(py & 3) * 4 + (px & 3)] < 9) b.d[py * W + px] = P.c[1];
      }
    }
    for (var bd = 0; bd < 3; bd++) {
      var bx = 26 + bd * 16, by = 26 + bd * 5;
      if (bx + 3 < W && by < H) {
        b.d[by * W + bx] = P.c[10];
        b.d[(by - 1) * W + bx + 1] = P.c[10];
        b.d[by * W + bx + 2] = P.c[10];
        b.d[(by - 1) * W + bx + 3] = P.c[10];
      }
    }
    stampHero(b, hero, 'jump', 1, 118, 34, false);
    vignette(b, P.c[14]);
    return b;
  }

  // 4 碧泽水庭 — 水涨到膝盖
  function sceneWater(P, hero, rng) {
    var b = A.buf(W, H);
    skyGradient(b, P, 3, 1, 0, 66);
    ridge(b, P, 6, 62, 4, 2, 1.2);
    for (var i = 0; i < 3; i++) {
      var px = 26 + i * 62, py = 44;
      for (var x = 0; x < 26; x++) for (var y = 0; y < 6; y++) {
        if (px + x < W) b.d[(py + y) * W + px + x] = P.c[12];
      }
      for (var c = 0; c < 3; c++) for (var y2 = 0; y2 < 14; y2++) {
        if (px + 3 + c * 9 < W) b.d[(py + 6 + y2) * W + px + 3 + c * 9] = P.c[12];
      }
    }
    for (var y = 66; y < H; y++) {
      for (var x2 = 0; x2 < W; x2++) {
        var wave = Math.sin(x2 * 0.12 + y * 0.5) * 0.5 + 0.5;
        b.d[y * W + x2] = (y % 7 === 0 && wave > 0.6) ? P.c[2] : P.c[4];
      }
    }
    for (var r = 0; r < 7; r++) {
      var rx = (rng.f() * W) | 0, ry = 72 + ((rng.f() * 46) | 0);
      var rr = 6 + ((rng.f() * 12) | 0);
      for (var a = 0; a < 26; a++) {
        var ang = (a / 26) * Math.PI * 2;
        var ex = Math.round(rx + Math.cos(ang) * rr);
        var ey = Math.round(ry + Math.sin(ang) * rr * 0.32);
        if (ex >= 0 && ex < W && ey >= 0 && ey < H) b.d[ey * W + ex] = P.c[1];
      }
    }
    for (var l = 0; l < 5; l++) {
      var lx = 12 + ((rng.f() * (W - 24)) | 0);
      var ly = 76 + ((rng.f() * 40) | 0);
      A.ellipse(b, lx, ly, 9, 3, P.c[9]);
      A.ellipse(b, lx - 2, ly - 1, 4, 2, P.c[8]);
    }
    groundGlow(b, P, 66, 2, 5);
    stampHero(b, hero, 'pickup', 1, 88, 62, false);
    dots(b, P, 15, 24, rng, 40, 110);
    vignette(b, P.c[14]);
    return b;
  }

  // 5 星纹古殿 — 掌心的一线光
  function sceneStar(P, hero, rng) {
    var b = A.buf(W, H);
    b.d.fill(P.c[13]);
    skyGradient(b, P, 13, 12, 0, 92);
    for (var i = 0; i < 4; i++) {
      var px = 18 + i * 50;
      for (var y = 10; y < 96; y++) {
        for (var x = px; x < px + 12 && x < W; x++) b.d[y * W + x] = P.c[11];
      }
      for (var y2 = 8; y2 < 12; y2++) {
        for (var x2 = px - 2; x2 < px + 14 && x2 < W; x2++) {
          if (x2 >= 0) b.d[y2 * W + x2] = P.c[8];
        }
      }
    }
    for (var s = 0; s < 40; s++) {
      var sx = (rng.f() * W) | 0, sy = 12 + ((rng.f() * 60) | 0);
      b.d[sy * W + sx] = P.c[2];
    }
    for (var gy = 96; gy < H; gy++) {
      for (var gx = 0; gx < W; gx++) {
        b.d[gy * W + gx] = (gx % 24 < 2 || gy % 16 < 2) ? P.c[12] : P.c[6];
      }
    }
    lightShaft(b, P, 96, 0, 13, 100, 0, 9);
    groundGlow(b, P, 96, 0, 6);
    stampHero(b, hero, 'celebrate', 1, 88, 48, false);
    A.ellipse(b, 104, 56, 3, 3, P.c[15]);
    A.ellipse(b, 104, 56, 1, 1, gc(G.WHITE));
    for (var r = 0; r < 10; r++) {
      var lvl = 10 - r;
      if (lvl <= 0) continue;
      for (var a = 0; a < 60; a++) {
        var ang = (a / 60) * Math.PI * 2;
        var ex2 = Math.round(104 + Math.cos(ang) * (4 + r * 2));
        var ey2 = Math.round(56 + Math.sin(ang) * (4 + r * 2));
        if (ex2 >= 0 && ex2 < W && ey2 >= 0 && ey2 < H &&
            CT.BAYER4[(ey2 & 3) * 4 + (ex2 & 3)] < lvl / 2) {
          b.d[ey2 * W + ex2] = P.c[15];
        }
      }
    }
    dots(b, P, 1, 30, rng, 4, 92);
    vignette(b, P.c[14]);
    return b;
  }

  var SCENES = {
    forest: sceneForest,
    amber: sceneAmber,
    cloud: sceneCloud,
    water: sceneWater,
    star: sceneStar,
  };

  var cache = {};
  function build(themeKey) {
    if (cache[themeKey]) return cache[themeKey];
    var P = CT.Palette.get(themeKey);
    var hero = CT.Sprites.buildHero(themeKey);
    var rng = new CT.Rng(CT.seedOf('gallery:' + themeKey));
    var fn = SCENES[themeKey];
    if (!fn) throw new Error('illustration: unknown theme ' + themeKey);
    var b = fn(P, hero, rng);
    cache[themeKey] = b;
    return b;
  }

  CT.Illustration = {
    W: W, H: H,
    build: build,
    reset: function () { cache = {}; },
  };
})();

":"water","npc":"河蚌灵","rounds":[{"lines":["水纹荡到岸边，又慢慢退回去。","我开合得慢，贝壳里的光就晃得慢。"]},{"lines":["睡莲的根在泥里，花却贴着水面。"]},{"lines":["亭台的倒影碎过几回，水一静又合上。","你看见水底那些浅绿的小点了吗？"]}]},{"theme":"water","npc":"苔痕向导","rounds":[{"lines":["石阶有两级没在水下，踩上去会响。","木杖探水，能知道荷叶平台的边。"]},{"lines":["亭台的水上部分，比岸边的木头干。"]},{"lines":["涟漪散开的时候，水底的珊瑚会晃。","你听见亭角滴水的声音了吗？"]}]},{"theme":"star","npc":"石苔长老","rounds":[{"lines":["回廊的砖缝里积着银尘，脚步一过就淡。","我在这里坐得久了，苔从脚边爬到膝上。"]},{"lines":["星象壁画的弧线，比地砖上的符文浅。"]},{"lines":["铜环转起来时，回廊里会有一点风。","你有没有看见光斑停在石柱同一侧？"]}]},{"theme":"star","npc":"苔痕向导","rounds":[{"lines":["古殿的入口很宽，走进去声音会变轻。","我的木杖在石砖上敲两下，回音不一样。"]},{"lines":["水晶立柱下面的光斑，比回廊里亮。"]},{"lines":["壁画上的星点，排到铜环那边就断了。","机关环上的齿口朝着光斑，你看见了吗？"]}]}],"hints":[{"mech":"pressure_switch","levels":["侧门的灯一直没有亮。","圆石开关被踩住时灯才亮。","重物压住开关，门升起，人再过门。"]},{"mech":"light_beam","levels":["晶座那边还是一片暗。","反光块挡在光路上会改方向。","反光块被推到光里，光会折向晶座。"]},{"mech":"sequence_pads","levels":["石门前的地砖一直没有动静。","三块踏板要按壁画的纹样踩。","三块踏板按壁画顺序踩，石门就会打开。"]},{"mech":"wind","levels":["前面的浮台离得有点远。","侧面来风时，浮台会向前移。","拾光者站进风带，等浮台靠近再跳过去。"]},{"mech":"water_flow","levels":["前面的平台一直没有浮起来。","转盘能改变水流的方向。","转动转盘开闸后，水位升高，平台浮起。"]},{"mech":"rune_puzzle","levels":["石框里的纹样还缺着一角。","碎片散在回廊和石壁凹处。","碎片集齐后，按壁画纹样拼回石框。"]}],"glossary":[{"key":"hud_treasure","name":"宝物计数","desc":"右上角：整局收集进度"},{"key":"treasure","name":"拾遗宝物","desc":"拿到就记进图鉴，不影响过关"},{"key":"crystal","name":"本源彩晶","desc":"每个主题一枚，是通关凭证"},{"key":"mark","name":"守护印记","desc":"完成守护者的小请求才出现"},{"key":"rune","name":"符文碎片","desc":"集齐三块，再到符文台拼合"},{"key":"checkpoint","name":"存档石碑","desc":"在旁边停一下就会记下进度"},{"key":"exit","name":"出口石门","desc":"走进这扇门就算过关"},{"key":"door","name":"机关石门","desc":"机关接通后才会向两侧收起"},{"key":"boulder","name":"滚石","desc":"在地面来回滚，碰上掉一条命"},{"key":"pressure_switch","name":"踩压开关","desc":"站上去才通电，离开就断开"},{"key":"light_beam","name":"光路方块","desc":"把反光块推到光束上改变方向"},{"key":"sequence_pads","name":"时序踏板","desc":"按墙上标出的顺序踩才对"},{"key":"wind","name":"风场","desc":"上升气流能把人托起来"},{"key":"water_flow","name":"水位闸门","desc":"开闸水面上升，浮台跟着抬高"},{"key":"rune_altar","name":"符文台","desc":"三块碎片齐了，这里能拼合"},{"key":"npc","name":"旅伴","desc":"靠近按交互键，可以聊几句"}],"gallery":[{"theme":"forest","crystal":"翠源晶","title":"雨里的第一段路","caption":"他第一次离开家。兜帽被雨打湿，旧布包里只剩一块干粮。栈道很长，他没有回头。"},{"theme":"amber","crystal":"暖珀晶","title":"黑暗里学会坐着","caption":"石壁上的光要走很久才落下来。他学会在黑暗里坐着，用水滴数时间，等一束光挪到脚边。"},{"theme":"cloud","crystal":"流云晶","title":"被风抛起来","caption":"风把他推离地面。他第一次发现落点不在脚下，而在眼睛看得到的地方。"},{"theme":"water","crystal":"澜光晶","title":"水涨到膝盖","caption":"水位漫过膝盖，退路没了。他没有回头，把布包举过头顶，朝水声更响的方向走。"},{"theme":"star","crystal":"星核晶","title":"掌心的一线光","caption":"五枚彩晶在掌心连成一线。他终于明白，静流屏障从来没有拦住他，只是让他走得慢一点。"}],"story":"他出发时什么也没带，只想知道大陆的另一头是什么样子。在岩窟里学会等待，在风里学会相信自己的眼睛，在水里学会放下退路，在殿里学会回望。五枚彩晶连成一线的那天他才明白：屏障从来不是墙，是一条让他把路走完的理由。大陆的另一头和他想的不一样，比想的更亮一点。","ui":{"app_title":"晶途拾光","app_subtitle":"CRYSTAL TRAIL","menu_new":"开始新的旅程","menu_continue":"继续旅程","menu_codex":"图鉴","menu_settings":"设置","menu_hint_keys":"方向键选择 · 空格或 E 确认","menu_hint_tagline":"全程无战斗 · 无死亡惩罚","slot_title_new":"选择存档位","slot_title_load":"继续旅程","slot_name":"存档","slot_auto":"自动存档","slot_empty":"空存档","slot_unknown":"未知","slot_collect":"收集","slot_hint":"空格 / E 确认 · Esc 返回","name_title":"给拾光者起个名字","name_hint":"直接敲键盘输入 · 回车确定","name_random":"随机","name_confirm":"就这样","name_back":"返回","name_empty":"还没有名字","pause_title":"暂停","pause_resume":"继续","pause_codex":"图鉴","pause_title_screen":"返回标题","pause_progress":"收集完成度","settings_title":"设置","settings_bgm":"音乐音量","settings_sfx":"音效音量","settings_mute_bgm":"关闭音乐","settings_mute_sfx":"关闭音效","settings_touch":"触屏布局","settings_lang":"语言","settings_back":"返回","settings_hint":"←→ 调整 · 空格 切换 · Esc 返回","on":"开","off":"关","codex_title":"图鉴","codex_crystals":"本源彩晶","codex_marks":"守护印记","codex_unknown":"？？？","codex_not_found":"尚未寻得","codex_percent":"收集完成度","codex_hint":"←→ 翻页 · Esc 返回","codex_gallery":"旅途留影","codex_gallery_locked":"取得本源彩晶后解锁","codex_gallery_prev":"上一张","codex_gallery_next":"下一张","codex_story_title":"完整的故事","codex_story_locked":"集齐五枚彩晶，故事才会讲完","clear_title":"关卡完成","clear_collect":"收集","clear_next":"空格继续","clear_end":"空格查看结局","ending_title":"旅途的尽头","ending_hint":"空格返回标题","hud_crystal":"晶","msg_found":"拾得","msg_got_crystal":"获得","msg_saved":"进度已记录","msg_checkpoint":"已在石碑旁留下记号","msg_lives_out":"力气用尽 · 本关重新开始","msg_rune_done":"符文拼合完成","msg_rune_need":"还缺","msg_rune_have":"符文已经拼好了","msg_hint_title":"提示","tut_move":"按 ← → 向右走","tut_jump":"按空格跳一下","tut_jump_high":"按住空格能跳得更高","tut_drop":"按住 ↓ 可以穿过薄平台","tut_interact":"靠近石头按 E 说话","tut_done":"教程结束，慢慢走","tut_prompt":"按提示操作"}},
  text: { zh: {"crystals":[{"id":"crystal-forest","name":"翠源晶","desc":"叶脉间凝着一线浅绿的光"},{"id":"crystal-amber","name":"暖珀晶","desc":"石壁深处透出温润的橙色"},{"id":"crystal-cloud","name":"流云晶","desc":"云层里浮着淡青的流光"},{"id":"crystal-water","name":"澜光晶","desc":"水面下浮着一层蓝色亮光"},{"id":"crystal-star","name":"星核晶","desc":"星尘聚在银白色的核里"}],"marks":[{"id":"mark-forest","theme":"forest","name":"蕨影印记","desc":"叶脉的光留在手背上"},{"id":"mark-amber","theme":"amber","name":"琥珀印记","desc":"石壁的暖意停在指间"},{"id":"mark-cloud","theme":"cloud","name":"云阶印记","desc":"风把衣角吹得微微鼓起"},{"id":"mark-water","theme":"water","name":"涟漪印记","desc":"水纹一圈圈散在掌心"},{"id":"mark-star","theme":"star","name":"星纹印记","desc":"细小的光停在眉骨下方"}],"intros":[{"theme":"forest","npc":"云絮信使","intro":"青藓初林从一条旧木栈道开始。蕨叶从倒木底下伸出来，三种蘑菇长在背阴的石面上。溪水拐弯的地方，水底的卵石看得很清楚。蝴蝶常停在栈道扶手上。"},{"theme":"amber","npc":"云絮信使","intro":"琥珀岩窟的入口比外面暖。洞壁嵌着一簇簇暖色晶石，地下溪流从石笋旁边绕出去。水滴落在浅潭里，声音一下一下传得很远。地底小花长在石缝边上，花瓣朝着有光的方向。"},{"theme":"cloud","npc":"云絮信使","intro":"云漫高台的云阶一级级浮在风里。断裂石桥停在半空，飘带旗被风拉得很直。浮岛边上有几处花圃，飞鸟的剪影从高处掠过去。脚下的云层一直在慢慢移动。"},{"theme":"water","npc":"云絮信使","intro":"碧泽水庭的水面很平。睡莲贴着水开着，荷叶平台一块接一块，水上亭台的倒影被涟漪揉开。浅水里长着珊瑚丛，贝壳半张半合。萤色浮游生物聚在石阶旁边，像一层很淡的雾。"},{"theme":"star","npc":"云絮信使","intro":"星纹古殿的回廊铺着符文地砖。星象壁画在墙上排成弧线，水晶立柱把光落成一片片光斑。铜色机关环嵌在石壁里，星尘停得很低。脚步声在砖面上轻轻回响。"}],"blessings":[{"theme":"forest","guardian":"石苔长老","blessing":"苔从石缝里长出来时，光会在叶背停一会儿。"},{"theme":"amber","guardian":"石苔长老","blessing":"洞里的暖意走得很慢，石缝里的苔还记得旧日的光。"},{"theme":"cloud","guardian":"云絮信使","blessing":"云阶承得住脚步，风也愿意把轻的东西送到对面。"},{"theme":"water","guardian":"河蚌灵","blessing":"贝壳开合的时候，水底的亮光会跟着晃一晃。"},{"theme":"star","guardian":"石苔长老","blessing":"星尘落得很轻，回廊里的光斑会替脚步留着位置。"}],"treasures":[{"id":"forest-01-t1","theme":"forest","level":"forest-01","kind":"side","name":"蕨尖露水","desc":"叶尖挂着一滴还没落下的水","place":"栈道左侧蕨丛"},{"id":"forest-01-t2","theme":"forest","level":"forest-01","kind":"side","name":"三色蘑菇伞","desc":"三朵伞盖挨着，边缘有些缺","place":"倒木北侧根旁"},{"id":"forest-02-t1","theme":"forest","level":"forest-02","kind":"side","name":"青苔石纹","desc":"石面上留着一圈细细的纹路","place":"浅溪第三块石"},{"id":"forest-02-t2","theme":"forest","level":"forest-02","kind":"side","name":"倒木年轮","desc":"断面上浅褐的圈已经发暗","place":"倒伏树干断口"},{"id":"forest-03-t1","theme":"forest","level":"forest-03","kind":"side","name":"蒲公英绒毛","desc":"白色绒毛被风分开了一点","place":"溪岸蒲公英丛"},{"id":"forest-03-t2","theme":"forest","level":"forest-03","kind":"side","name":"蝶翼薄粉","desc":"翅上落着很细的浅色鳞粉","place":"栈道扶手上方"},{"id":"forest-04-t1","theme":"forest","level":"forest-04","kind":"side","name":"树洞里的光","desc":"洞壁深处留着一层浅亮","place":"老槐树洞口"},{"id":"forest-04-t2","theme":"forest","level":"forest-04","kind":"side","name":"溪底卵石","desc":"石面被水磨得圆润发亮","place":"浅溪转弯处"},{"id":"forest-04-t3","theme":"forest","level":"forest-04","kind":"side","name":"栈道旧钉痕","desc":"旧木板上留着生锈的小圆点","place":"木栈道第六块"},{"id":"forest-05-t1","theme":"forest","level":"forest-05","kind":"side","name":"蕨背孢子","desc":"叶背排着一列浅褐小点","place":"林深处老蕨下"},{"id":"forest-05-t2","theme":"forest","level":"forest-05","kind":"side","name":"林隙光斑","desc":"树冠缺口落下一小块亮","place":"高蕨叶层上方"},{"id":"forest-05-t3","theme":"forest","level":"forest-05","kind":"side","name":"溪畔蝶影","desc":"水面掠过一片淡黄的翅膀","place":"浅溪石桥边"},{"id":"amber-01-t1","theme":"amber","level":"amber-01","kind":"side","name":"琥珀矿灯","desc":"石块里裹着一小团暖光","place":"洞壁第二处凹槽"},{"id":"amber-01-t2","theme":"amber","level":"amber-01","kind":"side","name":"垂藤水珠","desc":"藤梢的水珠将落未落","place":"洞口垂藤下方"},{"id":"amber-02-t1","theme":"amber","level":"amber-02","kind":"side","name":"石笋边的溪声","desc":"石笋脚下有很轻的流水声","place":"地下溪流拐角"},{"id":"amber-02-t2","theme":"amber","level":"amber-02","kind":"side","name":"晶簇碎光","desc":"晶面把矿光分成几道细线","place":"洞顶晶簇下方"},{"id":"amber-03-t1","theme":"amber","level":"amber-03","kind":"side","name":"岩壁水痕","desc":"石壁留着一道浅浅的水印","place":"洞壁渗水处"},{"id":"amber-03-t2","theme":"amber","level":"amber-03","kind":"side","name":"地底小花","desc":"花心朝着矿光的方向","place":"石笋背光一侧"},{"id":"amber-04-t1","theme":"amber","level":"amber-04","kind":"side","name":"石英圆粒","desc":"沙地上散着几颗透明石子","place":"溪床浅沙上"},{"id":"amber-04-t2","theme":"amber","level":"amber-04","kind":"side","name":"笋尖悬滴","desc":"石笋尖端悬着一滴水珠","place":"圆石笋尖下方"},{"id":"amber-04-t3","theme":"amber","level":"amber-04","kind":"side","name":"暖石薄尘","desc":"石面上浮着一层细细的黄土","place":"洞底暖石平台"},{"id":"amber-05-t1","theme":"amber","level":"amber-05","kind":"side","name":"琥珀薄片","desc":"薄片边缘透出一点蜜色光","place":"矿脉东侧裂缝"},{"id":"amber-05-t2","theme":"amber","level":"amber-05","kind":"side","name":"石笋影线","desc":"地上拖着一道圆钝的影子","place":"石笋群之间"},{"id":"amber-05-t3","theme":"amber","level":"amber-05","kind":"side","name":"地下溪灯","desc":"水面映着洞壁的橙色光","place":"地下溪石桥下"},{"id":"cloud-01-t1","theme":"cloud","level":"cloud-01","kind":"side","name":"云阶薄雾","desc":"石阶边缘浮着一层白气","place":"第一段云阶旁"},{"id":"cloud-01-t2","theme":"cloud","level":"cloud-01","kind":"side","name":"断桥碎石","desc":"断口处落着几粒浅灰石屑","place":"断桥西侧桥头"},{"id":"cloud-02-t1","theme":"cloud","level":"cloud-02","kind":"side","name":"飘带旗角","desc":"布角被风拉成一条直线","place":"高台旗杆顶端"},{"id":"cloud-02-t2","theme":"cloud","level":"cloud-02","kind":"side","name":"飞鸟剪影","desc":"远处鸟影贴着云层滑过去","place":"云台东侧栏杆"},{"id":"cloud-03-t1","theme":"cloud","level":"cloud-03","kind":"side","name":"空中花圃","desc":"花根缠在浮岛的浅土里","place":"浮岛南边花圃"},{"id":"cloud-03-t2","theme":"cloud","level":"cloud-03","kind":"side","name":"风里的细羽","desc":"风里有一片白羽在打转","place":"风口石柱旁边"},{"id":"cloud-04-t1","theme":"cloud","level":"cloud-04","kind":"side","name":"云层裂口","desc":"云隙里露出一线淡蓝天空","place":"高台第二层"},{"id":"cloud-04-t2","theme":"cloud","level":"cloud-04","kind":"side","name":"浮岛草芽","desc":"岛边的草芽被风压得很低","place":"小浮岛边缘"},{"id":"cloud-04-t3","theme":"cloud","level":"cloud-04","kind":"side","name":"断桥的旧纹","desc":"石面裂纹里积着细白的尘","place":"断桥中段裂隙"},{"id":"cloud-05-t1","theme":"cloud","level":"cloud-05","kind":"side","name":"云上水洼","desc":"浅水映着整片流动的云","place":"高台石缝水洼"},{"id":"cloud-05-t2","theme":"cloud","level":"cloud-05","kind":"side","name":"旗影斜长","desc":"旗子的影子落在云阶上","place":"云阶西侧转角"},{"id":"cloud-05-t3","theme":"cloud","level":"cloud-05","kind":"side","name":"飞鸟落羽","desc":"羽轴边上还留着细白的绒","place":"花圃木栏下方"},{"id":"water-01-t1","theme":"water","level":"water-01","kind":"side","name":"睡莲初绽","desc":"花瓣边缘还卷着一小点","place":"水庭西侧莲池"},{"id":"water-01-t2","theme":"water","level":"water-01","kind":"side","name":"荷叶上的露珠","desc":"叶心聚着一颗圆亮水珠","place":"荷叶平台边缘"},{"id":"water-02-t1","theme":"water","level":"water-02","kind":"side","name":"贝壳内壁微光","desc":"壳内壁泛着一层淡淡的虹色","place":"亭台石阶水下"},{"id":"water-02-t2","theme":"water","level":"water-02","kind":"side","name":"珊瑚细枝","desc":"枝端在水里轻轻地摆动","place":"浅水珊瑚丛旁"},{"id":"water-03-t1","theme":"water","level":"water-03","kind":"side","name":"亭影碎纹","desc":"倒影被涟漪分成几块","place":"水上亭台东侧"},{"id":"water-03-t2","theme":"water","level":"water-03","kind":"side","name":"水面涟漪","desc":"一圈水纹正慢慢地散开","place":"莲池中央水面"},{"id":"water-04-t1","theme":"water","level":"water-04","kind":"side","name":"浮游萤色","desc":"水里浮着几点浅绿微光","place":"水庭北侧浅湾"},{"id":"water-04-t2","theme":"water","level":"water-04","kind":"side","name":"荷叶边水线","desc":"叶缘挂着一条细细的水痕","place":"荷叶下水面"},{"id":"water-04-t3","theme":"water","level":"water-04","kind":"side","name":"石栏水汽","desc":"石栏表面浮着薄薄的水汽","place":"临水石栏转角"},{"id":"water-05-t1","theme":"water","level":"water-05","kind":"side","name":"莲心浅黄","desc":"花心露出一点浅黄的花蕊","place":"睡莲第三朵花"},{"id":"water-05-t2","theme":"water","level":"water-05","kind":"side","name":"珊瑚小孔","desc":"枝干上留着小孔与水光","place":"水下珊瑚根部"},{"id":"water-05-t3","theme":"water","level":"water-05","kind":"side","name":"亭角滴声","desc":"檐角落下的水声很轻","place":"水上亭台檐下"},{"id":"star-01-t1","theme":"star","level":"star-01","kind":"side","name":"符文浅槽","desc":"砖缝里的刻痕积着银尘","place":"回廊第一块地砖"},{"id":"star-01-t2","theme":"star","level":"star-01","kind":"side","name":"壁画上的星点","desc":"墙上的小孔排成一列星点","place":"星象壁画下沿"},{"id":"star-02-t1","theme":"star","level":"star-02","kind":"side","name":"水晶柱光","desc":"柱心折出一小片银白光","place":"东侧第二根立柱"},{"id":"star-02-t2","theme":"star","level":"star-02","kind":"side","name":"铜环锈迹","desc":"环面留着几处暗绿斑点","place":"机关环内侧卡口"},{"id":"star-03-t1","theme":"star","level":"star-03","kind":"side","name":"星尘薄层","desc":"石台上落着一层银灰细尘","place":"大殿中央石台"},{"id":"star-03-t2","theme":"star","level":"star-03","kind":"side","name":"回廊里的足音","desc":"脚步声在石壁间轻轻回返","place":"回廊尽头拐角"},{"id":"star-04-t1","theme":"star","level":"star-04","kind":"side","name":"光斑边缘","desc":"圆形亮斑的边缘有些发虚","place":"西侧立柱下方"},{"id":"star-04-t2","theme":"star","level":"star-04","kind":"side","name":"壁画弧线","desc":"银线从星图一端弯向另一端","place":"壁画下方石缝"},{"id":"star-04-t3","theme":"star","level":"star-04","kind":"side","name":"石砖回声","desc":"空砖下面有一点回响","place":"回廊第三块砖"},{"id":"star-05-t1","theme":"star","level":"star-05","kind":"side","name":"铜环微光","desc":"环边被光照出一圈暖色","place":"机关环东侧齿口"},{"id":"star-05-t2","theme":"star","level":"star-05","kind":"side","name":"星图残角","desc":"石片留着半段银色的星轨","place":"星图壁画右下角"},{"id":"star-05-t3","theme":"star","level":"star-05","kind":"side","name":"柱间银线","desc":"两柱之间拉着一道细亮线","place":"两根水晶柱之间"}],"npcDialogue":[{"theme":"forest","npc":"林间萤灵","rounds":[{"lines":["木栈道的缝里藏着一点水光。","三颗光点靠近时，蕨叶会亮一下。"]},{"lines":["倒木底下的蘑菇，比石面上的更白。"]},{"lines":["树洞里的光很浅，像被布包住。","你听见溪水从落叶下面穿过去了吗？"]}]},{"theme":"forest","npc":"苔痕向导","rounds":[{"lines":["这条路我走过很多回，青苔又厚了一点。","木杖点一下，就知道石阶松没松。"]},{"lines":["林子入口的蕨叶朝溪水那边弯。"]},{"lines":["岔路口的青苔石块，比别处干一些。","我在这里歇脚，你回来时还能看见我。"]}]},{"theme":"amber","npc":"石苔长老","rounds":[{"lines":["洞里的水声比石头老，苔是后来才长的。","我坐了很久，肩上的苔又厚了一层。"]},{"lines":["晶簇亮起来时，石壁的纹路更容易看清。"]},{"lines":["琥珀里的光是旧的，照在手上还是暖的。","你有没有听见水滴落在同一处？"]}]},{"theme":"amber","npc":"苔痕向导","rounds":[{"lines":["岔口有三处，藤蔓低的那处好走。","木杖探过的地方，脚下稳一些。"]},{"lines":["地下溪流的响声，比洞口的风清楚。"]},{"lines":["暖石摸起来像晒过太阳的院墙。","你从这边走进来，是来看琥珀的吗？"]}]},{"theme":"cloud","npc":"云絮信使","rounds":[{"lines":["云阶之间有一段空着，风从那里上来。","我送信的时候，常在那段空处停一停。"]},{"lines":["断桥的旧绳子还挂在桥头，风一吹就晃。"]},{"lines":["花圃的土很薄，根却抓得住浮岛。","你在高处看云，会分得清哪块是台阶吗？"]}]},{"theme":"cloud","npc":"苔痕向导","rounds":[{"lines":["云阶踏起来是实的，看着却像要散。","木杖轻，风大时我就收在背后。"]},{"lines":["浮岛边的花圃，比桥头的草长得密。"]},{"lines":["断桥下面全是云，石头影子落不进去。","风小的地方，木杖落在石阶上更稳。"]}]},{"theme":"water","npc":"河蚌灵","rounds":[{"lines":["水纹荡到岸边，又慢慢退回去。","我开合得慢，贝壳里的光就晃得慢。"]},{"lines":["睡莲的根在泥里，花却贴着水面。"]},{"lines":["亭台的倒影碎过几回，水一静又合上。","你看见水底那些浅绿的小点了吗？"]}]},{"theme":"water","npc":"苔痕向导","rounds":[{"lines":["石阶有两级没在水下，踩上去会响。","木杖探水，能知道荷叶平台的边。"]},{"lines":["亭台的水上部分，比岸边的木头干。"]},{"lines":["涟漪散开的时候，水底的珊瑚会晃。","你听见亭角滴水的声音了吗？"]}]},{"theme":"star","npc":"石苔长老","rounds":[{"lines":["回廊的砖缝里积着银尘，脚步一过就淡。","我在这里坐得久了，苔从脚边爬到膝上。"]},{"lines":["星象壁画的弧线，比地砖上的符文浅。"]},{"lines":["铜环转起来时，回廊里会有一点风。","你有没有看见光斑停在石柱同一侧？"]}]},{"theme":"star","npc":"苔痕向导","rounds":[{"lines":["古殿的入口很宽，走进去声音会变轻。","我的木杖在石砖上敲两下，回音不一样。"]},{"lines":["水晶立柱下面的光斑，比回廊里亮。"]},{"lines":["壁画上的星点，排到铜环那边就断了。","机关环上的齿口朝着光斑，你看见了吗？"]}]}],"hints":[{"mech":"pressure_switch","levels":["侧门的灯一直没有亮。","圆石开关被踩住时灯才亮。","重物压住开关，门升起，人再过门。"]},{"mech":"light_beam","levels":["晶座那边还是一片暗。","反光块挡在光路上会改方向。","反光块被推到光里，光会折向晶座。"]},{"mech":"sequence_pads","levels":["石门前的地砖一直没有动静。","三块踏板要按壁画的纹样踩。","三块踏板按壁画顺序踩，石门就会打开。"]},{"mech":"wind","levels":["前面的浮台离得有点远。","侧面来风时，浮台会向前移。","拾光者站进风带，等浮台靠近再跳过去。"]},{"mech":"water_flow","levels":["前面的平台一直没有浮起来。","转盘能改变水流的方向。","转动转盘开闸后，水位升高，平台浮起。"]},{"mech":"rune_puzzle","levels":["石框里的纹样还缺着一角。","碎片散在回廊和石壁凹处。","碎片集齐后，按壁画纹样拼回石框。"]}],"glossary":[{"key":"hud_treasure","name":"宝物计数","desc":"右上角：整局收集进度"},{"key":"treasure","name":"拾遗宝物","desc":"拿到就记进图鉴，不影响过关"},{"key":"crystal","name":"本源彩晶","desc":"每个主题一枚，是通关凭证"},{"key":"mark","name":"守护印记","desc":"完成守护者的小请求才出现"},{"key":"rune","name":"符文碎片","desc":"集齐三块，再到符文台拼合"},{"key":"checkpoint","name":"存档石碑","desc":"在旁边停一下就会记下进度"},{"key":"exit","name":"出口石门","desc":"走进这扇门就算过关"},{"key":"door","name":"机关石门","desc":"机关接通后才会向两侧收起"},{"key":"boulder","name":"滚石","desc":"在地面来回滚，碰上掉一条命"},{"key":"pressure_switch","name":"踩压开关","desc":"站上去才通电，离开就断开"},{"key":"light_beam","name":"光路方块","desc":"把反光块推到光束上改变方向"},{"key":"sequence_pads","name":"时序踏板","desc":"按墙上标出的顺序踩才对"},{"key":"wind","name":"风场","desc":"上升气流能把人托起来"},{"key":"water_flow","name":"水位闸门","desc":"开闸水面上升，浮台跟着抬高"},{"key":"rune_altar","name"       npcs: ['firefly', 'guide'],
      // 表 5-2：踩压开关、浮动树叶平台；表 4-3 首现：踩压开关
      mechs: ['pressure_switch'],

      // 表 5-5：前两个主题只要求看懂规则，跳跃容错不小于 3 格

      levels: ['云阶初升', '断桥风起', '浮岛花圃', '高台回廊', '云心守望'],
      npcs: ['messenger', 'guide'],
      // 表 5-2：风场推力、浮台
      mechs: ['pressure_switch', 'light_beam', 'wind'],

    },
    {

      npcs: ['clam', 'guide'],
      // 表 5-2：水流转向、水位升降
      mechs: ['pressure_switch', 'sequence_pads', 'water_flow'],

      npcs: ['elder', 'guide'],
      // 表 5-2：符文拼图、组合时序；表 5-5：只组合已知机关，难度来自谜题链长度
      mechs: ['light_beam', 'sequence_pads', 'rune_puzzle'],

      crystal: 'crystal-star',
      guardian: 'elder',
    },
  ];

  var byKey = {};
  var byLevel = {};
  THEMES.forEach(function (t) {
    byKey[t.key] = t;
    t.levels.forEach(function (name, i) {
      byLevel[t.key + '-' + String(i + 1).padStart(2, '0')] = {
        theme: t, index: i + 1, name: name,
      };
    });
  });

  // 关卡线性顺序（§5.1：25 关，5 单元 × 5 关）
  var ORDER = [];
  THEMES.forEach(function (t) {
    for (var i = 1; i <= 5; i++) ORDER.push(t.key + '-' + String(i).padStart(2, '0'));
  });

  var MECH_NAMES = {
    pressure_switch: '踩压开关',
    light_beam: '光路方块',
    sequence_pads: '时序踏板',
    wind: '风场推力',
    water_flow: '水流转向',
    rune_puzzle: '符文拼图',
  };

  function themeOf(levelId) {
    var e = byLevel[levelId];
    return e ? e.theme : null;
  }
  function levelInfo(levelId) { return byLevel[levelId] || null; }
  function nextLevel(levelId) {
    var i = ORDER.indexOf(levelId);
    return i >= 0 && i + 1 < ORDER.length ? ORDER[i + 1] : null;
  }

  CT.Themes = {
    LIST: THEMES,
    byKey: byKey,
    byLevel: byLevel,
    ORDER: ORDER,
    MECH_NAMES: MECH_NAMES,
    get: function (k) { return byKey[k]; },
    themeOf: themeOf,
    levelInfo: levelInfo,
    nextLevel: nextLevel,
  };
})();

  <script>
/* ==== src/world/levelgen.js ==== */
﻿/* 晶途拾光 — 关卡生成器
 * --------------------------------------------------------------------------
 * 产出符合 §9.4 JSON 结构的关卡，并强制满足 §5.3 单关规模指标：
 *   横向长度 120~180 格   | 纵向高度 24~40 格
 *   至少 1 处 6 格以上垂直落差
 *   分支路径 1~2 条，其中至少 1 条通向隐藏支线宝物
 *   机关 3~6 组，同时生效种类不超过 3 种
 *   拾遗宝物 2~3 件      | 装饰物件不少于 40 个
 *   存档石碑 1 个（置于关卡中段安全区）
 *
 * 地形用「地面剖面 floor[x]」描述：先决定每一列的地表行号，再整列填充，
 * 因此连通性由构造保证。跳跃可达性按 §4.1 的物理参数反推：
 *   跳跃初速 -260、重力 640  ->  最大跳高 52.8 px ≈ 3.3 格
