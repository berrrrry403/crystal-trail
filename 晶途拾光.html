/* ==== src/core/rng.js ==== */
/* 晶途拾光 — RNG / hash utilities
 * Deterministic PRNG so that level generation and art baking are reproducible
 * across sessions and in the headless QA renderer.
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});

  // mulberry32 — fast, decent distribution, deterministic from a 32-bit seed.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Stateless integer hash — used for per-tile art variation so that the same
  // tile coordinate always renders identically without storing anything.
  function hash2(x, y, seed) {
    var h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(seed | 0, 2246822519);
    h = (h ^ (h >>> 13)) >>> 0;
    h = Math.imul(h, 1274126177) >>> 0;
    return (h ^ (h >>> 16)) >>> 0;
  }

  function hash01(x, y, seed) {
    return hash2(x, y, seed) / 4294967296;
  }

  // String -> 32-bit seed (FNV-1a)
  function seedOf(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function Rng(seed) {
    this.next = mulberry32(seed >>> 0);
  }
  Rng.prototype.f = function () { return this.next(); };
  Rng.prototype.range = function (a, b) { return a + this.next() * (b - a); };
  Rng.prototype.int = function (a, b) { return a + Math.floor(this.next() * (b - a + 1)); };
  Rng.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
  Rng.prototype.chance = function (p) { return this.next() < p; };
  Rng.prototype.shuffle = function (arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(this.next() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };

  CT.mulberry32 = mulberry32;
  CT.hash2 = hash2;
  CT.hash01 = hash01;
  CT.seedOf = seedOf;
  CT.Rng = Rng;
})();

</script>

/* ==== src/core/view.js ==== */
/* 晶途拾光 — 视口
 * --------------------------------------------------------------------------
 * 原先逻辑分辨率写死 480 × 270，再由 main.js 按整数倍放大、居中留黑边。
 * 需求要求「铺满页面、不要黑边」，而直接拉伸会破坏像素，裁剪又会切掉 HUD。
 *
 * 这里的做法是：把「逻辑分辨率」本身跟着窗口放大。
 *   · 先取一个整数缩放倍率 sc（保证 480 × 270 放得下）
 *   · 再把逻辑分辨率抬高到 (窗口宽 / sc, 窗口高 / sc)
 * 于是画布正好铺满窗口、每个像素仍是 sc × sc 的整数块，
 * 世界视野变大，HUD 依旧贴着真实边缘，不需要任何裁剪。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});

  var DESIGN_W = 480;      // 设计基准（§7.1 480 × 270）
  var DESIGN_H = 270;
  // 成本上限只是保险丝：倍率越高逻辑分辨率越小，正常窗口根本碰不到。
  // 定得太低会反噬 —— 小窗口（如 800×600）在 1 倍下会被截短、露出边。
  var MAX_W = 1280;
  var MAX_H = 800;

  var View = {
    DESIGN_W: DESIGN_W,
    DESIGN_H: DESIGN_H,
    VW: DESIGN_W,
    VH: DESIGN_H,
    scale: 1,

    /**
     * 根据窗口尺寸算出逻辑分辨率与整数倍率。
     * @returns {{vw:number, vh:number, scale:number}}
     */
    compute: function (winW, winH) {
      // 无头环境可能拿不到窗口尺寸，退回设计基准
      var w = (typeof winW === 'number' && isFinite(winW) && winW > 0) ? Math.floor(winW) : DESIGN_W;
      var h = (typeof winH === 'number' && isFinite(winH) && winH > 0) ? Math.floor(winH) : DESIGN_H;
      // 能放下设计基准的最大整数倍率
      var sc = Math.floor(Math.min(w / DESIGN_W, h / DESIGN_H));
      if (!isFinite(sc) || sc < 1) sc = 1;
      // 逻辑分辨率抬到铺满窗口
      var vw = Math.ceil(w / sc);
      var vh = Math.ceil(h / sc);
      // 上限保护
      if (vw > MAX_W) { vw = MAX_W; sc = Math.max(1, Math.floor(w / MAX_W)); }
      if (vh > MAX_H) { vh = MAX_H; sc = Math.max(1, Math.floor(h / MAX_H)); }
      // 下限保护：至少是设计基准
      if (vw < DESIGN_W) vw = DESIGN_W;
      if (vh < DESIGN_H) vh = DESIGN_H;
      return { vw: vw, vh: vh, scale: sc };
    },

    apply: function (winW, winH) {
      var r = this.compute(winW, winH);
      this.VW = r.vw;
      this.VH = r.vh;
      this.scale = r.scale;
      return r;
    },

    reset: function () {
      this.VW = DESIGN_W;
      this.VH = DESIGN_H;
      this.scale = 1;
    },
  };

  CT.View = View;
})();

</script>

/* ==== src/core/fb.js ==== */
/* 晶途拾光 — software pixel framebuffer
 * --------------------------------------------------------------------------
 * 规格书 §7.1：内部渲染分辨率固定 480 × 270，所有美术按 1 倍像素绘制，
 * 运行时整数倍放大。本模块实现一个纯软件帧缓冲，所有绘制都落在 Uint32Array
 * 上（0xAABBGGRR，小端 RGBA）。它不依赖 DOM，因此浏览器与无头 QA 渲染器
 * 走的是同一条绘制代码路径 —— 截图所见即玩家所见。
 *
 * 规格书 §7.2：透明度只允许 0% / 50% / 100% 三档。glow 使用抖动实现
 * （§7.5「抖动光晕」），因此本模块提供 ditherBlit。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});

  var A0 = 0;           // fully transparent sentinel
  function rgba(r, g, b, a) {
    if (a === undefined) a = 255;
    return ((a << 24) | (b << 16) | (g << 8) | r) >>> 0;
  }

  // 4x4 Bayer matrix, values 0..15 — used for dithered fills & glow tiers.
  var BAYER4 = new Uint8Array([
    0, 8, 2, 10,
    12, 4, 14, 6,
    3, 11, 1, 9,
    15, 7, 13, 5
  ]);

  function FB(w, h) {
    this.w = w | 0;
    this.h = h | 0;
    this.data = new Uint32Array(this.w * this.h);
    this.clipL = 0; this.clipT = 0; this.clipR = this.w; this.clipB = this.h;
  }

  FB.prototype.setClip = function (x, y, w, h) {
    this.clipL = Math.max(0, x | 0);
    this.clipT = Math.max(0, y | 0);
    this.clipR = Math.min(this.w, (x | 0) + (w | 0));
    this.clipB = Math.min(this.h, (y | 0) + (h | 0));
  };
  FB.prototype.resetClip = function () {
    this.clipL = 0; this.clipT = 0; this.clipR = this.w; this.clipB = this.h;
  };

  FB.prototype.clear = function (c) {
    this.data.fill(c >>> 0);
  };

  FB.prototype.px = function (x, y, c) {
    x = x | 0; y = y | 0;
    if (x < this.clipL || x >= this.clipR || y < this.clipT || y >= this.clipB) return;
    this.data[y * this.w + x] = c >>> 0;
  };

  FB.prototype.get = function (x, y) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return 0;
    return this.data[y * this.w + x];
  };

  FB.prototype.fillRect = function (x, y, w, h, c) {
    var x0 = Math.max(this.clipL, x | 0), y0 = Math.max(this.clipT, y | 0);
    var x1 = Math.min(this.clipR, (x | 0) + (w | 0)), y1 = Math.min(this.clipB, (y | 0) + (h | 0));
    if (x1 <= x0 || y1 <= y0) return;
    c = c >>> 0;
    var d = this.data, W = this.w;
    for (var yy = y0; yy < y1; yy++) {
      var o = yy * W;
      for (var xx = x0; xx < x1; xx++) d[o + xx] = c;
    }
  };

  // Dithered fill — §7.2「渐变只用抖动实现」
  FB.prototype.fillRectDither = function (x, y, w, h, c, level) {
    // level: 0..16 coverage out of 16
    var x0 = Math.max(this.clipL, x | 0), y0 = Math.max(this.clipT, y | 0);
    var x1 = Math.min(this.clipR, (x | 0) + (w | 0)), y1 = Math.min(this.clipB, (y | 0) + (h | 0));
    if (x1 <= x0 || y1 <= y0 || level <= 0) return;
    c = c >>> 0;
    if (level >= 16) { this.fillRect(x0, y0, x1 - x0, y1 - y0, c); return; }
    var d = this.data, W = this.w;
    for (var yy = y0; yy < y1; yy++) {
      var o = yy * W, by = (yy & 3) * 4;
      for (var xx = x0; xx < x1; xx++) {
        if (BAYER4[by + (xx & 3)] < level) d[o + xx] = c;
      }
    }
  };

  FB.prototype.hline = function (x, y, w, c) { this.fillRect(x, y, w, 1, c); };
  FB.prototype.vline = function (x, y, h, c) { this.fillRect(x, y, 1, h, c); };

  FB.prototype.rect = function (x, y, w, h, c) {
    if (w <= 0 || h <= 0) return;
    this.fillRect(x, y, w, 1, c);
    this.fillRect(x, y + h - 1, w, 1, c);
    this.fillRect(x, y + 1, 1, h - 2, c);
    this.fillRect(x + w - 1, y + 1, 1, h - 2, c);
  };

  FB.prototype.ellipse = function (cx, cy, rx, ry, c) {
    c = c >>> 0;
    var d = this.data, W = this.w;
    for (var y = -ry; y <= ry; y++) {
      var t = 1 - (y * y) / (ry * ry);
      if (t <= 0) continue;
      var xr = Math.round(rx * Math.sqrt(t));
      var yy = cy + y;
      if (yy < this.clipT || yy >= this.clipB) continue;
      var x0 = Math.max(this.clipL, cx - xr), x1 = Math.min(this.clipR, cx + xr + 1);
      var o = yy * W;
      for (var x = x0; x < x1; x++) d[o + x] = c;
    }
  };

  // ------------------------------------------------------------------------
  // Blits
  // ------------------------------------------------------------------------

  // Opaque-key copy blit (alpha 0 => skip). Used for tiles, sprites, props.
  FB.prototype.blit = function (src, sw, sh, dx, dy, flipX, srcOffX, srcOffY) {
    flipX = !!flipX;
    var sx0 = srcOffX | 0 || 0, sy0 = srcOffY | 0 || 0;
    var x0 = dx | 0, y0 = dy | 0;
    var cx0 = Math.max(this.clipL, x0), cy0 = Math.max(this.clipT, y0);
    var cx1 = Math.min(this.clipR, x0 + sw - sx0), cy1 = Math.min(this.clipB, y0 + sh - sy0);
    if (cx1 <= cx0 || cy1 <= cy0) return;
    var d = this.data, W = this.w;
    for (var yy = cy0; yy < cy1; yy++) {
      var sy = sy0 + (yy - y0);
      var srow = sy * sw;
      var drow = yy * W;
      if (!flipX) {
        for (var xx = cx0; xx < cx1; xx++) {
          var c = src[srow + sx0 + (xx - x0)];
          if (c !== 0) d[drow + xx] = c;
        }
      } else {
        for (var xx2 = cx0; xx2 < cx1; xx2++) {
          var sxv = sw - 1 - (sx0 + (xx2 - x0));
          if (sxv < 0 || sxv >= sw) continue;
          var c2 = src[srow + sxv];
          if (c2 !== 0) d[drow + xx2] = c2;
        }
      }
    }
  };

  // Full copy including transparent pixels (used for background layers).
  FB.prototype.blitOpaque = function (src, sw, sh, dx, dy) {
    var x0 = dx | 0, y0 = dy | 0;
    var cx0 = Math.max(this.clipL, x0), cy0 = Math.max(this.clipT, y0);
    var cx1 = Math.min(this.clipR, x0 + sw), cy1 = Math.min(this.clipB, y0 + sh);
    if (cx1 <= cx0 || cy1 <= cy0) return;
    var d = this.data, W = this.w;
    for (var yy = cy0; yy < cy1; yy++) {
      var srow = (yy - y0) * sw;
      var drow = yy * W;
      for (var xx = cx0; xx < cx1; xx++) d[drow + xx] = src[srow + (xx - x0)];
    }
  };

  // Alpha-blend blit — §7.2 allows 0/50/100%; used for water, shadow, near parallax.
  FB.prototype.blitBlend = function (src, sw, sh, dx, dy, flipX, srcOffX) {
    var sx0 = srcOffX | 0 || 0;
    var x0 = dx | 0, y0 = dy | 0;
    var cx0 = Math.max(this.clipL, x0), cy0 = Math.max(this.clipT, y0);
    var cx1 = Math.min(this.clipR, x0 + sw - sx0), cy1 = Math.min(this.clipB, y0 + sh);
    if (cx1 <= cx0 || cy1 <= cy0) return;
    var d = this.data, W = this.w;
    for (var yy = cy0; yy < cy1; yy++) {
      var srow = (yy - y0) * sw;
      var drow = yy * W;
      for (var xx = cx0; xx < cx1; xx++) {
        var sxv = sx0 + (xx - x0);
        if (flipX) sxv = sw - 1 - sxv;
        if (sxv < 0 || sxv >= sw) continue;
        var c = src[srow + sxv];
        var a = (c >>> 24) & 255;
        if (a === 0) continue;
        if (a === 255) { d[drow + xx] = c; continue; }
        var dc = d[drow + xx];
        var ia = 255 - a;
        var r = (((c & 255) * a + (dc & 255) * ia) / 255) | 0;
        var g = ((((c >>> 8) & 255) * a + ((dc >>> 8) & 255) * ia) / 255) | 0;
        var b = ((((c >>> 16) & 255) * a + ((dc >>> 16) & 255) * ia) / 255) | 0;
        d[drow + xx] = ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
      }
    }
  };

  // Dithered blit: draws src pixels where the Bayer cell is below `level`.
  // Keeps output palette-pure — the classic 8-bit glow / fade technique.
  FB.prototype.blitDither = function (src, sw, sh, dx, dy, level, flipX) {
    if (level <= 0) return;
    var x0 = dx | 0, y0 = dy | 0;
    var cx0 = Math.max(this.clipL, x0), cy0 = Math.max(this.clipT, y0);
    var cx1 = Math.min(this.clipR, x0 + sw), cy1 = Math.min(this.clipB, y0 + sh);
    if (cx1 <= cx0 || cy1 <= cy0) return;
    var d = this.data, W = this.w;
    for (var yy = cy0; yy < cy1; yy++) {
      var srow = (yy - y0) * sw;
      var drow = yy * W, by = (yy & 3) * 4;
      for (var xx = cx0; xx < cx1; xx++) {
        if (BAYER4[by + (xx & 3)] >= level) continue;
        var sxv = xx - x0;
        if (flipX) sxv = sw - 1 - sxv;
        var c = src[srow + sxv];
        if (c !== 0 && ((c >>> 24) & 255) > 127) d[drow + xx] = (c | 0xff000000) >>> 0;
      }
    }
  };

  // Mask blit: draw every source pixel in a single flat colour where mask is set.
  FB.prototype.blitMaskColor = function (mask, sw, sh, dx, dy, color, level) {
    var x0 = dx | 0, y0 = dy | 0;
    var cx0 = Math.max(this.clipL, x0), cy0 = Math.max(this.clipT, y0);
    var cx1 = Math.min(this.clipR, x0 + sw), cy1 = Math.min(this.clipB, y0 + sh);
    if (cx1 <= cx0 || cy1 <= cy0) return;
    var d = this.data, W = this.w;
    color = color >>> 0;
    if (level === undefined || level >= 16) {
      for (var yy = cy0; yy < cy1; yy++) {
        var srow = (yy - y0) * sw, drow = yy * W;
        for (var xx = cx0; xx < cx1; xx++) {
          if (mask[srow + (xx - x0)] > 127) d[drow + xx] = color;
        }
      }
    } else {
      for (var yy2 = cy0; yy2 < cy1; yy2++) {
        var srow2 = (yy2 - y0) * sw, drow2 = yy2 * W, by = (yy2 & 3) * 4;
        for (var xx2 = cx0; xx2 < cx1; xx2++) {
          if (BAYER4[by + (xx2 & 3)] >= level) continue;
          if (mask[srow2 + (xx2 - x0)] > 127) d[drow2 + xx2] = color;
        }

/* ==== src/core/input.js ==== */
/* 晶途拾光 — 输入
 * --------------------------------------------------------------------------
 * §10.4 输入与界面适配
 *   PC：方向键或 WASD 移动，空格跳跃，E 或回车交互，Esc 暂停；手柄 Xbox 布局
 *   Android：左下角虚拟摇杆（直径 96 像素），右下角跳跃键（72×72）与交互键，
 *            按钮最小点击区域 44×44，提供三种预设布局

 * 触屏控件不画在 DOM 上，而是画进帧缓冲并在这里做命中测试 —— 这样屏幕上看到
 * 的控件与判定区域必然一致，且渲染路径与桌面端完全相同。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});

  var K = {
    left: ['ArrowLeft', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    up: ['ArrowUp', 'KeyW'],
    down: ['ArrowDown', 'KeyS'],
    jump: ['Space', 'KeyJ'],
    interact: ['KeyE', 'Enter', 'KeyF'],
    pause: ['Escape', 'KeyP'],
  };

  var Input = {
    // 原始按键
    down: Object.create(null),
    // 本步的边沿
    _pressed: Object.create(null),
    _released: Object.create(null),

    // 触屏
    touch: {
      active: false,          // 是否显示控件
      stick: { x: 0, y: 0 },  // -1..1 归一化方向
      stickId: -1,
      stickOrigin: { x: 0, y: 0 },
      jumpHeld: false,
      jumpId: -1,
      interactHeld: false,
      interactId: -1,
      pauseTapped: false,
    },

    // 手柄
    pad: { connected: false, ax: 0, jump: false, interact: false, pause: false },

    _prevPadJump: false,
    _prevPadInteract: false,
    _prevPadPause: false,

  // --------------------------------------------------------------- 键盘
  Input.attach = function (target) {
    if (!target.addEventListener) return;
    target.addEventListener('keydown', function (e) {
      // 取名界面：按键交给隐藏文本框（支持中文输入法的浏览器里由 input 自己处理）
      if (CT.TextInput && CT.TextInput.active) {
        // 可打印字符交给文本框；回车 / Esc / 方向键必须继续交给游戏，
        // 否则取名页里连「确定」都按不动。
        CT.TextInput.feedKeyCode(e.code, e.key);
        var navKey = (e.code === 'Enter' || e.code === 'Escape' ||
                      e.code === 'ArrowUp' || e.code === 'ArrowDown' ||
                      e.code === 'ArrowLeft' || e.code === 'ArrowRight');
        if (!navKey) return;
      }
      if (e.repeat) { e.preventDefault(); return; }
      if (!Input.down[e.code]) Input._pressed[e.code] = true;
      Input.down[e.code] = true;
      // 避免空格滚动页面
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' ||
          e.code === 'ArrowLeft' || e.code === 'ArrowRight') e.preventDefault();
    });
    target.addEventListener('keyup', function (e) {
      if (Input.down[e.code]) Input._released[e.code] = true;
      Input.down[e.code] = false;
    });
    target.addEventListener('blur', function () {
      for (var k in Input.down) Input.down[k] = false;
    });
  };

  function anyDown(list) {
    for (var i = 0; i < list.length; i++) if (Input.down[list[i]]) return true;
    return false;
  }
  function anyPressed(list) {
    for (var i = 0; i < list.length; i++) if (Input._pressed[list[i]]) return true;
    return false;
  }
  function anyReleased(list) {
    for (var i = 0; i < list.length; i++) if (Input._released[list[i]]) return true;
    return false;
  }

  // --------------------------------------------------------------- 手柄
  var PAD_DEAD = 0.35;
  Input.pollPad = function () {
    var pads = (typeof navigator !== 'undefined' && navigator.getGamepads) ? navigator.getGamepads() : null;
    var p = null;
    if (pads) {
      for (var i = 0; i < pads.length; i++) if (pads[i]) { p = pads[i]; break; }
    }
    var st = Input.pad;
    if (!p) { st.connected = false; st.ax = 0; st.jump = false; st.interact = false; st.pause = false; return; }
    st.connected = true;
    var ax = p.axes && p.axes.length ? p.axes[0] : 0;
    if (Math.abs(ax) < PAD_DEAD) ax = 0;
    st.ax = ax;
    var b = p.buttons || [];
    st.jump = !!(b[0] && b[0].pressed);       // A
    st.interact = !!(b[2] && b[2].pressed);    // X
    st.pause = !!(b[9] && b[9].pressed);       // Start
  };

  // --------------------------------------------------------------- 触屏
  // 命中测试用的布局在 ui.js 里定义，这里只接受已换算好的世界坐标

  Input.onPointer = function (type, id, x, y) {
    var L = Input._layout;
    if (!L) return false;
    var T = Input.touch;
    if (type === 'down') {
      // 暂停键优先
      if (hit(L.pause, x, y)) { T.pauseTapped = true; return true; }
      if (hit(L.interact, x, y)) { T.interactId = id; T.interactHeld = true; return true; }
      if (hit(L.jump, x, y)) { T.jumpId = id; T.jumpHeld = true; return true; }
      if (hit(L.stick, x, y)) {
        T.stickId = id;
        T.stickOrigin.x = L.stick.cx;
        T.stickOrigin.y = L.stick.cy;
        updateStick(x, y);
        return true;
      }
      return false;
    }
    if (type === 'move') {
      if (id === T.stickId) { updateStick(x, y); return true; }
      return false;
    }
    if (type === 'up' || type === 'cancel') {
      if (id === T.stickId) { T.stickId = -1; T.stick.x = 0; T.stick.y = 0; return true; }
      if (id === T.jumpId) { T.jumpId = -1; T.jumpHeld = false; return true; }
      if (id === T.interactId) { T.interactId = -1; T.interactHeld = false; return true; }
      return false;
    }
    return false;
  };

  function hit(r, x, y) {
    if (!r) return false;
    var dx = x - r.cx, dy = y - r.cy;
    if (r.round) return dx * dx + dy * dy <= r.r * r.r;
    return Math.abs(dx) <= r.hw && Math.abs(dy) <= r.hh;
  }

  function updateStick(x, y) {
    var L = Input._layout;
    var T = Input.touch;
    var dx = x - T.stickOrigin.x;
    var dy = y - T.stickOrigin.y;
    var r = L.stick.r;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > r) { dx = (dx / d) * r; dy = (dy / d) * r; d = r; }
    var dead = r * 0.22;
    if (d < dead) { T.stick.x = 0; T.stick.y = 0; return; }
    var nx = dx / r, ny = dy / r;
    var m = Math.sqrt(nx * nx + ny * ny);
    if (m > 1) { nx /= m; ny /= m; }
    // 摇杆支持八向（§10.4）：把方向吸附到 8 个方位
    var ang = Math.atan2(ny, nx);
    var oct = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4);
    var ax = Math.cos(oct), ay = Math.sin(oct);
    var mag = Math.min(1, m * 1.15);
    T.stick.x = Math.abs(ax) < 0.4 ? 0 : (ax > 0 ? 1 : -1) * mag;
    T.stick.y = Math.abs(ay) < 0.4 ? 0 : (ay > 0 ? 1 : -1) * mag;
    // 八向吸附后仍保留摇杆的模拟偏移用于显示
    T.stickRawX = nx; T.stickRawY = ny;
  }

  // ------------------------------------------------------------- 每步刷新
  // 输出统一的“意图”给游戏逻辑
  var out = {
    left: false, right: false, up: false, down: false,
    upPressed: false, downPressed: false, leftPressed: false, rightPressed: false,
    stickUp: false, stickDown: false,
    jumpHeld: false, jumpPressed: false, jumpReleased: false,
    interactHeld: false, interactPressed: false,
    pausePressed: false,
    axis: 0,              // -1..1 水平，触屏摇杆可用
  };

  Input.beginStep = function () {
    Input.pollPad();
    var T = Input.touch, P = Input.pad;

    var keyLeft = anyDown(K.left), keyRight = anyDown(K.right);

    out.left = keyLeft || T.stick.x < -0.3 || P.ax < -PAD_DEAD;
    out.right = keyRight || T.stick.x > 0.3 || P.ax > PAD_DEAD;
    out.up = anyDown(K.up) || T.stick.y < -0.3;
    out.down = anyDown(K.down) || T.stick.y > 0.3;

    // 方向边沿（含摇杆过死区的瞬间），菜单用
    out.leftPressed = anyPressed(K.left) || (out.left && !Input._prevLeft);
    out.rightPressed = anyPressed(K.right) || (out.right && !Input._prevRight);
    out.upPressed = anyPressed(K.up) || (out.up && !Input._prevUp);
    out.downPressed = anyPressed(K.down) || (out.down && !Input._prevDown);
    // 模拟摇杆单独一次“推到底”的边沿，用于菜单上下移动
    out.stickUp = (T.stick.y < -0.6) && !(Input._prevStickY < -0.6);
    out.stickDown = (T.stick.y > 0.6) && !(Input._prevStickY > 0.6);
    Input._prevLeft = out.left; Input._prevRight = out.right;
    Input._prevUp = out.up; Input._prevDown = out.down;
    Input._prevStickY = T.stick.y;

    out.axis = (out.right ? 1 : 0) - (out.left ? 1 : 0);

    var keyJump = anyDown(K.jump), keyInt = anyDown(K.interact);
    var jumpHeldNow = keyJump || T.jumpHeld || P.jump;
    var wasJumpHeld = Input._jumpHeld || false;
    out.jumpHeld = jumpHeldNow;
    out.jumpPressed = anyPressed(K.jump) || (T.jumpHeld && !Input._touchJumpPrev) ||
      (P.jump && !Input._prevPadJump);
    out.jumpReleased = anyReleased(K.jump) || (wasJumpHeld && !jumpHeldNow);
    Input._jumpHeld = jumpHeldNow;
    Input._touchJumpPrev = T.jumpHeld;
    Input._prevPadJump = P.jump;

    out.interactHeld = keyInt || T.interactHeld || P.interact;
    out.interactPressed = anyPressed(K.interact) || (T.interactHeld && !Input._touchIntPrev) ||
      (P.interact && !Input._prevPadInteract);
    Input._touchIntPrev = T.interactHeld;
    Input._prevPadInteract = P.interact;

    out.pausePressed = anyPressed(K.pause) || (T.pauseTapped) || (P.pause && !Input._prevPadPause);
    T.pauseTapped = false;
    Input._prevPadPause = P.pause;

    return out;
  };

  // 边沿表在一步结束后清空
  Input.endStep = function () {
    Input._pressed = Object.create(null);
    Input._released = Object.create(null);

    if (typeof navigator === 'undefined') return false;
    return (navigator.maxTouchPoints || 0) > 0 || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent || '');

  CT.Input = Input;
})();

/* ==== src/core/audio.js ==== */
/* 晶途拾光 — 音频
 * --------------------------------------------------------------------------
 * §8.1 音乐采用 FC 时代的 chiptune 写法：以方波（2 路）、三角波（1 路）、
 *      噪声（1 路）四个声道构成，旋律舒缓、留白多，不使用厚重鼓组与失真音色。
 * §8.3 音效共 14 类，单条时长均不超过 0.8 秒。
 * §8.5 Android 端响应系统音量；BGM 与 SFX 音量分别可调，默认 BGM 70%、SFX 80%。
 *
 * 音频完全用 WebAudio 现场合成，不依赖任何音频文件，因此包体里没有一份
 * OGG 资源 —— 这是「包体上限」与「离线可玩」两项要求下最稳的做法。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});

    var oct = parseInt(m[3], 10);
    return (oct + 1) * 12 + semi;

  function Audio() {

    this.ctx = null;

    this.bgmGain = null;

      this.master.gain.value = 1;
      this.master.connect(this.ctx.destination);
      this.bgmGain = this.ctx.createGain();
      this.bgmGain.gain.value = this.volume.bgm / 100;
      this.bgmGain.connect(this.master);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = this.volume.sfx / 100;
      this.sfxGain.connect(this.master);
      this._makeNoise();
      this.ok = true;
    } catch (e) {
      this._failed = true;
      this.ok = false;
    }
    return this.ok;
  };

  Audio.prototype._makeNoise = function () {
    var len = Math.floor(this.ctx.sampleRate * 0.5);
    var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var d = buf.getChannelData(0);
    // 噪声声道用确定性 LCG，避免每次启动听感不一致
    var s = 0x2f6e2b1;
    for (var i = 0; i < len; i++) {
      s = (Math.imul(s, 1103515245) + 12345) & 0x7fffffff;
      d[i] = ((s / 0x3fffffff) - 1) * 0.6;

  Audio.prototype.applyGains = function () {
    if (!this.ok) return;
    var b = (this.muted || this.muteBgm) ? 0 : Math.max(0, Math.min(1, this.volume.bgm / 100));
    var s = (this.muted || this.muteSfx) ? 0 : Math.max(0, Math.min(1, this.volume.sfx / 100));
    this.bgmGain.gain.value = b;
    this.sfxGain.gain.value = s;
  };

  Audio.prototype.setVolumes = function (bgm, sfx) {
    this.volume.bgm = bgm; this.volume.sfx = sfx;
    this.applyGains();
  };

  /**
   * setMuted(true)              全体静音（旧用法）
   * setMuted('bgm'|'sfx', bool) 只关某一档
   */
  Audio.prototype.setMuted = function (which, m) {
    if (m === undefined) { this.muted = !!which; this.applyGains(); return; }

  Audio.prototype._pulse = function (t, dur, f, gain, dest, duty) {

    o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.008);
    g.gain.setValueAtTime(gain * 0.8, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    o.connect(g); g.connect(dest || this.bgmGain);
    o.start(t); o.stop(t + dur + 0.02);
    if (duty) {
      var o2 = this.ctx.createOscillator();
      var g2 = this.ctx.createGain();
      o2.type = 'square';
      o2.frequency.value = f;
      o2.detune.value = 6;
      g2.gain.setValueAtTime(0, t);
      g2.gain.linearRampToValueAtTime(gain * 0.35, t + 0.01);
      g2.gain.exponentialRampToValueAtTime(0.0005, t + dur);
      o2.connect(g2); g2.connect(dest || this.bgmGain);
      o2.start(t); o2.stop(t + dur + 0.02);

  Audio.prototype._triangle = function (t, dur, f, gain, dest) {

    var g = this.ctx.createGain();

    g.gain.linearRampToValueAtTime(gain, t + 0.012);
    g.gain.setValueAtTime(gain * 0.9, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0005, t + dur);

    o.start(t); o.stop(t + dur + 0.02);

    g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.bgmGain);
    s.start(t); s.stop(t + dur + 0.02);
  };

  // ------------------------------------------------------------- BGM
  Audio.prototype.playBgm = function (name) {
    if (!this.ok) this.init();
    if (!this.ok) return;
    if (this.bgmName === name) return;
    this.bgmName = name;
    var tr = TRACKS[name] || TRACKS.forest;
    this.tracks = tr;
    this.pos.lead = 0; this.pos.bass = 0; this.pos.harm = 0; this.pos.noise = 0;
    this.nextTime = this.ctx.currentTime + 0.08;
    this.sixteenth = 60 / (tr.tempo * 4);
  };

  Audio.prototype.stopBgm = function () { this.bgmName = null; };

  // 每帧调用：提前 0.2 秒排程，保证节拍不被帧抖动影响
  Audio.prototype.tick = function () {
    if (!this.ok || !this.bgmName || this.paused) return;
    var look = 0.2;
    var now = this.ctx.currentTime;
    if (this.nextTime < now) this.nextTime = now + 0.02;
    var t = this.tracks, p = this.pos, s16 = this.sixteenth;
    var guard = 0;
    while (this.nextTime < now + look && guard++ < 64) {
      // lead
      var n = t.lead[p.lead % t.lead.length];
      var dur = n[1] * s16;
      if (n[0]) this._pulse(this.nextTime, dur * 0.92, freq(midi(n[0])), 0.10, this.bgmGain, true);
      // bass（三角波）
      var bn = t.bass[p.bass % t.bass.length];
      if (bn) this._triangle(this.nextTime, bn[1] * s16 * 0.95, freq(midi(bn[0])), 0.13, this.bgmGain);
      // harm（第二方波，稀疏点缀）
      var hn = t.harm[p.harm % t.harm.length];
      if (hn && (p.lead % 4 === 0)) this._pulse(this.nextTime, hn[1] * s16 * 0.5, freq(midi(hn[0])), 0.035, this.bgmGain, false);
      // 噪声：极轻的踩点，每 2 个 16 分一次
      if (p.noise % 2 === 0) this._noise(this.nextTime, 0.05, 0.018, 3200, this.bgmGain);

      this.nextTime += dur;
      p.lead++; p.bass++; p.harm++; p.noise++;
      // bass 用更长的音符，按自身时长推进
    }
  };

  // §8.3 音效共 14 类，单条不超过 0.8 秒
  var SFX = {
    jump:        { wave: 'pulse', f0: 330, f1: 620, dur: 0.12, gain: 0.12 },
    land:        { wave: 'noise', f0: 500, f1: 120, dur: 0.08, gain: 0.09 },
    reset:       { wave: 'pulse', f0: 420, f1: 150, dur: 0.28, gain: 0.10 },
    pickup:      { wave: 'arp', dur: 0.30, gain: 0.11 },
    dialogue:    { wave: 'pulse', f0: 880, f1: 880, dur: 0.03, gain: 0.05 },
    celebrate:   { wave: 'arp', dur: 0.60, gain: 0.12 },
    switch_down: { wave: 'pulse', f0: 220, f1: 180, dur: 0.10, gain: 0.11 },
    stone_door:  { wave: 'noise', f0: 900, f1: 260, dur: 0.42, gain: 0.10 },
    beam_align:  { wave: 'pulse', f0: 660, f1: 990, dur: 0.16, gain: 0.09 },
    pad_ok:      { wave: 'pulse', f0: 520, f1: 780, dur: 0.12, gain: 0.10 },
    pad_bad:     { wave: 'pulse', f0: 240, f1: 150, dur: 0.16, gain: 0.09 },
    water_gate:  { wave: 'noise', f0: 1400, f1: 400, dur: 0.50, gain: 0.08 },
    rune_merge:  { wave: 'arp', dur: 0.70, gain: 0.12 },
    cursor:      { wave: 'pulse', f0: 620, f1: 620, dur: 0.04, gain: 0.06 },
    confirm:     { wave: 'pulse', f0: 780, f1: 1040, dur: 0.10, gain: 0.09 },
    back:        { wave: 'pulse', f0: 420, f1: 300, dur: 0.09, gain: 0.08 },
    save_ok:     { wave: 'arp', dur: 0.40, gain: 0.10 },
    page:        { wave: 'noise', f0: 2600, f1: 1200, dur: 0.06, gain: 0.05 },
  };

  Audio.prototype.sfx = function (name) {
    if (!this.ok) return;
    var d = SFX[name];
    if (!d) return;
    var t = this.ctx.currentTime + 0.001;
    var out = this.sfxGain;
    if (d.wave === 'noise') {
      this._noise(t, Math.min(0.8, d.dur), d.gain, d.f0, out);
    } else if (d.wave === 'arp') {
      // 上行五音（§4.2 拾取表现：局部像素闪光 + 短促拾取音）
      var steps = [0, 4, 7, 11, 12];
      var base = 523.25;
      var each = d.dur / steps.length;
      for (var i = 0; i < steps.length; i++) {
        this._pulse(t + i * each, each * 1.6, base * Math.pow(2, steps[i] / 12), d.gain, out, i === 0);
      }
    } else {
      var o = this.ctx.createOscillator();
      var g = this.ctx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(d.f0, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, d.f1), t + d.dur);
      g.gain.setValueAtTime(d.gain, t);
      g.gain.exponentialRampToValueAtTime(0.0005, t + Math.min(0.8, d.dur));
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + Math.min(0.8, d.dur) + 0.02);
    }
  };

  Audio.TRACKS = TRACKS;
  CT.Audio = Audio;
})();

/* ==== src/core/textinput.js ==== */
/* 晶途拾光 — 文本输入
 * --------------------------------------------------------------------------
 * canvas 里没法直接调出中文输入法，所以这里挂一个不可见的 <input>：
 * 玩家在浏览器里按正常方式打字（含中文输入法），内容实时同步回游戏，
 * 游戏只负责把它画到点阵字上。
 *
 * 无 DOM 环境（无头自检）下自动退化为「键盘逐字输入 ASCII」，
 * 保证同一套游戏逻辑在两种环境里都能跑。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});

  var MAX_LEN = 10;
  var el = null;              // 隐藏的 input
  var onChange = null;        // 内容变化回调
  var asciiFallback = '';     // 无 DOM 时的缓冲
  var enabled = false;

  function hasDom() {
    return typeof document !== 'undefined' && document.createElement &&
           typeof document.body !== 'undefined' && document.body;
  }

  function ensureElement() {
    if (el || !hasDom()) return el;
    try {
      el = document.createElement('input');
      el.type = 'text';
      el.maxLength = MAX_LEN;
      el.setAttribute('autocomplete', 'off');
      el.setAttribute('autocorrect', 'off');
      el.setAttribute('autocapitalize', 'off');
      el.setAttribute('spellcheck', 'false');
      // 放到屏幕外，但保持可聚焦 —— display:none 的 input 无法唤起输入法
      el.style.position = 'fixed';
      el.style.left = '-9999px';
      el.style.top = '0';
      el.style.width = '1px';
      el.style.height = '1px';
      el.style.opacity = '0';
      el.style.border = '0';
      el.style.padding = '0';
      el.style.background = 'transparent';
      el.style.color = 'transparent';
      el.style.fontSize = '16px';   // 避免移动端聚焦时页面缩放
      el.addEventListener('input', function () {
        var v = el.value || '';
        if (v.length > MAX_LEN) { v = v.slice(0, MAX_LEN); el.value = v; }
        if (onChange) onChange(v);
      });
      el.addEventListener('keydown', function (e) {
        // 阻止空格/方向键冒泡出去触发游戏操作
        if (e.key === ' ' || e.key.indexOf('Arrow') === 0) e.stopPropagation();
      });
      document.body.appendChild(el);
    } catch (e) {
      el = null;
    }
    return el;
  }

  function open(initial, changeCb) {
    onChange = changeCb || null;
    enabled = true;
    asciiFallback = initial || '';
    var e = ensureElement();
    if (e) {
      e.value = initial || '';
      try { e.focus(); e.select(); } catch (err) { /* 忽略 */ }
    }
  }

  function close() {
    enabled = false;
    if (el) {
      try { el.blur(); } catch (e) { /* 忽略 */ }
      el.value = '';
    }
    onChange = null;
  }

  function value() {
    if (el) return el.value || '';
    return asciiFallback;
  }

  function setValue(v) {
    v = (v || '').slice(0, MAX_LEN);
    if (el) {
      el.value = v;
      if (onChange) onChange(v);
    } else {
      asciiFallback = v;
      if (onChange) onChange(v);
    }
    return v;
  }

  // 无 DOM 时的兜底：把可打印 ASCII 追加进缓冲
  function feedKeyCode(code, key) {
    if (el) return false;            // 有 input 时交给它自己处理
    if (!enabled) return false;
    if (code === 'Backspace') {
      asciiFallback = asciiFallback.slice(0, -1);
      if (onChange) onChange(asciiFallback);
      return true;
    }
    if (key && key.length === 1 && key.charCodeAt(0) >= 32 && key.charCodeAt(0) < 127) {
      if (asciiFallback.length < MAX_LEN) {
        asciiFallback += key;
        if (onChange) onChange(asciiFallback);
      }
      return true;
    }
    return false;
  }

  CT.TextInput = {
    MAX_LEN: MAX_LEN,
    open: open,
    close: close,
    value: value,
    setValue: setValue,
    feedKeyCode: feedKeyCode,
    get active() { return enabled; },
    get domAvailable() { return !!ensureElement(); },
  };
})();

 *
 * 提供两类能力：
 *   1. 基础图元（点/线/矩形/抖动/椭圆）——用于瓦片与背景的程序化生成

997f\u6069\u800c\u513f\u8033\u5c14\u9975\u6d31\u4e8c\u8d30\u53d1\u7f5a\u7b4f\u4f10\u4e4f\u9600\u6cd5\u73d0\u85e9\u5e06\u756a\u7ffb\u6a0a\u77fe\u9492\u7e41\u51e1\u70e6\u53cd\u8fd4\u8303\u8d29\u72af\u996d\u6cdb\u574a\u82b3\u65b9\u80aa\u623f\u9632\u59a8\u4eff\u8bbf\u7eba\u653e\u83f2\u975e\u5561\u98de\u80a5\u532a\u8bfd\u5420\u80ba\u5e9f\u6cb8\u8d39\u82ac\u915a\u5429\u6c1b\u5206\u7eb7\u575f\u711a\u6c7e\u7c89\u594b\u4efd\u5fff\u6124\u7caa\u4e30\u5c01\u67ab\u8702\u5cf0\u950b\u98ce\u75af\u70fd\u9022\u51af\u7f1d\u8bbd\u5949\u51e4\u4f5b\u5426\u592b\u6577\u80a4\u5b75\u6276\u62c2\u8f90\u5e45\u6c1f\u7b26\u4f0f\u4fd8\u670d\u6d6e\u6daa\u798f\u88b1\u5f17\u752b\u629a\u8f85\u4fef\u91dc\u65a7\u812f\u8151\u5e9c\u8150\u8d74\u526f\u8986\u8d4b\u590d\u5085\u4ed8\u961c\u7236\u8179\u8d1f\u5bcc\u8ba3\u9644\u5987\u7f1a\u5490\u5676\u560e\u8be5\u6539\u6982\u9499\u76d6\u6e89\u5e72\u7518\u6746\u67d1\u7aff\u809d\u8d76\u611f\u79c6\u6562\u8d63\u5188\u521a\u94a2\u7f38\u809b\u7eb2\u5c97\u6e2f\u6760\u7bd9\u768b\u9ad8\u818f\u7f94\u7cd5\u641e\u9550\u7a3f\u544a\u54e5\u6b4c\u6401\u6208\u9e3d\u80f3\u7599\u5272\u9769\u845b\u683c\u86e4\u9601\u9694\u94ec\u4e2a\u5404\u7ed9\u6839\u8ddf\u8015\u66f4\u5e9a\u7fb9\u57c2\u803f\u6897\u5de5\u653b\u529f\u606d\u9f9a\u4f9b\u8eac\u516c\u5bab\u5f13\u5de9\u6c5e\u62f1\u8d21\u5171\u94a9\u52fe\u6c9f\u82df\u72d7\u57a2\u6784\u8d2d\u591f\u8f9c\u83c7\u5495\u7b8d\u4f30\u6cbd\u5b64\u59d1\u9f13\u53e4\u86ca\u9aa8\u8c37\u80a1\u6545\u987e\u56fa\u96c7\u522e\u74dc\u5250\u5be1\u6302\u8902\u4e56\u62d0\u602a\u68fa\u5173\u5b98\u51a0\u89c2\u7ba1\u9986\u7f50\u60ef\u704c\u8d2f\u5149\u5e7f\u901b\u7470\u89c4\u572d\u7845\u5f52\u9f9f\u95fa\u8f68\u9b3c\u8be1\u7678\u6842\u67dc\u8dea\u8d35\u523d\u8f8a\u6eda\u68cd\u9505\u90ed\u56fd\u679c\u88f9\u8fc7\u54c8\u9ab8\u5b69\u6d77\u6c26\u4ea5\u5bb3\u9a87\u9163\u61a8\u90af\u97e9\u542b\u6db5\u5bd2\u51fd\u558a\u7f55\u7ff0\u64bc\u634d\u65f1\u61be\u608d\u710a\u6c57\u6c49\u592f\u676d\u822a\u58d5\u568e\u8c6a\u6beb\u90dd\u597d\u8017\u53f7\u6d69\u5475\u559d\u8377\u83cf\u6838\u79be\u548c\u4f55\u5408\u76d2\u8c89\u9602\u6cb3\u6db8\u8d6b\u8910\u9e64\u8d3a\u563f\u9ed1\u75d5\u5f88\u72e0\u6068\u54fc\u4ea8\u6a2a\u8861\u6052\u8f70\u54c4\u70d8\u8679\u9e3f\u6d2a\u5b8f\u5f18\u7ea2\u5589\u4faf\u7334\u543c\u539a\u5019\u540e\u547c\u4e4e\u5ffd\u745a\u58f6\u846b\u80e1\u8774\u72d0\u7cca\u6e56\u5f27\u864e\u552c\u62a4\u4e92\u6caa\u6237\u82b1\u54d7\u534e\u733e\u6ed1\u753b\u5212\u5316\u8bdd\u69d0\u5f8a\u6000\u6dee\u574f\u6b22\u73af\u6853\u8fd8\u7f13\u6362\u60a3\u5524\u75ea\u8c62\u7115\u6da3\u5ba6\u5e7b\u8352\u614c\u9ec4\u78fa\u8757\u7c27\u7687\u51f0\u60f6\u714c\u6643\u5e4c\u604d\u8c0e\u7070\u6325\u8f89\u5fbd\u6062\u86d4\u56de\u6bc1\u6094\u6167\u5349\u60e0\u6666\u8d3f\u79fd\u4f1a\u70e9\u6c47\u8bb3\u8bf2\u7ed8\u8364\u660f\u5a5a\u9b42\u6d51\u6df7\u8c41\u6d3b\u4f19\u706b\u83b7\u6216\u60d1\u970d\u8d27\u7978\u51fb\u573e\u57fa\u673a\u7578\u7a3d\u79ef\u7b95\u808c\u9965\u8ff9\u6fc0\u8ba5\u9e21\u59ec\u7ee9\u7f09\u5409\u6781\u68d8\u8f91\u7c4d\u96c6\u53ca\u6025\u75be\u6c72\u5373\u5ac9\u7ea7\u6324\u51e0\u810a\u5df1\u84df\u6280\u5180\u5b63\u4f0e\u796d\u5242\u60b8\u6d4e\u5bc4\u5bc2\u8ba1\u8bb0\u65e2\u5fcc\u9645\u5993\u7ee7\u7eaa\u5609\u67b7\u5939\u4f73\u5bb6\u52a0\u835a\u988a\u8d3e\u7532\u94be\u5047\u7a3c\u4ef7\u67b6\u9a7e\u5ac1\u6b7c\u76d1\u575a\u5c16\u7b3a\u95f4\u714e\u517c\u80a9\u8270\u5978\u7f04\u8327\u68c0\u67ec\u78b1\u7877\u62e3\u6361\u7b80\u4fed\u526a\u51cf\u8350\u69db\u9274\u8df5\u8d31\u89c1\u952e\u7bad\u4ef6\u5065\u8230\u5251\u996f\u6e10\u6e85\u6da7\u5efa\u50f5\u59dc\u5c06\u6d46\u6c5f\u7586\u848b\u6868\u5956\u8bb2\u5320\u9171\u964d\u8549\u6912\u7901\u7126\u80f6\u4ea4\u90ca\u6d47\u9a84\u5a07\u56bc\u6405\u94f0\u77eb\u4fa5\u811a\u72e1\u89d2\u997a\u7f34\u7ede\u527f\u6559\u9175\u8f7f\u8f83\u53eb\u7a96\u63ed\u63a5\u7686\u79f8\u8857\u9636\u622a\u52ab\u8282\u6854\u6770\u6377\u776b\u7aed\u6d01\u7ed3\u89e3\u59d0\u6212\u85c9\u82a5\u754c\u501f\u4ecb\u75a5\u8beb\u5c4a\u5dfe\u7b4b\u65a4\u91d1\u4eca\u6d25\u895f\u7d27\u9526\u4ec5\u8c28\u8fdb\u9773\u664b\u7981\u8fd1\u70ec\u6d78 730e\u7433\u6797\u78f7\u9716\u4e34\u90bb\u9cde\u6dcb\u51db\u8d41\u541d\u62ce\u73b2\u83f1\u96f6\u9f84\u94c3\u4f36\u7f9a\u51cc\u7075\u9675\u5cad\u9886\u53e6\u4ee4\u6e9c\u7409\u69b4\u786b\u998f\u7559\u5218\u7624\u6d41\u67f3\u516d\u9f99\u804b\u5499\u7b3c\u7abf\u9686\u5784\u62e2\u9647\u697c\u5a04\u6402\u7bd3\u6f0f\u964b\u82a6\u5362\u9885\u5e90\u7089\u63b3\u5364\u864f\u9c81\u9e93\u788c\u9732\u8def\u8d42\u9e7f\u6f5e\u7984\u5f55\u9646\u622e\u9a74\u5415\u94dd\u4fa3\u65c5\u5c65\u5c61\u7f15\u8651\u6c2f\u5f8b\u7387\u6ee4\u7eff\u5ce6\u631b\u5b6a\u6ee6\u5375\u4e71\u63a0\u7565\u62a1\u8f6e\u4f26\u4ed1\u6ca6\u7eb6\u8bba\u841d\u87ba\u7f57\u903b\u9523\u7ba9\u9aa1\u88f8\u843d\u6d1b\u9a86\u7edc\u5988\u9ebb\u739b\u7801\u8682\u9a6c\u9a82\u561b\u5417\u57cb\u4e70\u9ea6\u5356\u8fc8\u8109\u7792\u9992\u86ee\u6ee1\u8513\u66fc\u6162\u6f2b\u8c29\u8292\u832b\u76f2\u6c13\u5fd9\u83bd\u732b\u8305\u951a\u6bdb\u77db\u94c6\u536f\u8302\u5192\u5e3d\u8c8c\u8d38\u4e48\u73ab\u679a\u6885\u9176\u9709\u7164\u6ca1\u7709\u5a92\u9541\u6bcf\u7f8e\u6627\u5bd0\u59b9\u5a9a\u95e8\u95f7\u4eec\u840c\u8499\u6aac\u76df\u9530\u731b\u68a6\u5b5f\u772f\u919a\u9761\u7cdc\u8ff7\u8c1c\u5f25\u7c73\u79d8\u89c5\u6ccc\u871c\u5bc6\u5e42\u68c9\u7720\u7ef5\u5195\u514d\u52c9\u5a29\u7f05\u9762\u82d7\u63cf\u7784\u85d0\u79d2\u6e3a\u5e99\u5999\u8511\u706d\u6c11\u62bf\u76bf\u654f\u60af\u95fd\u660e\u879f\u9e23\u94ed\u540d\u547d\u8c2c\u6478\u6479\u8611\u6a21\u819c\u78e8\u6469\u9b54\u62b9\u672b\u83ab\u58a8\u9ed8\u6cab\u6f20\u5bde\u964c\u8c0b\u725f\u67d0\u62c7\u7261\u4ea9\u59c6\u6bcd\u5893\u66ae\u5e55\u52df\u6155\u6728\u76ee\u7766\u7267\u7a46\u62ff\u54ea\u5450\u94a0\u90a3\u5a1c\u7eb3\u6c16\u4e43\u5976\u8010\u5948\u5357\u7537\u96be\u56ca\u6320\u8111\u607c\u95f9\u6dd6\u5462\u9981\u5185\u5ae9\u80fd\u59ae\u9713\u502a\u6ce5\u5c3c\u62df\u4f60\u533f\u817b\u9006\u6eba\u852b\u62c8\u5e74\u78be\u64b5\u637b\u5ff5\u5a18\u917f\u9e1f\u5c3f\u634f\u8042\u5b7d\u556e\u954a\u954d\u6d85\u60a8\u67e0\u72de\u51dd\u5b81\u62e7\u6cde\u725b\u626d\u94ae\u7ebd\u8113\u6d53\u519c\u5f04\u5974\u52aa\u6012\u5973\u6696\u8650\u759f\u632a\u61e6\u7cef\u8bfa\u54e6\u6b27\u9e25\u6bb4\u85d5\u5455\u5076\u6ca4\u556a\u8db4\u722c\u5e15\u6015\u7436\u62cd\u6392\u724c\u5f98\u6e43\u6d3e\u6500\u6f58\u76d8\u78d0\u76fc\u7554\u5224\u53db\u4e53\u5e9e\u65c1\u802a\u80d6\u629b\u5486\u5228\u70ae\u888d\u8dd1\u6ce1\u5478\u80da\u57f9\u88f4\u8d54\u966a\u914d\u4f69\u6c9b\u55b7\u76c6\u7830\u62a8\u70f9\u6f8e\u5f6d\u84ec\u68da\u787c\u7bf7\u81a8\u670b\u9e4f\u6367\u78b0\u576f\u7812\u9739\u6279\u62ab\u5288\u7435\u6bd7\u5564\u813e\u75b2\u76ae\u5339\u75de\u50fb\u5c41\u8b6c\u7bc7\u504f\u7247\u9a97\u98d8\u6f02\u74e2\u7968\u6487\u77a5\u62fc\u9891\u8d2b\u54c1\u8058\u4e52\u576a\u82f9\u840d\u5e73\u51ed\u74f6\u8bc4\u5c4f\u5761\u6cfc\u9887\u5a46\u7834\u9b44\u8feb\u7c95\u5256\u6251\u94fa\u4ec6\u8386\u8461\u83e9\u84b2\u57d4\u6734\u5703\u666e\u6d66\u8c31\u66dd\u7011\u671f\u6b3a\u6816\u621a\u59bb\u4e03\u51c4\u6f06\u67d2\u6c8f\u5176\u68cb\u5947\u6b67\u7566\u5d0e\u8110\u9f50\u65d7\u7948\u7941\u9a91\u8d77\u5c82\u4e5e\u4f01\u542f\u5951\u780c\u5668\u6c14\u8fc4\u5f03\u6c7d\u6ce3\u8bab\u6390\u6070\u6d3d\u7275\u6266\u948e\u94c5\u5343\u8fc1\u7b7e\u4edf\u8c26\u4e7e\u9ed4\u94b1\u94b3\u524d\u6f5c\u9063\u6d45\u8c34\u5811\u5d4c\u6b20\u6b49\u67aa\u545b\u8154\u7f8c\u5899\u8537\u5f3a\u62a2\u6a47\u9539\u6572\u6084\u6865\u77a7\u4e54\u4fa8\u5de7\u9798\u64ac\u7fd8\u5ced\u4fcf\u7a8d\u5207\u8304\u4e14\u602f\u7a83\u94a6\u4fb5\u4eb2\u79e6\u7434\u52e4\u82b9\u64d2\u79bd\u5bdd\u6c81\u9752\u8f7b\u6c22\u503e\u537f\u6e05\u64ce\u6674\u6c30\u60c5\u9877\u8bf7\u5e86\u743c\u7a77\u79cb\u4e18\u90b1\u7403\u6c42\u56da\u914b\u6cc5\u8d8b\u533a\u86c6\u66f2\u8eaf\u5c48\u9a71\u6e20\u53d6\u5a36\u9f8b\u8da3\u53bb\u5708\u98a7\u6743\u919b\u6cc9\u5168\u75ca\u62f3\u72ac\u5238\u529d\u7f3a\u7094\u7638\u5374\u9e4a\u69b7\u786e\u96c0\u88d9\u7fa4\u7136\u71c3\u5189\u67d3\u74e4\u58e4\u6518\u56b7\u8ba9\u9976\u6270\u7ed5\u60f9\u70ed\u58ec\u4ec1\u4eba\u5fcd\u97e7\u4efb\u8ba4\u5203\u598a\u7eab\u6254\u4ecd\u65e5\u620e\u8338\u84c9\u8363\u878d\u7194\u6eb6 6ee9\u575b\u6a80\u75f0\u6f6d\u8c2d\u8c08\u5766\u6bef\u8892\u78b3\u63a2\u53f9\u70ad\u6c64\u5858\u642a\u5802\u68e0\u819b\u5510\u7cd6\u5018\u8eba\u6dcc\u8d9f\u70eb\u638f\u6d9b\u6ed4\u7ee6\u8404\u6843\u9003\u6dd8\u9676\u8ba8\u5957\u7279\u85e4\u817e\u75bc\u8a8a\u68af\u5254\u8e22\u9511\u63d0\u9898\u8e44\u557c\u4f53\u66ff\u568f\u60d5\u6d95\u5243\u5c49\u5929\u6dfb\u586b\u7530\u751c\u606c\u8214\u8146\u6311\u6761\u8fe2\u773a\u8df3\u8d34\u94c1\u5e16\u5385\u542c\u70c3\u6c40\u5ef7\u505c\u4ead\u5ead\u633a\u8247\u901a\u6850\u916e\u77b3\u540c\u94dc\u5f64\u7ae5\u6876\u6345\u7b52\u7edf\u75db\u5077\u6295\u5934\u900f\u51f8\u79c3\u7a81\u56fe\u5f92\u9014\u6d82\u5c60\u571f\u5410\u5154\u6e4d\u56e2\u63a8\u9893\u817f\u8715\u892a\u9000\u541e\u5c6f\u81c0\u62d6\u6258\u8131\u9e35\u9640\u9a6e\u9a7c\u692d\u59a5\u62d3\u553e\u6316\u54c7\u86d9\u6d3c\u5a03\u74e6\u889c\u6b6a\u5916\u8c4c\u5f2f\u6e7e\u73a9\u987d\u4e38\u70f7\u5b8c\u7897\u633d\u665a\u7696\u60cb\u5b9b\u5a49\u4e07\u8155\u6c6a\u738b\u4ea1\u6789\u7f51\u5f80\u65fa\u671b\u5fd8\u5984\u5a01\u5dcd\u5fae\u5371\u97e6\u8fdd\u6845\u56f4\u552f\u60df\u4e3a\u6f4d\u7ef4\u82c7\u840e\u59d4\u4f1f\u4f2a\u5c3e\u7eac\u672a\u851a\u5473\u754f\u80c3\u5582\u9b4f\u4f4d\u6e2d\u8c13\u5c09\u6170\u536b\u761f\u6e29\u868a\u6587\u95fb\u7eb9\u543b\u7a33\u7d0a\u95ee\u55e1\u7fc1\u74ee\u631d\u8717\u6da1\u7a9d\u6211\u65a1\u5367\u63e1\u6c83\u5deb\u545c\u94a8\u4e4c\u6c61\u8bec\u5c4b\u65e0\u829c\u68a7\u543e\u5434\u6bcb\u6b66\u4e94\u6342\u5348\u821e\u4f0d\u4fae\u575e\u620a\u96fe\u6664\u7269\u52ff\u52a1\u609f\u8bef\u6614\u7199\u6790\u897f\u7852\u77fd\u6670\u563b\u5438\u9521\u727a\u7a00\u606f\u5e0c\u6089\u819d\u5915\u60dc\u7184\u70ef\u6eaa\u6c50\u7280\u6a84\u88ad\u5e2d\u4e60\u5ab3\u559c\u94e3\u6d17\u7cfb\u9699\u620f\u7ec6\u778e\u867e\u5323\u971e\u8f96\u6687\u5ce1\u4fa0\u72ed\u4e0b\u53a6\u590f\u5413\u6380\u9528\u5148\u4ed9\u9c9c\u7ea4\u54b8\u8d24\u8854\u8237\u95f2\u6d8e\u5f26\u5acc\u663e\u9669\u73b0\u732e\u53bf\u817a\u9985\u7fa1\u5baa\u9677\u9650\u7ebf\u76f8\u53a2\u9576\u9999\u7bb1\u8944\u6e58\u4e61\u7fd4\u7965\u8be6\u60f3\u54cd\u4eab\u9879\u5df7\u6a61\u50cf\u5411\u8c61\u8427\u785d\u9704\u524a\u54ee\u56a3\u9500\u6d88\u5bb5\u6dc6\u6653\u5c0f\u5b5d\u6821\u8096\u5578\u7b11\u6548\u6954\u4e9b\u6b47\u874e\u978b\u534f\u631f\u643a\u90aa\u659c\u80c1\u8c10\u5199\u68b0\u5378\u87f9\u61c8\u6cc4\u6cfb\u8c22\u5c51\u85aa\u82af\u950c\u6b23\u8f9b\u65b0\u5ffb\u5fc3\u4fe1\u8845\u661f\u8165\u7329\u60fa\u5174\u5211\u578b\u5f62\u90a2\u884c\u9192\u5e78\u674f\u6027\u59d3\u5144\u51f6\u80f8\u5308\u6c79\u96c4\u718a\u4f11\u4fee\u7f9e\u673d\u55c5\u9508\u79c0\u8896\u7ee3\u589f\u620c\u9700\u865a\u5618\u987b\u5f90\u8bb8\u84c4\u9157\u53d9\u65ed\u5e8f\u755c\u6064\u7d6e\u5a7f\u7eea\u7eed\u8f69\u55a7\u5ba3\u60ac\u65cb\u7384\u9009\u7663\u7729\u7eda\u9774\u859b\u5b66\u7a74\u96ea\u8840\u52cb\u718f\u5faa\u65ec\u8be2\u5bfb\u9a6f\u5de1\u6b89\u6c5b\u8bad\u8baf\u900a\u8fc5\u538b\u62bc\u9e26\u9e2d\u5440\u4e2b\u82bd\u7259\u869c\u5d16\u8859\u6daf\u96c5\u54d1\u4e9a\u8bb6\u7109\u54bd\u9609\u70df\u6df9\u76d0\u4e25\u7814\u8712\u5ca9\u5ef6\u8a00\u989c\u960e\u708e\u6cbf\u5944\u63a9\u773c\u884d\u6f14\u8273\u5830\u71d5\u538c\u781a\u96c1\u5501\u5f66\u7130\u5bb4\u8c1a\u9a8c\u6b83\u592e\u9e2f\u79e7\u6768\u626c\u4f6f\u75a1\u7f8a\u6d0b\u9633\u6c27\u4ef0\u75d2\u517b\u6837\u6f3e\u9080\u8170\u5996\u7476\u6447\u5c27\u9065\u7a91\u8c23\u59da\u54ac\u8200\u836f\u8981\u8000\u6930\u564e\u8036\u7237\u91ce\u51b6\u4e5f\u9875\u6396\u4e1a\u53f6\u66f3\u814b\u591c\u6db2\u4e00\u58f9\u533b\u63d6\u94f1\u4f9d\u4f0a\u8863\u9890\u5937\u9057\u79fb\u4eea\u80f0\u7591\u6c82\u5b9c\u59e8\u5f5d\u6905\u8681\u501a\u5df2\u4e59\u77e3\u4ee5\u827a\u6291\u6613\u9091\u5c79\u4ebf\u5f79\u81c6\u9038\u8084\u75ab\u4ea6\u88d4\u610f\u6bc5\u5fc6\u4e49\u76ca\u6ea2\u8be3\u8bae\u8c0a\u8bd1\u5f02\u7ffc\u7fcc\u7ece\u8335\u836b\u56e0\u6bb7\u97f3\u9634\u59fb\u541f\u94f6\u6deb\u5bc5\u996e\u5c39\u5f15\u9690\u5370\u82f1\u6a31\u5a74\u9e70\u5e94\u7f28\u83b9\u8424\u8425\u8367\u8747\u8fce\u8d62\u76c8\u5f71\u9896\u786c\u6620\u54df\u62e5\u4f63\u81c3\u75c8\u5eb8\u96cd /* ==== src/art/font.js ==== */
/* 晶途拾光 — 点阵字渲染
 * --------------------------------------------------------------------------
 * §7.5 字体为 8 × 8 像素点阵字，中文使用 12 × 12 点阵。
 *
 * 字库由 tools/gen_font.py 生成为 1-bit 打包位图 + base64。本模块自行解码
 * base64（不依赖 atob，因此无头 QA 也能跑），按需解位并缓存字形掩码，绘制
 * 时走 FB.blitMaskColor —— 每个像素只写一次，热路径零分配。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});

  var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  var B64INV = (function () {
    var t = new Int16Array(128).fill(-1);
    for (var i = 0; i < B64.length; i++) t[B64.charCodeAt(i)] = i;
    return t;
  })();

  function b64decode(str) {
    var out = new Uint8Array(((str.length * 3) >> 2) + 3);
    var o = 0, acc = 0, bits = 0;
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c === 61) break; // '='
      var v = c < 128 ? B64INV[c] : -1;
      if (v < 0) continue;
      acc = (acc << 6) | v;
      bits += 6;
      if (bits >= 8) {
        bits -= 8;
        out[o++] = (acc >> bits) & 0xff;
      }
    }
    return out.subarray(0, o);
  }

  var CJK_ADV = 12;   // §7.5 中文 12×12
  var LAT_ADV = 8;    // §7.5 西文 8×8

  var cjkSet = null, latSet = null;
  var cjkIndex = null;
  var cjkCache = new Map();
  var latCache = [];
  var fallbackMask = null;

  function buildSet(data, cell) {
    var bits = b64decode(data.bits);
    var map = null;
    if (data.chars.length > 200) {
      map = new Map();
      for (var i = 0; i < data.chars.length; i++) map.set(data.chars[i], i);
    }
    return { cell: cell, bits: bits, chars: data.chars, map: map, per: cell * cell };
  }

  }

  function cjkMask(ch) {
    var i = cjkIndex.get(ch);
    if (i === undefined) return null;
    var m = cjkCache.get(i);

      m = decodeGlyph(cjkSet, i);

    return code > 0x2000 || (code >= 0x3000 && code <= 0x9fff) || code >= 0xff00;

      var m = latMask(code);

  // ------------------------------------------------------------------ draw

  /**
   * @param {CT.FB} fb
   * @param {string} text
   * @param {number} x
   * @param {number} y
   * @param {number} color  0xAABBGGRR
   * @param {object} [opt]  {outline: color, dither: 0..16, maxW: px, align:'left'|'center'|'right', limit: charCount}
   */
  function draw(fb, text, x, y, color, opt) {
    init();
    opt = opt || null;
    var outline = opt && opt.outline;
    var dither = opt && opt.dither !== undefined ? opt.dither : 16;

    for (i = 0; i < text.length && !stop; i++) {
      if (drawn >= limit) break;
      code = text.charCodeAt(i);
      g = glyphFor(code);
      if (!g) continue;
      if (maxW && cx + g.adv - x > maxW) break;
      if (code !== 32) {
        var dx = cx, dy = y;
        if (hasOutline) {
          // 1 像素斜向投影。四向描边在 12 px 汉字上会把笔画吃掉、看起来像重影；
          // 斜向投影只加一份暗色，既压住背景又不糊字。
          fb.blitMaskColor(g.mask, g.cell, g.cell, dx + 1, dy + 1, outline, dither);
        }
        fb.blitMaskColor(g.mask, g.cell, g.cell, dx, dy, color, dither);
      }
      cx += g.adv;
      drawn++;
    }
    totalW = cx - x;
    return totalW;
  }

  function drawCentered(fb, text, cx, y, color, opt) {
    init();
    var w = measure(text);
    return draw(fb, text, Math.round(cx - w / 2), y, color, opt);
  }

  function drawRight(fb, text, rx, y, color, opt) {
    init();
    var w = measure(text);
    return draw(fb, text, Math.round(rx - w), y, color, opt);
  }

  function measure(text) {
    init();
    var w = 0;
    for (var i = 0; i < text.length; i++) {
      var code = text.charCodeAt(i);
      w += code < 128 ? LAT_ADV : CJK_ADV;
    }
    return w;
  }

  function charW(code) { return code < 128 ? LAT_ADV : CJK_ADV; }

  /**
   * 按像素宽度折行。返回字符串数组，最多 maxLines 行；超出的部分丢弃并置
   * truncated 标记（调用方据此提示）。
   */
  function wrap(text, maxW, maxLines) {
    init();

    var cur = '';
    var curW = 0;

      var code = text.charCodeAt(i);

        lines.push(cur); cur = ''; curW = 0;
        continue;
      }
      var cw = charW(code);
      if (curW + cw > maxW && cur.length > 0) {
        lines.push(cur);
        cur = '';
        curW = 0;
        if (maxLines && lines.length >= maxLines) return lines;
      }
      cur += text[i];
      curW += cw;
    }
    if (cur.length || lines.length === 0) lines.push(cur);
    if (maxLines && lines.length > maxLines) lines.length = maxLines;
    return lines;
  }

  // 供 tools/check_font_coverage.mjs 使用的字形覆盖查询
  function hasGlyph(ch) {
    init();
    var code = ch.charCodeAt(0);
    if (code < 128) return latSet.chars.indexOf(ch) >= 0;
    return cjkIndex.has(ch);
  }

  CT.Font = {
    init: init,
    draw: draw,
    drawCentered: drawCentered,
    drawRight: drawRight,
    measure: measure,
    wrap: wrap,
    hasGlyph: hasGlyph,
    CJK_ADV: CJK_ADV,
    LAT_ADV: LAT_ADV,
    get cjkCount() { init(); return cjkSet.chars.length; },
  };
})();

/* ==== src/art/gen_tiles.js ==== */
﻿/* 晶途拾光 — 地形瓦片生成
 * --------------------------------------------------------------------------
 * §7.3 瓦片与图集：16 × 16 瓦片拼接；每主题一套完整瓦片集（地面、斜坡、墙角、
 * 平台、装饰、水面、可交互物共 8 类，总数不少于 180 块）。
 *
 * 实现方式：按「8 邻接掩码 × 4 变体」按需生成并缓存。真实关卡用到的组合约
 * 40 组 × 4 变体 = 160 块（加上斜坡/平台/墙角后超过 180 块），边缘、转角、
 * 描边全部由邻接关系推导，因此不会出现接缝错位。
 *
 * 掩码位（置位 = 该方向为实心地形）：
 *   1 上   2 下   4 左   8 右   16 左上  32 右上  64 左下  128 右下
 *
 * 视觉结构（每块瓦片自上而下）：
 *   顶面 cap（主题风格化：草 / 晶壳 / 云絮 / 沙岸 / 金线嵌纹）→ 接触阴影 →
 *   主体（连续层理 strata + 卵石 + 主题点缀）→ 底面对阴影 → 左右收边
 * 层理用固定局部 y 绘制，因此相邻瓦片的层理会连成整条横线，产生岩层感。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});
  var A = CT.Art;

  var UP = 1, DOWN = 2, LEFT = 4, RIGHT = 8, UL = 16, UR = 32, DL = 64, DR = 128;
  var KIND = { GROUND: 0, PLATFORM: 1, WALL: 2, SLOPE_R: 3, SLOPE_L: 4 };

  var TS = 16;

  var STYLE = {
    // 青藓初林：草绿顶面 + 土褐主体。褐色只有 8/9/10 三档，纹理必须全部落在褐色系，
    // 绿色只用于苔藓点缀，否则地面会撒满绿点。
    forest: {
      capStyle: 'grass', capHi: 2, cap: 3, capDeep: 4, capShadow: 5,
      body: 8, bodyAlt: 9, bodyDark: 10, tex: 10, tex2: 9, moss: 6,
      edge: 12, edgeSoft: 13, deep: 14, strata: 10, accent: 'stone', inner: 13, innerHi: 12,
    },
    // 琥珀岩窟：琥珀晶壳顶面 + 暖褐岩体
    amber: {
      capStyle: 'crust', capHi: 11, cap: 8, capDeep: 5, capShadow: 6,
      body: 5, bodyAlt: 4, bodyDark: 6, tex: 7, tex2: 2, moss: 10,
      edge: 12, edgeSoft: 13, deep: 14, strata: 7, accent: 'crystal', inner: 13, innerHi: 12,
    },
    // 云漫高台：云絮柔边顶面 + 青灰岩体
    cloud: {
      capStyle: 'fluff', capHi: 0, cap: 1, capDeep: 2, capShadow: 3,
      body: 5, bodyAlt: 4, bodyDark: 6, tex: 7, tex2: 8, moss: 11,
      edge: 12, edgeSoft: 13, deep: 14, strata: 6, accent: 'puff', inner: 13, innerHi: 12,
    },
    // 碧泽水庭：石英沙岸顶面 + 湖石主体
    water: {
      capStyle: 'sand', capHi: 1, cap: 11, capDeep: 8, capShadow: 4,
      body: 5, bodyAlt: 3, bodyDark: 6, tex: 7, tex2: 2, moss: 6,
      edge: 12, edgeSoft: 13, deep: 14, strata: 6, accent: 'ring', inner: 13, innerHi: 12,
    },
    // 星纹古殿：银石顶面 + 金色嵌纹 + 靛蓝石体
    star: {
      capStyle: 'inlay', capHi: 0, cap: 2, capDeep: 3, capShadow: 4,
      body: 6, bodyAlt: 5, bodyDark: 7, tex: 7, tex2: 4, moss: 8,
      edge: 12, edgeSoft: 13, deep: 14, strata: 7, accent: 'rune', inner: 13, innerHi: 12,
    },
  };

  var caches = {};

  function cacheFor(themeKey) {

      c = caches[themeKey] = {

  // ------------------------------------------------------------- 顶面绘制

        A.dither(b, 0, 4, TS, 1, P.c[st.capShadow], 4);
        break;

      case 'crust':
        // 晶壳：不规则 1~2 像素起伏的晶体表层
        for (x = 0; x < TS; x++) {
          r = rng.f();
          A.set(b, x, 0, r < 0.45 ? P.c[st.capHi] : P.c[st.cap]);
          if (r < 0.18) A.set(b, x, 1, P.c[st.capHi]); // 小晶尖
        }
        A.hline(b, 0, 1, TS, P.c[st.cap]);
        A.hline(b, 0, 2, TS, P.c[st.capDeep]);
        A.dither(b, 0, 3, TS, 2, P.c[st.capDeep], 6);
        A.dither(b, 0, 4, TS, 1, P.c[st.capShadow], 3);
        break;

      case 'fluff':
        // 云絮：柔边，用抖动做三层递减
        for (x = 0; x < TS; x++) {
          r = rng.f();
          if (r < 0.88) A.set(b, x, 0, P.c[st.capHi]);
          if (r < 0.55) A.set(b, x, 1, P.c[st.capHi]);
          else A.set(b, x, 1, P.c[st.cap]);
        }
        A.dither(b, 0, 2, TS, 1, P.c[st.cap], 13);
        A.dither(b, 0, 2, TS, 1, P.c[st.capDeep], 9);
        A.dither(b, 0, 3, TS, 2, P.c[st.capDeep], 8);
        A.dither(b, 0, 4, TS, 1, P.c[st.capShadow], 4);
        break;

      case 'sand':
        // 沙岸：细沙点 + 潮线
        for (x = 0; x < TS; x++) {
          r = rng.f();
          A.set(b, x, 0, r < 0.35 ? P.c[st.capHi] : P.c[st.cap]);
        }
        A.hline(b, 0, 1, TS, P.c[st.cap]);
        for (x = 0; x < TS; x++) {
          r = rng.f();
          A.set(b, x, 2, r < 0.6 ? P.c[st.cap] : P.c[st.capDeep]);
        }
        A.dither(b, 0, 3, TS, 1, P.c[st.capDeep], 7);
        A.dither(b, 0, 4, TS, 1, P.c[st.capShadow], 4);
        break;

      case 'inlay':
      default:

        for (x = 0; x < TS; x++) {
          r = rng.f();
          A.set(b, x, 0, r < 0.4 ? P.c[st.capHi] : P.c[st.cap]);
        }
        A.hline(b, 0, 1, TS, P.c[st.cap]);
        for (x = 0; x < TS; x++) {
          var on = ((x + (rng.f() < 0.5 ? 0 : 1)) & 3) === 0;
          A.set(b, x, 2, on ? P.c[8] : P.c[st.capDeep]);
        }
        A.dither(b, 0, 3, TS, 1, P.c[st.capDeep], 8);
        A.dither(b, 0, 4, TS, 1, P.c[st.capShadow], 4);

  }

  // ------------------------------------------------------------- 主体纹理
  // strata: 固定局部 y 的层理线，跨瓦片连成整条岩层
  function drawBody(b, c, rng, y0, y1) {
    var P = c.P, st = c.style;
    var h = y1 - y0;
    if (h <= 0) return;
    A.fill(b, 0, y0, TS, h, P.c[st.body]);

    // 层理（只在主体区域内部画，避免压到顶面）
    var strataYs = st.capStyle === 'fluff' ? [9, 13] : [9, 13];
    for (var s = 0; s < strataYs.length; s++) {
      var sy = strataYs[s];

      A.dither(b, 0, sy + 1, TS, 1, P.c[st.strata], 2);

    var clusters = 2 + ((rng.f() * 2) | 0);
    for (var i = 0; i < clusters; i++) {
      var px = 1 + ((rng.f() * (TS - 4)) | 0);
      var py = y0 + 1 + ((rng.f() * Math.max(1, h - 4)) | 0);
      if (py < y0 + 1) py = y0 + 1;
      var cUp = rng.f() < 0.5 ? st.bodyAlt : st.bodyDark;
      A.fill(b, px, py, 2, 2, P.c[cUp]);
      A.hline(b, px, py + 2, 2, P.c[st.deep]);

    for (var k = 0; k < specks; k++) {
      var sx = (rng.f() * TS) | 0;

        A.fill(b, x, y, 3, 2, P.c[st.tex2]);

        A.hline(b, x, y + 2, 3, P.c[st.deep]);
        A.set(b, x + 1, y - 1, P.c[st.moss]);
      }
      if (rng.f() < 0.22) {
        x = 3 + ((rng.f() * 10) | 0); y = 7 + ((rng.f() * 6) | 0);
        A.vline(b, x, y, 3, P.c[st.bodyDark]);
      }
    } else if (kind === 'crystal') {
      if (rng.f() < 0.6) {
        x = 3 + ((rng.f() * 9) | 0); y = 6 + ((rng.f() * 8) | 0);
        A.set(b, x, y, P.c[11]);
        A.set(b, x, y + 1, P.c[8]);
        A.set(b, x + 1, y + 1, P.c[4]);
        A.set(b, x, y + 2, P.c[5]);
        A.set(b, x + 1, y + 2, P.c[5]);
        A.set(b, x + 1, y + 3, P.c[6]);
      }
      if (rng.f() < 0.35) {
        x = 2 + ((rng.f() * 12) | 0); y = 7 + ((rng.f() * 7) | 0);
        A.hline(b, x, y, 3, P.c[st.tex2]);
      }
    } else if (kind === 'puff') {
      if (rng.f() < 0.65) {
        x = 3 + ((rng.f() * 10) | 0); y = 6 + ((rng.f() * 8) | 0);

        A.dither(b, x - 3, y - 3, 8, 5, P.c[8], 4);

        A.set(b, x + 2, y, P.c[st.tex2]);
        A.set(b, x + 1, y + 1, P.c[st.tex2]);
      }
      if (rng.f() < 0.3) {
        x = 2 + ((rng.f() * 11) | 0); y = 8 + ((rng.f() * 6) | 0);
        A.set(b, x, y, P.c[st.moss]);
        A.set(b, x + 1, y, P.c[st.moss]);
      }
    } else if (kind === 'rune') {
      if (rng.f() < 0.55) {
        x = 3 + ((rng.f() * 9) | 0); y = 7 + ((rng.f() * 7) | 0);
        A.hline(b, x, y, 3, P.c[8]);
        A.set(b, x + 1, y - 1, P.c[2]);
        A.set(b, x + 1, y + 1, P.c[3]);
      }
      if (rng.f() < 0.3) {
        x = 4 + ((rng.f() * 8) | 0); y = 8 + ((rng.f() * 6) | 0);
        A.vline(b, x, y, 2, P.c[st.bodyDark]);
        A.set(b, x, y + 2, P.c[st.tex]);
      }
    }
  }

  // --------------------------------------------------------------- 深层内部
  // 地表以下很深的地方如果继续画土，整片地面会变成一块巨大的扁平色块。
  // 8-bit 做法是：表层几行是土，再往下转成暗色岩体，让地面看起来有深度。
  function drawInterior(b, c, rng, variant) {
