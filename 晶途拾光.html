 *   水平速度 90 px/s、滞空 0.81 s  ->  最大水平跨距 73 px ≈ 4.5 格
 * 因此 maxGap ≤ 4、maxStepUp ≤ 3，两者都在物理可行范围内。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});
  var TS = 16;

  // §4.1 物理参数派生出的可达性上限
  var JUMP_H = (260 * 260) / (2 * 640) / TS;      // 3.30 格
  var JUMP_DIST = (2 * 260 / 640) * 90 / TS;      // 4.56 格
  var MAX_GAP_HARD = 4;                            // 硬上限，超过必定跳不过去
  var MAX_STEP_HARD = 3;

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function generate(levelId) {
    var info = CT.Themes.levelInfo(levelId);
    if (!info) throw new Error('levelgen: unknown level ' + levelId);
    var th = info.theme, li = info.index;
    var diff = th.difficulty;
    var maxGap = Math.min(diff.maxGap, MAX_GAP_HARD);
    var maxStepUp = Math.min(diff.maxStepUp, MAX_STEP_HARD);

    var rng = new CT.Rng(CT.seedOf('level:' + levelId));

    // 每关抽一种「布局风格」，决定各种分段的权重。
    // 没有这一步时，25 关都是同一套起伏节奏，走两关就能摸清规律。
    var LAYOUT_WEIGHTS = {
      rolling:  { shaft: 0.34, gap: 0.34, step: 0.28, branch: 0.18 },  // 起伏平缓
      gappy:    { shaft: 0.34, gap: 0.48, step: 0.16, branch: 0.14 },  // 多坑少台
      terraced: { shaft: 0.34, gap: 0.16, step: 0.48, branch: 0.16 },  // 阶梯台地
      towers:   { shaft: 0.34, gap: 0.26, step: 0.20, branch: 0.36 },  // 多分支高台
    };
    var LAYOUT_KEYS = ['rolling', 'gappy', 'terraced', 'towers'];
    var layout = LAYOUT_KEYS[rng.int(0, LAYOUT_KEYS.length - 1)];
    var LW2 = LAYOUT_WEIGHTS[layout];

    // ---- 尺寸：按关卡在单元中的位置决定宽度（§5.3 区间 120~180）
    // 长度：在原来的递进基础上整体 +40%（这是后续需求，覆盖 §5.3 的 120~180）。
    // 仍然保留「章内逐关变长 + 章间逐章变长」的双重递进。
    var chapter = th.index || 1;
    var baseW = 120 + 10 * (li - 1) + 7 * (chapter - 1);
    var W = Math.round(baseW * 1.4) + rng.int(-4, 4);
    W = Math.max(160, Math.min(260, W));
    // 高度也收敛一点：落差太大时镜头会整屏都在看一堵墙
    var H = 28 + rng.int(0, 4);              // 28~32
    // 出生面必须够高，否则「6 格以上垂直落差」会被地面下限夹掉（只能下降，
    // 而地面最低只能到 H-3）。留出 H-16 就有 10 格以上的下落余量。
    var baseY = H - 16;

    // ---------------------------------------------------------------- 剖面
    var floorY = new Int16Array(W);
    for (var i = 0; i < W; i++) floorY[i] = -1;    // -1 表示深坑
    var segments = [];                              // {x0, w, floor, type}

    var x = 0;
    // 左边界墙 2 列
    for (i = 0; i < 2; i++) { floorY[i] = baseY; }
    segments.push({ x0: 0, w: 2, floor: baseY, type: 'wall' });
    x = 2;

    // 出生平台：14 格平地（安全区，放 NPC 与教学提示）
    for (i = 0; i < 14; i++) floorY[x + i] = baseY;
    segments.push({ x0: x, w: 14, floor: baseY, type: 'start' });
    x += 14;

    var curFloor = baseY;
    var lastType = 'start';
    var dropDone = false;       // 是否已经做过 6 格以上垂直落差
    var branchCount = 0;
    var branchSpots = [];       // 可以放上层平台的位置 {x0,w,floor}
    var flatRuns = [];          // 可放机关的平地 {x0,w,floor}

    function clampFloor(f) {
      return Math.max(8, Math.min(H - 3, f));
    }
    // §5.3 要求至少一处 6 格以上垂直落差。地面最深只能到 H-3，因此必须在
    // 地表还没降太深之前就做出这个落差；否则 clamp 会把落差压没。
    function keepDropRoom(f) {
      if (dropDone) return f;
      return Math.min(f, H - 9);
    }

    while (x < W - 16) {
      var remain = W - 16 - x;
      var pick = rng.f();
      var type;
      var dropRoom = H - 3 - curFloor;   // 当前地表还能往下掉几格
      if (lastType === 'gap' || lastType === 'shaft') type = 'flat';
      else if (!dropDone && dropRoom >= 6 && (pick < LW2.shaft || remain < 46)) type = 'shaft';
      else if (pick < LW2.gap) type = 'gap';
      else if (pick < LW2.gap + LW2.step) type = 'step';
      else if (pick < LW2.gap + LW2.step + LW2.branch && branchCount < 2) type = 'branch';
      else type = 'flat';

      if (type === 'flat') {
        var fw = rng.int(6, 11);
        fw = Math.min(fw, remain);
        var f = keepDropRoom(clampFloor(curFloor));
        for (i = 0; i < fw; i++) floorY[x + i] = f;
        segments.push({ x0: x, w: fw, floor: f, type: 'flat' });
        flatRuns.push({ x0: x, w: fw, floor: f });
        x += fw;
      } else if (type === 'step') {
        var sw = rng.int(5, 8);
        sw = Math.min(sw, remain);
        var dir = rng.f() < 0.5 ? -1 : 1;
        var step = rng.int(1, dir < 0 ? maxStepUp : Math.max(1, maxStepUp));
        var nf = keepDropRoom(clampFloor(curFloor + dir * step));
        for (i = 0; i < sw; i++) floorY[x + i] = nf;
        segments.push({ x0: x, w: sw, floor: nf, type: 'step' });
        if (sw >= 6) flatRuns.push({ x0: x, w: sw, floor: nf });
        curFloor = nf;
        x += sw;
      } else if (type === 'gap') {
        var gw = rng.int(2, maxGap);
        // 坑：整列挖空
        for (i = 0; i < gw; i++) floorY[x + i] = -1;
        segments.push({ x0: x, w: gw, floor: -1, type: 'gap' });
        x += gw;
        // 落点必须不比起跳点高太多，否则跳不上去
        var lf = keepDropRoom(clampFloor(curFloor + rng.int(-1, 1)));
        var lw = rng.int(7, 10);              // §5.5 缓冲平台
        lw = Math.min(lw, W - 16 - x);
        if (lw < 4) lw = Math.min(4, W - 16 - x);
        for (i = 0; i < lw; i++) floorY[x + i] = lf;
        segments.push({ x0: x, w: lw, floor: lf, type: 'land' });
        flatRuns.push({ x0: x, w: lw, floor: lf });
        curFloor = lf;
        x += lw;
      } else if (type === 'shaft') {
        // §5.3 至少一处 6 格以上的垂直落差
        // 落差封顶 6 格（§5.3 要求的「至少一处 6 格以上」正好取最小值）。
        // 之前是 6~8，视觉上会出现一整屏高墙。
        var drop = Math.min(6, H - 3 - curFloor);
        var tw = rng.int(3, 5);
        tw = Math.min(tw, remain);
        var sf = clampFloor(curFloor + drop);
        for (i = 0; i < tw; i++) floorY[x + i] = sf;
        segments.push({ x0: x, w: tw, floor: sf, type: 'shaft' });
        dropDone = true;
        curFloor = sf;
        x += tw;
        // 落差之后给一块缓冲平台
        var bw = rng.int(7, 11);
        bw = Math.min(bw, W - 16 - x);
        if (bw > 0) {
          for (i = 0; i < bw; i++) floorY[x + i] = sf;
          segments.push({ x0: x, w: bw, floor: sf, type: 'land' });
          flatRuns.push({ x0: x, w: bw, floor: sf });
          x += bw;
        }
      } else { // branch
        var brw = rng.int(8, 12);
        brw = Math.min(brw, remain);
        var bf = keepDropRoom(clampFloor(curFloor));
        for (i = 0; i < brw; i++) floorY[x + i] = bf;
        segments.push({ x0: x, w: brw, floor: bf, type: 'branch' });
        flatRuns.push({ x0: x, w: brw, floor: bf });
        branchSpots.push({ x0: x, w: brw, floor: bf });
        branchCount++;
        curFloor = bf;
        x += brw;
      }
      lastType = type;
    }

    // 收尾平台 + 右边界墙
    var tailW = W - x - 2;
    if (tailW > 0) {
      for (i = 0; i < tailW; i++) floorY[x + i] = keepDropRoom(clampFloor(curFloor));
      segments.push({ x0: x, w: tailW, floor: clampFloor(curFloor), type: 'end' });
      flatRuns.push({ x0: x, w: tailW, floor: clampFloor(curFloor) });
      x += tailW;
    }
    for (i = 0; i < 2; i++) floorY[x + i] = clampFloor(curFloor);
    segments.push({ x0: x, w: 2, floor: clampFloor(curFloor), type: 'wall' });

    // ---------------------------------------------------------------- 填充
    var grid = [];
    for (var gy = 0; gy < H; gy++) {
      var row = new Array(W);
      for (var gx = 0; gx < W; gx++) row[gx] = '.';
      grid.push(row);
    }
    // 左右边界墙
    for (gy = 0; gy < H; gy++) { grid[gy][0] = '#'; grid[gy][1] = '#'; grid[gy][W - 1] = '#'; grid[gy][W - 2] = '#'; }
    for (gx = 2; gx < W - 2; gx++) {
      var fy = floorY[gx];
      if (fy < 0) continue;
      for (gy = fy; gy < H; gy++) grid[gy][gx] = '#';
    }

    // ------------------------------------------------------ 上层分支平台
    // §5.3 分支路径 1~2 条，其中至少 1 条通向隐藏支线宝物
    var branches = [];
    for (i = 0; i < branchSpots.length; i++) {
      var sp = branchSpots[i];
      var ph = rng.int(3, Math.min(4, MAX_STEP_HARD));  // 离地 3~4 格
      var py = sp.floor - ph;
      if (py < 4) continue;
      var px0 = sp.x0 + 1 + rng.int(0, 2);
      var pw = Math.max(4, Math.min(sp.w - 2, rng.int(5, 7)));
      for (gx = px0; gx < px0 + pw && gx < W - 2; gx++) grid[py][gx] = '#';
      branches.push({ x0: px0, w: pw, y: py, floor: sp.floor });
    }
    // §5.3 至少 1 条分支路径。随机分段可能一段都没抽中，这里兜底人造一条。
    if (branches.length === 0) {
      var bestRun = null;
      for (i = 0; i < flatRuns.length; i++) {
        var fr = flatRuns[i];
        if (fr.x0 < W * 0.35 || fr.x0 + fr.w > W - 10) continue;
        if (fr.w < 7) continue;
        if (!bestRun || fr.w > bestRun.w) bestRun = fr;
      }
      if (!bestRun) {
        for (i = 0; i < flatRuns.length; i++) {
          if (flatRuns[i].w >= 6 && flatRuns[i].x0 < W - 12) { bestRun = flatRuns[i]; break; }
        }
      }
      if (bestRun) {
        var fpy = bestRun.floor - 3;
        if (fpy >= 4) {
          var fx0 = bestRun.x0 + 1;
          var fw = Math.max(4, Math.min(bestRun.w - 2, 6));
          for (gx = fx0; gx < fx0 + fw && gx < W - 2; gx++) grid[fpy][gx] = '#';
          branches.push({ x0: fx0, w: fw, y: fpy, floor: bestRun.floor });
        }
      }
    }

    // 净空清理：主地表以上的实心瓦片之间必须留出至少 2 格净空（32 px）。
    // 主角碰撞盒 20 px 高，只剩 1 格（16 px）净空时整条走廊会被平台堵死。
    function cleanCorridors() {
      for (var cgx = 2; cgx < W - 2; cgx++) {
        var surf = floorY[cgx];
        if (surf < 0) continue;
        var lastSolid = surf;
        for (var cty = surf - 1; cty >= 0; cty--) {
          if (grid[cty][cgx] !== '#') continue;
          if (lastSolid - cty - 1 < 2) grid[cty][cgx] = '.';
          else lastSolid = cty;
        }
      }
    }

    // ------------------------------------------------------------ 机关
    var mechs = [];
    var mechKinds = th.mechs.slice();
    var groupTarget = diff.mechGroups[li - 1];
    var used = [];                     // 已占用的列区间
    function freeRun(minW, afterX, beforeX) {
      for (var k = 0; k < flatRuns.length; k++) {
        var r = flatRuns[k];
        if (r.w < minW) continue;
        if (r.x0 < afterX) continue;
        if (r.x0 + r.w > beforeX) continue;
        var clash = false;
        for (var u = 0; u < used.length; u++) {
          if (r.x0 < used[u].x1 + 3 && r.x0 + r.w > used[u].x0 - 3) { clash = true; break; }
        }
        if (clash) continue;
        return r;
      }
      return null;
    }

    var mechRunList = [];
    var MECH_NEED = {
      pressure_switch: 9, light_beam: 11, sequence_pads: 9,
      wind: 8, water_flow: 10, rune_puzzle: 9,
    };
    for (var m = 0; m < groupTarget; m++) {
      var kind = mechKinds[m % mechKinds.length];
      var needW = MECH_NEED[kind] || 9;
      var run = freeRun(needW, 18, W - 20);
      if (!run) run = freeRun(Math.max(6, needW - 3), 14, W - 14);
      if (!run) {
        // 兜底：在剩余区间里人工造一段平地，保证机关组数达标
        for (var ci = 0; ci < flatRuns.length; ci++) {
          var cand = flatRuns[ci];
          var clash2 = false;
          for (var u2 = 0; u2 < used.length; u2++) {
            if (cand.x0 < used[u2].x1 + 2 && cand.x0 + cand.w > used[u2].x0 - 2) { clash2 = true; break; }
          }
          if (clash2 || cand.x0 < 14 || cand.x0 + cand.w > W - 14) continue;
          if (cand.w >= 6) { run = cand; break; }
        }
      }
      if (!run) continue;
      used.push({ x0: run.x0, x1: run.x0 + run.w });
      mechRunList.push({ kind: kind, run: run });
    }

    var mechIds = { door: 0, plate: 0, stone: 0, pad: 0, mirror: 0, valve: 0, rune: 0, wind: 0 };
    function nid(t) { mechIds[t] = (mechIds[t] || 0) + 1; return t + '_' + pad2(mechIds[t]); }

    var doors = [];
    var windZones = [];
    var waterGates = [];
    var runeFrags = [];

    for (i = 0; i < mechRunList.length; i++) {
      var mr = mechRunList[i];
      var r2 = mr.run;
      var kind2 = mr.kind;
      var fy2 = r2.floor;

      if (kind2 === 'pressure_switch') {
        var doorId = nid('door');
        // 石门放在这段平地的最右侧，挡住前进
        var dx = r2.x0 + r2.w - 2;
        grid[fy2 - 1][dx] = '.'; // 门是实体对象，不是瓦片
        doors.push({ id: doorId, type: 'door', at: [dx, fy2 - 1], h: 3, open: false });
        var plateId = nid('plate');
        var pxx = r2.x0 + 2;
        mechs.push({ id: plateId, type: 'pressure_switch', at: [pxx, fy2 - 1], targets: [doorId] });
        var stoneId = nid('stone');
        mechs.push({
          id: stoneId, type: 'stone', at: [r2.x0 + 5, fy2 - 1], w: 12, h: 12,
          axis: 'x', min: r2.x0 + 1, max: r2.x0 + r2.w - 3,
        });
      } else if (kind2 === 'light_beam') {
        var doorId2 = nid('door');
        var dx2 = r2.x0 + r2.w - 2;
        doors.push({ id: doorId2, type: 'door', at: [dx2, fy2 - 1], h: 3, open: false });
        var ex = r2.x0 + 1, rx = r2.x0 + r2.w - 5;
        // 光束、反光块与玩家都站在同一层地面上：反光块必须能被玩家推着走。
        // 晶座放在上方 2 格，反光块把光束向上反射过去。
        var beamRow = fy2 - 1;
        var receiverRow = fy2 - 3;
        // 清出纵向光路，否则光会被上层平台挡住
        for (var vy2 = receiverRow; vy2 < beamRow; vy2++) {
          if (vy2 >= 0) grid[vy2][rx] = '.';
        }
        mechs.push({ id: nid('emitter'), type: 'emitter', at: [ex, beamRow], dir: 'right', target: doorId2 });
        mechs.push({ id: nid('receiver'), type: 'receiver', at: [rx, receiverRow], target: doorId2 });
        mechs.push({
          id: nid('mirror'), type: 'mirror', at: [r2.x0 + 4, beamRow], dir: 'right_up',
          axis: 'x', min: ex + 2, max: r2.x0 + r2.w - 6, want: rx,
        });
      } else if (kind2 === 'sequence_pads') {
        var doorId3 = nid('door');
        var dx3 = r2.x0 + r2.w - 2;
        doors.push({ id: doorId3, type: 'door', at: [dx3, fy2 - 1], h: 3, open: false });
        var order = [0, 1, 2];
        // 确定性打乱，保证每关顺序不同但可复现
        for (var oi = 2; oi > 0; oi--) {
          var oj = rng.int(0, oi);
          var tmp = order[oi]; order[oi] = order[oj]; order[oj] = tmp;
        }
        for (var pi = 0; pi < 3; pi++) {
          mechs.push({
            id: nid('pad'), type: 'sequence_pad', at: [r2.x0 + 2 + pi * 2, fy2 - 1],
            index: pi, order: order, door: doorId3,
          });
        }
      } else if (kind2 === 'wind') {
        // 风场：在坑上方铺一股上升气流，玩家借风跨越
        var wz = { id: nid('wind'), type: 'wind', at: [r2.x0 + r2.w - 6, fy2 - 7], w: 6, h: 8, fy: -420, fx: 0 };
        mechs.push(wz);
        windZones.push(wz);
      } else if (kind2 === 'water_flow') {
        var doorId4 = nid('door');
        doors.push({ id: doorId4, type: 'door', at: [r2.x0 + r2.w - 2, fy2 - 5], h: 3, open: false });
        // 阀门抬高水位，浮台随之抬升
        var platX = r2.x0 + 3;
        var high = fy2 - 6;
        for (var q2 = r2.x0 + 2; q2 < r2.x0 + r2.w - 3; q2++) grid[high][q2] = '#';
        mechs.push({ id: nid('valve'), type: 'water_valve', at: [r2.x0 + 1, fy2 - 1], target: doorId4 });
        mechs.push({
          id: nid('float'), type: 'float_platform', at: [platX, fy2 - 1], w: 3,
          lowY: fy2, highY: high + 1,
        });
      } else if (kind2 === 'rune_puzzle') {
        // 三块符文碎片散落在本段，终点符文台拼合后开门
        for (var ri = 0; ri < 3; ri++) {
          var fx = r2.x0 + 1 + ri * 3;
          runeFrags.push({ id: 'rune_' + li + '_' + ri, at: [fx, fy2 - 2] });
        }
        mechs.push({ id: nid('rune'), type: 'rune_altar', at: [r2.x0 + r2.w - 2, fy2 - 1], door: null });
      }
    }

    // 机关可能又加上了平台，再清一次净空，并剔除被清空的平台
    cleanCorridors();
    branches = branches.filter(function (br) {
      for (var q = br.x0; q < br.x0 + br.w; q++) {
        if (br.y >= 0 && grid[br.y][q] === '#') return true;
      }
      return false;
    });

    // ------------------------------------------------------------ 宝物
    // §5.3 拾遗宝物 2~3 件（表 4-2 每关 2 至 3 件，全局 60 件）
    var wantSide = [2, 2, 2, 3, 3][li - 1];
    var treasures = [];
    var content = (CT.DATA && CT.DATA.content) ? CT.DATA.content : null;
    var themeTreasures = content ? content.treasures.filter(function (t) { return t.theme === th.key; }) : [];
    var levelTreasures = themeTreasures.filter(function (t) { return t.level === levelId; });

    // 先在分支平台上放隐藏宝物（§5.3 至少 1 条分支通向隐藏支线宝物）
    var placed = 0;
    for (i = 0; i < branches.length && placed < wantSide; i++) {
      var br = branches[i];
      treasures.push({
        id: levelTreasures[placed] ? levelTreasures[placed].id : (levelId + '-t' + (placed + 1)),
        kind: 'side', at: [br.x0 + Math.floor(br.w / 2), br.y - 1], hidden: true,
      });
      placed++;
    }
    // 其余放在主路径高处或远处
    var candRuns = flatRuns.slice().reverse();
    for (i = 0; i < candRuns.length && placed < wantSide; i++) {
      var cr = candRuns[i];
      if (cr.type === 'end' || cr.x0 < 20) continue;
      treasures.push({
        id: levelTreasures[placed] ? levelTreasures[placed].id : (levelId + '-t' + (placed + 1)),
        kind: 'side', at: [cr.x0 + cr.w - 2, cr.floor - 2], hidden: false,
      });
      placed++;
    }
    // 保底：不足就补在起点后方
    while (placed < wantSide) {
      treasures.push({
        id: levelTreasures[placed] ? levelTreasures[placed].id : (levelId + '-t' + (placed + 1)),
        kind: 'side', at: [6 + placed * 3, baseY - 2], hidden: false,
      });
      placed++;
    }

    // 第 5 关：守护考验，通关获得本源彩晶；另有一枚守护印记藏在分支
    var finalDoor = null;
    if (li === 5) {
      var endFloor = floorY[W - 4] >= 0 ? floorY[W - 4] : baseY;
      treasures.push({ id: th.crystal, kind: 'main', at: [W - 5, endFloor - 3], hidden: false });
      var markBranch = branches[branches.length - 1];
      var markX = markBranch ? markBranch.x0 + markBranch.w - 1 : W - 12;
      var markY = markBranch ? markBranch.y - 1 : baseY - 2;
      treasures.push({ id: 'mark-' + th.key, kind: 'mark', at: [markX, markY], hidden: true });
    }
    for (i = 0; i < runeFrags.length; i++) {
      treasures.push({ id: runeFrags[i].id, kind: 'rune', at: runeFrags[i].at, hidden: false });
    }

    // ------------------------------------------------------------ 障碍物
    // 滚石：在地面来回滚动的实心石块。碰到扣一条命（见 game.js）。
    // 只放在没有机关的平地上，滚动范围留在这一段平台之内，不会滚进沟里。
    var hazards = [];
    var hzCount = Math.min(3, 1 + Math.floor(chapter / 2));   // 越靠后的章节越多
    var hzUsed = 0;
    for (var hi2 = 0; hi2 < flatRuns.length && hzUsed < hzCount; hi2++) {
      var hr = flatRuns[hi2];
      if (hr.w < 9) continue;
      if (hr.x0 < 16 || hr.x0 + hr.w > W - 16) continue;
      var clashH = false;
      for (var ui = 0; ui < used.length; ui++) {
        if (hr.x0 < used[ui].x1 + 2 && hr.x0 + hr.w > used[ui].x0 - 2) { clashH = true; break; }
      }
      if (clashH) continue;
      for (var cpi = 0; cpi < treasures.length; cpi++) {
        var tp = treasures[cpi].at;
        if (tp[0] >= hr.x0 && tp[0] < hr.x0 + hr.w) { clashH = true; break; }
      }
      if (clashH) continue;
      var rx0 = hr.x0 + 1;
      var rx1 = hr.x0 + hr.w - 2;
      var startX = rx0 + Math.floor((rx1 - rx0) / 2);
      hazards.push({
        id: 'boulder_' + (hzUsed + 1),
        type: 'boulder',
        at: [startX, hr.floor - 1],
        range: [rx0, rx1],
        speed: 34 + chapter * 3,           // 越往后越快，但始终慢于主角 90
        dir: (hzUsed % 2 === 0) ? 1 : -1,
      });
      used.push({ x0: rx0, x1: rx1 });
      hzUsed++;
    }
    // 保底：机关会占掉大部分平地，严格条件常常一个都放不下。
    // 每关至少要有一个滚石，否则这个机制在关内等于不存在。
    if (hzUsed === 0) {
      var bestRun = null;
      for (var bi2 = 0; bi2 < flatRuns.length; bi2++) {
        var br2 = flatRuns[bi2];
        if (br2.w < 7) continue;
        if (br2.x0 < 12 || br2.x0 + br2.w > W - 12) continue;
        if (!bestRun || br2.w > bestRun.w) bestRun = br2;
      }
      if (bestRun) {
        var cxr = bestRun.x0 + Math.floor(bestRun.w / 2);
        var half2 = Math.max(2, Math.min(4, Math.floor(bestRun.w / 2) - 1));
        var lo2 = Math.max(bestRun.x0 + 1, cxr - half2);
        var hi2b = Math.min(bestRun.x0 + bestRun.w - 2, cxr + half2);
        hazards.push({
          id: 'boulder_1',
          type: 'boulder',
          at: [cxr, bestRun.floor - 1],
          range: [lo2, hi2b],
          speed: 30 + chapter * 3,
          dir: 1,
        });
        hzUsed = 1;
      }
    }

    // ------------------------------------------------------------ 存档点
    // §5.3 存档石碑 1 个，置于关卡中段安全区
    var midX = Math.floor(W / 2);
    var cpFloor = -1, cpX = midX;
    for (i = 0; i < 40; i++) {
      var tx2 = midX + Math.floor((i % 2 === 0 ? 1 : -1) * Math.ceil(i / 2));
      if (tx2 > 4 && tx2 < W - 5 && floorY[tx2] > 0) { cpFloor = floorY[tx2]; cpX = tx2; break; }
    }
    if (cpFloor < 0) { cpFloor = baseY; cpX = midX; }
    var checkpoint = { at: [cpX, cpFloor - 1], respawn: [cpX - 1, cpFloor - 2] };

    // ------------------------------------------------------------ NPC
    var npcs = [
      { id: th.key + '_npc_start', kind: th.npcs[0], at: [5, baseY - 1], facing: 1, slot: 0 },
      { id: th.key + '_npc_guide', kind: th.npcs[1], at: [W - 8, floorY[W - 6] > 0 ? floorY[W - 6] - 1 : baseY - 1], facing: -1, slot: 1 },
    ];

    // ------------------------------------------------------------ 出口
    var exitFloor = floorY[W - 4] >= 0 ? floorY[W - 4] : baseY;
    var exit = { at: [W - 4, exitFloor - 1], locked: li === 5 };

    // ------------------------------------------------------------ 装饰
    // §5.4 每屏不少于 8 个装饰；同类装饰不得连续重复 3 次；每类 2~3 变体
    var decor = [];
    var setCount = CT.Sprites.propSetCount(th.key);
    var lastSet = -1, runLen = 0;
    var rr = new CT.Rng(CT.seedOf('decor:' + levelId));
    function pushDecor(dx, dy, mode) {
      var set = rr.int(0, setCount - 1);
      if (set === lastSet) {
        runLen++;
        if (runLen >= 2) { set = (set + 1 + rr.int(0, setCount - 2)) % setCount; runLen = 0; }
      } else { runLen = 0; }
      lastSet = set;
      decor.push({ x: dx, y: dy, set: set, v: rr.int(0, 2), mode: mode });
    }
    for (gx = 2; gx < W - 2; gx++) {
      for (gy = 1; gy < H; gy++) {
        if (grid[gy][gx] !== '#') continue;
        var above = gy > 0 && grid[gy - 1][gx] === '.';
        var below = gy + 1 < H && grid[gy + 1][gx] === '.';
        if (above) {
          // 地表装饰
          // 密度从 0.56 降到 0.34：装饰变大了，再撒原来那么多就杂乱
          // 密度再降 20%：0.34 -> 0.27
          if (rr.f() < 0.27) pushDecor(gx, gy, 'top');
        } else if (below) {
          // 悬挂装饰（洞顶垂藤）
          if (rr.f() < 0.10) pushDecor(gx, gy, 'hang');
        }
        break;   // 每列只取最上一层
      }
    }
    // 保证总数下限（§5.3 不少于 40 个）
    var guard = 0;
    while (decor.length < 46 && guard < 4000) {
      guard++;
      gx = rr.int(3, W - 4);
      var gyy = floorY[gx];
      if (gyy < 0) continue;
      pushDecor(gx, gyy, 'top');
    }

    // 密度修复：§5.4 要求每屏可见范围内至少有 8 个装饰。均匀概率撒点无法保证
    // 每个 30 格窗口都达标（沟槽与边缘处会掉下来），因此在达标前做一轮补齐。
    // 目标从 11 降到 9：规格书要求每屏 >= 8，9 留 1 个余量且明显不挤
    // 目标从 9 降到 7（相对 9 约 -22%）
    var TARGET_PER_SCREEN = 7;
    for (var wx = 0; wx <= W - 30; wx += 1) {
      var cnt = 0, d2;
      for (d2 = 0; d2 < decor.length; d2++) {
        if (decor[d2].x >= wx && decor[d2].x < wx + 30) cnt++;
      }
      if (cnt >= TARGET_PER_SCREEN) continue;
      for (gx = wx; gx < wx + 30 && cnt < TARGET_PER_SCREEN; gx++) {
        if (gx < 2 || gx >= W - 2) continue;
        var fy3 = floorY[gx];
        if (fy3 < 0 || fy3 >= H) continue;
        var dup = false;
        for (d2 = 0; d2 < decor.length; d2++) if (decor[d2].x === gx) { dup = true; break; }
        if (dup) continue;
        pushDecor(gx, fy3, 'top');
        cnt++;
      }
    }
    // 修复后再按 x 排序，保持绘制顺序与裁剪二分可用
    decor.sort(function (a, b) { return a.x - b.x; });
    // 排序会把原本不相邻的同款装饰凑到一起，因此必须在这一步之后
    // 重新保证「同一装饰不得连续重复 3 次」（§5.4）—— 否则补密度那一步
    // 会把不变量破坏掉。
    for (var di3 = 2; di3 < decor.length; di3++) {
      if (decor[di3].set === decor[di3 - 1].set && decor[di3].set === decor[di3 - 2].set) {
        decor[di3].set = (decor[di3].set + 1) % setCount;
      }
    }

    // ------------------------------------------------------------ 汇总
    var rows = [];
    for (gy = 0; gy < H; gy++) rows.push(grid[gy].join(''));

    var json = {
      level_id: levelId,
      theme: th.key,
      name: info.name,
      size: { w: W, h: H },
      layers: { ground: rows },
      spawn: [4, baseY - 2],
      mechanisms: mechs.concat(doors),
      hazards: hazards,
      decor: decor,
      treasures: treasures,
      npcs: npcs,
      checkpoint: checkpoint,
      exit: exit,
      // 生成期元数据，供校验器与调试使用
      meta: {
        maxGap: maxGap, maxStepUp: maxStepUp,
        branches: branches.length,
        dropDone: dropDone,
        mechGroups: mechRunList.length,
        mechKinds: mechRunList.map(function (r) { return r.kind; }),
        hazards: hazards.length,
        layout: layout,
        jumpHeightTiles: +JUMP_H.toFixed(2),
        jumpDistTiles: +JUMP_DIST.toFixed(2),
      },
    };
    return json;
  }

  // ---------------------------------------------------------------- 校验
  // 逐条核对 §5.3 指标与 §5.4 装饰密度，构建期与验收期都跑
  function validate(json, opts) {
    opts = opts || {};
    var errs = [];
    var W = json.size.w, H = json.size.h;
    var rows = json.layers.ground;

    // 宽度按后续需求整体 +40%，因此这里放宽到 160~260（原 §5.3 为 120~180）
    if (W < 160 || W > 260) errs.push('width ' + W + ' not in 160..260');
    if (H < 24 || H > 40) errs.push('height ' + H + ' not in 24..40');

    // 垂直落差 >= 6 格
    // 主地表 = 从底部往上连续实心的最高点。注意不能用「从上往下第一个 #」，
    // 那样会把上层分支平台误当成地表，从而算出并不存在的巨大台阶。
    var surface = [];
    for (var x = 2; x < W - 2; x++) {
      var fy = -1;
      for (var y = H - 1; y >= 0; y--) {
        if (rows[y].charAt(x) === '#') fy = y; else break;
      }
      surface.push(fy);
    }
    var maxDrop = 0;
    for (var i = 1; i < surface.length; i++) {
      if (surface[i - 1] < 0 || surface[i] < 0) continue;
      var d = surface[i] - surface[i - 1];
      if (d > maxDrop) maxDrop = d;
    }
    if (maxDrop < 6) errs.push('no vertical drop >= 6 tiles (max ' + maxDrop + ')');
    // 落差封顶：任何相邻列的地表高差都不应超过 6 格
    if (maxDrop > 6) errs.push('vertical drop ' + maxDrop + ' exceeds cap 6');

    // 沟宽与台阶高度不超过物理上限
    var gx = 0, curFloor = -1;
    var maxGapSeen = 0, maxStepSeen = 0;
    while (gx < surface.length) {
      if (surface[gx] < 0) {
        var s0 = gx;
        while (gx < surface.length && surface[gx] < 0) gx++;
        var gw = gx - s0;
        if (gw > maxGapSeen) maxGapSeen = gw;
        continue;
      }
      if (curFloor >= 0) {
        var st = curFloor - surface[gx];
        if (st > maxStepSeen) maxStepSeen = st;
      }
      curFloor = surface[gx];
      gx++;
    }
    if (maxGapSeen > MAX_GAP_HARD) errs.push('gap ' + maxGapSeen + ' exceeds jump distance (' + MAX_GAP_HARD + ')');
    if (maxStepSeen > MAX_STEP_HARD) errs.push('step up ' + maxStepSeen + ' exceeds jump height (' + MAX_STEP_HARD + ')');

    // 机关 3~6 组，同时生效种类 <= 3
    var groups = (json.meta && json.meta.mechGroups) || 0;
    if (groups < 3 || groups > 6) errs.push('mechanism groups ' + groups + ' not in 3..6');
    var kinds = {};
    for (var m of json.mechanisms) {
      if (m.type === 'stone' || m.type === 'door' || m.type === 'mirror' ||
          m.type === 'emitter' || m.type === 'receiver' || m.type === 'float_platform') continue;
      kinds[m.type] = 1;
    }
    var kindCount = Object.keys(kinds).length;
    if (kindCount > 3) errs.push('simultaneous mechanism kinds ' + kindCount + ' > 3');

    // 宝物 2~3 件（side）
    var side = json.treasures.filter(function (t) { return t.kind === 'side'; }).length;
    if (side < 2 || side > 3) errs.push('side treasures ' + side + ' not in 2..3');

    // 装饰 >= 40，且每屏 >= 8
    if (json.decor.length < 40) errs.push('decor ' + json.decor.length + ' < 40');
    var worst = Infinity, worstAt = 0;
    for (var cx = 0; cx <= W * 16 - 480; cx += 16) {
      var n = 0;
      var x0 = cx / 16, x1 = (cx + 480) / 16;
      for (var di = 0; di < json.decor.length; di++) {
        var dd = json.decor[di];
        if (dd.x >= x0 && dd.x < x1) n++;
      }
      if (n < worst) { worst = n; worstAt = Math.round(x0); }
    }
    // 装饰密度按后续需求下调约 20%，每屏下限从 8 降到 7
    if (worst < 7) errs.push('per-screen decor minimum ' + worst + ' < 7 (at tile x=' + worstAt + ')');

    // 连续重复装饰不超过 2 次同类
    var runS = 0, prevS = -1;
    for (var k = 0; k < json.decor.length; k++) {
      var s = json.decor[k].set;
      if (s === prevS) { runS++; if (runS >= 3) { errs.push('decor set ' + s + ' repeats ' + (runS + 1) + ' times in a row'); break; } }
      else { runS = 0; prevS = s; }
    }

    // 障碍物：每关至少 1 个滚石，否则生命值机制形同虚设
    var hzN = (json.hazards || []).length;
    if (hzN < 1) errs.push('no hazard (boulder) generated');

    // 存档碑 1 个
    if (!json.checkpoint) errs.push('missing checkpoint');

    // 出口
    if (!json.exit) errs.push('missing exit');

    // 分支至少 1 条且通到隐藏宝物
    var branches = (json.meta && json.meta.branches) || 0;
    if (branches < 1) errs.push('no branch path');
    var hidden = json.treasures.filter(function (t) { return t.hidden; }).length;
    if (hidden < 1) errs.push('no hidden treasure on a branch');

    return { ok: errs.length === 0, errors: errs, stats: {
      W: W, H: H, maxDrop: maxDrop, maxGap: maxGapSeen, maxStepUp: maxStepSeen,
      mechGroups: groups, mechKinds: kindCount, sideTreasures: side,
      decor: json.decor.length, minDecorPerScreen: worst, hazards: hzN,
      branches: branches, hiddenTreasures: hidden,
    } };
  }

  CT.LevelGen = { generate: generate, validate: validate, MAX_GAP_HARD: MAX_GAP_HARD, MAX_STEP_HARD: MAX_STEP_HARD };
})();

</script>
  <script>
/* ==== src/world/level.js ==== */
/* 晶途拾光 — 关卡运行时
 * --------------------------------------------------------------------------
 * §9.4 关卡不写在代码里，全部以 JSON 描述，由引擎在运行时加载。
 *
 * §4.1 碰撞层必须物理分离：
 *   地面层 参与碰撞
 *   机关层 参与触发
 *   宝物层 只做拾取判定
 *   背景装饰层 完全不参与任何判定
 * 因此装饰物只存在于 decor 数组里，绘制时使用，碰撞查询一律看不到它们。
 *
 * 瓦片字符：
 *   .  空      #  实心地面    =  单向平台    /  斜坡(左低右高)   \  斜坡(左高右低)
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});

  var TS = 16;                       // §4.1 瓦片尺寸 16 × 16
  var C_EMPTY = 0, C_SOLID = 1, C_PLATFORM = 2, C_SLOPE_R = 3, C_SLOPE_L = 4;
  var CHAR_TO_CODE = { '.': C_EMPTY, '#': C_SOLID, '=': C_PLATFORM, '/': C_SLOPE_R, '\\': C_SLOPE_L };

  function Level(json) {
    this.json = json;
    this.id = json.level_id;
    this.theme = json.theme;
    this.name = json.name || '';
    this.tw = json.size.w;
    this.th = json.size.h;
    this.pxW = this.tw * TS;
    this.pxH = this.th * TS;
    this.TS = TS;

    var rows = (json.layers && json.layers.ground) || [];
    this.tiles = new Uint8Array(this.tw * this.th);
    for (var y = 0; y < this.th; y++) {
      var row = rows[y] || '';
      for (var x = 0; x < this.tw; x++) {
        var ch = row.charAt(x);
        var code = CHAR_TO_CODE[ch];
        this.tiles[y * this.tw + x] = code === undefined ? C_EMPTY : code;
      }
    }

    this.decor = json.decor || [];
    this.mechanisms = json.mechanisms || [];
    this.treasures = json.treasures || [];
    this.hazards = json.hazards || [];
    this.npcs = json.npcs || [];
    this.checkpoint = json.checkpoint || null;
    this.exit = json.exit || null;
    this.spawn = json.spawn || [2, 4];

    // 装饰物按 x 排序，绘制时可按镜头区间裁剪
    this.decor.sort(function (a, b) { return a.x - b.x; });

    // 每一列的「主地表」行号：从底部往上连续实心的最高点。
    // 渲染层用它算出每块瓦片埋在土里有多深，从而决定画草皮 / 土层 / 深层岩体。
    // 注意不能取「从上往下第一个实心」，否则会把上层分支平台误判成地表。
    this.surfaceY = new Int16Array(this.tw);
    for (var cx = 0; cx < this.tw; cx++) {
      var top = -1;
      for (var cy = this.th - 1; cy >= 0; cy--) {
        if (this.tiles[cy * this.tw + cx] === C_SOLID) top = cy; else break;
      }
      this.surfaceY[cx] = top;
    }
  }

  // 埋深：0 = 地表，1~2 = 土层，>=3 = 深层岩体
  Level.prototype.depthClass = function (tx, ty) {
    var s = this.surfaceY[tx];
    if (s < 0) return 2;
    var d = ty - s;
    if (d <= 0) return 0;
    if (d <= 2) return 1;
    return 2;
  };

  Level.prototype.codeAt = function (tx, ty) {
    if (tx < 0 || tx >= this.tw) return C_SOLID;      // 左右边界视为实心墙
    if (ty < 0) return C_EMPTY;
    // 下边界必须是空的。原先这里返回实心，本意是防无限下坠，结果坑里没有底，
    // 主角会稳稳落在关卡最低一行上，永远到不了「掉出边界」的判定，
    // 于是卡死在坑底不复活。现在让他真的掉出去，由 y > pxH 触发扣命。
    if (ty >= this.th) return C_EMPTY;
    return this.tiles[ty * this.tw + tx];
  };

  // 机关（门）会改写瓦片，这样玩家碰撞仍然只走 rectSolid 一条路径
  Level.prototype.setTile = function (tx, ty, code) {
    if (tx < 0 || tx >= this.tw || ty < 0 || ty >= this.th) return;
    this.tiles[ty * this.tw + tx] = code;
  };

  // 标记某个格是门体，渲染层据此跳过地形瓦片、改画门
  Level.prototype.setDoorTile = function (tx, ty, on) {
    if (!this.doorMask) this.doorMask = new Uint8Array(this.tw * this.th);
    if (tx < 0 || tx >= this.tw || ty < 0 || ty >= this.th) return;
    this.doorMask[ty * this.tw + tx] = on ? 1 : 0;
  };

  Level.prototype.isDoorTile = function (tx, ty) {
    if (!this.doorMask) return 0;
    if (tx < 0 || tx >= this.tw || ty < 0 || ty >= this.th) return 0;
    return this.doorMask[ty * this.tw + tx];
  };

  Level.prototype.isSolid = function (tx, ty) {
    var c = this.codeAt(tx, ty);
    return c === C_SOLID || c === C_SLOPE_R || c === C_SLOPE_L;
  };
  Level.prototype.isPlatform = function (tx, ty) { return this.codeAt(tx, ty) === C_PLATFORM; };

  // 供瓦片美术用的 8 邻接掩码（§7.3 自动拼接）
  Level.prototype.neighbourMask = function (tx, ty) {
    var M = CT.Tiles.MASK, m = 0;
    if (this.isSolid(tx, ty - 1)) m |= M.UP;
    if (this.isSolid(tx, ty + 1)) m |= M.DOWN;
    if (this.isSolid(tx - 1, ty)) m |= M.LEFT;
    if (this.isSolid(tx + 1, ty)) m |= M.RIGHT;
    if (this.isSolid(tx - 1, ty - 1)) m |= M.UL;
    if (this.isSolid(tx + 1, ty - 1)) m |= M.UR;
    if (this.isSolid(tx - 1, ty + 1)) m |= M.DL;
    if (this.isSolid(tx + 1, ty + 1)) m |= M.DR;
    return m;
  };

  // 斜坡表面（瓦片内局部高度，返回该列可站立的 y 像素，越小越高）
  Level.prototype.slopeSurface = function (tx, ty, localX) {
    var c = this.codeAt(tx, ty);
    if (c === C_SLOPE_R) return (ty + 1) * TS - (localX + 1);       // 左低右高
    if (c === C_SLOPE_L) return ty * TS + localX + 1;               // 左高右低
    return null;
  };

  // 像素级实心查询（用于碰撞）
  Level.prototype.solidAtPx = function (px, py) {
    var tx = Math.floor(px / TS), ty = Math.floor(py / TS);
    return this.isSolid(tx, ty);
  };

  // 矩形与地面层是否相交
  Level.prototype.rectSolid = function (x, y, w, h) {
    var x0 = Math.floor(x / TS), x1 = Math.floor((x + w - 1) / TS);
    var y0 = Math.floor(y / TS), y1 = Math.floor((y + h - 1) / TS);
    for (var ty = y0; ty <= y1; ty++) {
      for (var tx = x0; tx <= x1; tx++) {
        if (this.isSolid(tx, ty)) return true;
      }
    }
    return false;
  };

  // 是否踩在单向平台上（平台只在自上方下落时生效）
  Level.prototype.platformBelow = function (x, y, w, h, prevBottom) {
    var y1 = Math.floor((y + h - 1) / TS);
    var x0 = Math.floor(x / TS), x1 = Math.floor((x + w - 1) / TS);
    for (var tx = x0; tx <= x1; tx++) {
      if (!this.isPlatform(tx, y1)) continue;
      var top = y1 * TS;
      // 上一帧脚底必须在平台面之上，才能落上去
      if (prevBottom <= top + 1 && (y + h) >= top) return top;
    }
    return -1;
  };

  // 收集可见瓦片，供渲染层裁剪
  Level.prototype.visibleTileRange = function (camX, camY, vw, vh) {
    return {
      x0: Math.max(0, Math.floor(camX / TS) - 1),
      x1: Math.min(this.tw - 1, Math.floor((camX + vw) / TS) + 1),
      y0: Math.max(0, Math.floor(camY / TS) - 1),
      y1: Math.min(this.th - 1, Math.floor((camY + vh) / TS) + 1),
    };
  };

  // §5.4 装饰密度校验：给定镜头左边界，统计该屏内装饰数
  Level.prototype.decorInScreen = function (camX, vw) {
    var x0 = camX / TS, x1 = (camX + vw) / TS;
    var n = 0;
    for (var i = 0; i < this.decor.length; i++) {
      var d = this.decor[i];
      if (d.x >= x0 && d.x < x1) n++;
    }
    return n;
  };

  CT.Level = Level;
  CT.TS = TS;
  CT.TILE = { EMPTY: C_EMPTY, SOLID: C_SOLID, PLATFORM: C_PLATFORM, SLOPE_R: C_SLOPE_R, SLOPE_L: C_SLOPE_L };
  CT.CHAR_TO_CODE = CHAR_TO_CODE;
})();

</script>
  <script>
/* ==== src/game/player.js ==== */
/* 晶途拾光 — 主角物理
 * --------------------------------------------------------------------------
 * §4.1 移动与物理（数值逐条照抄，单位 像素/秒、像素/秒²，基准瓦片 16 px）
 *   水平移动速度        90
 *   加速度 / 减速度     12 / 14（倍率）
 *   跳跃初速度          -260（向上）
 *   重力加速度          640
 *   可变跳跃高度        松键即减速
 *   土狼时间            100 毫秒
 *   跳跃缓冲            120 毫秒
 *   下落穿层            按住下键
 * §3.1 碰撞盒 10 × 20 像素，居中偏下，左右各留 3 像素余量。
 *
 * 手感要点：物理用固定步长积分（main.js 保证 1/60 步长），碰撞用子步推进
 * 避免高速穿模；所有热路径上的量都是预分配的标量，不产生任何临时对象。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});
  var TS = 16;

  var SPEED = 90;
  var ACCEL_MULT = 12;
  var DECEL_MULT = 14;
  var ACCEL = SPEED * ACCEL_MULT;        // 1080 px/s²
  var DECEL = SPEED * DECEL_MULT;        // 1260 px/s²
  var JUMP_V = -260;
  var GRAVITY = 640;
  var COYOTE = 0.100;                    // §4.1 土狼时间 100 ms
  var JUMP_BUFFER = 0.120;               // §4.1 跳跃缓冲 120 ms
  var MAX_FALL = 620;
  var BOX_W = 10, BOX_H = 20;            // §3.1 碰撞盒
  var SPRITE_W = 16, SPRITE_H = 24;

  function Player() {
    this.w = BOX_W;
    this.h = BOX_H;
    this.x = 0; this.y = 0;
    this.vx = 0; this.vy = 0;
    this.facing = 1;
    this.onGround = false;
    this.coyote = 0;
    this.buffer = 0;
    this.jumpHeldLast = false;
    this.anim = 'idle';
    this.animTime = 0;
    this.animFrame = 0;
    this.pickupTimer = 0;
    this.talkTimer = 0;
    this.dropThrough = 0;         // 穿层冷却，避免一按就掉
    this.riding = null;           // 站着的浮台
    this.externalVX = 0;
    this.externalVY = 0;
    this.spawnX = 0; this.spawnY = 0;
  }

  Player.prototype.reset = function (px, py) {
    this.x = px; this.y = py;
    this.vx = 0; this.vy = 0;
    this.onGround = false;
    this.coyote = 0; this.buffer = 0;
    this.anim = 'idle'; this.animTime = 0; this.animFrame = 0;
    this.pickupTimer = 0; this.talkTimer = 0;
    this.riding = null;
  };

  Player.prototype.centreX = function () { return this.x + this.w / 2; };
  Player.prototype.bottom = function () { return this.y + this.h; };

  // 子步像素推进：单次位移不超过 2 像素，彻底避免穿透
  var MAX_STEP = 2;

  Player.prototype.step = function (dt, level, input, mechWorld) {
    // 记录「上一帧是不是已经踩在地上」。
    // 站着不动时重力每帧都会把身体往下压 0.2 像素、随即被碰撞弹回，
    // 于是 moveY 每帧都认为「刚落地」——落地扬尘和落地音效会在脚边
    // 连喷成一片，看起来就像一直在跺脚。
    var wasGrounded = this.onGround;
    // ---------------------------------------------------------- 水平速度
    var axis = input.axis;
    var target = axis * SPEED;
    var rate;
    if (axis !== 0) {
      rate = ACCEL;
      // 反向输入时用减速度，转手更利落
      if (this.vx !== 0 && (this.vx > 0) !== (axis > 0)) rate = DECEL;
    } else {
      rate = DECEL;
    }
    if (this.vx < target) this.vx = Math.min(target, this.vx + rate * dt);
    else if (this.vx > target) this.vx = Math.max(target, this.vx - rate * dt);

    if (axis !== 0) this.facing = axis > 0 ? 1 : -1;

    // ---------------------------------------------------------- 计时器
    this.coyote = this.onGround ? COYOTE : Math.max(0, this.coyote - dt);
    this.dropThrough = Math.max(0, this.dropThrough - dt);
    if (input.jumpPressed) this.buffer = JUMP_BUFFER;
    else this.buffer = Math.max(0, this.buffer - dt);

    // ---------------------------------------------------------- 跳跃
    var wantJump = this.buffer > 0 && this.coyote > 0;
    var wantDrop = input.down && this.onGround && this.dropThrough <= 0;
    if (wantDrop) {
      // §4.1 下落穿层：按住下键穿过单向平台
      this.dropThrough = 0.18;
      this.onGround = false;
      this.coyote = 0;
      this.y += 1;
    } else if (wantJump) {
      this.vy = JUMP_V;
      this.onGround = false;
      this.coyote = 0;
      this.buffer = 0;
      if (mechWorld) mechWorld.onPlayerJump(this);
    }
    // 可变跳跃高度：松键即减速（§4.1）
    if (!input.jumpHeld && this.vy < 0 && this.jumpHeldLast) {
      this.vy *= 0.42;
    }
    this.jumpHeldLast = input.jumpHeld;

    // ---------------------------------------------------------- 重力
    this.vy += GRAVITY * dt;
    if (this.vy > MAX_FALL) this.vy = MAX_FALL;

    // 外力（风场、水流浮力）
    var evx = this.externalVX, evy = this.externalVY;
    this.externalVX = 0; this.externalVY = 0;

    var totalVX = this.vx + evx;
    var totalVY = this.vy + evy;

    // ---------------------------------------------------------- 推进
    var wasBottom = this.bottom();
    this.moveX(totalVX * dt, level);
    var landedY = this.moveY(totalVY * dt, level, wasBottom);

    // ---------------------------------------------------------- 斜坡贴合
    this.snapSlope(level);
    // ---------------------------------------------------------- 防卡死保险
    this.deEmbed(level);

    // 只有「腾空 -> 落地」这一下才算落地；一直站着不算
    return (!wasGrounded && this.onGround) ? 1 : 0;
  };

  Player.prototype.moveX = function (dx, level) {
    if (dx === 0) return;
    var remaining = dx;
    var sign = dx > 0 ? 1 : -1;
    while (remaining !== 0) {
      var step = Math.abs(remaining) > MAX_STEP ? MAX_STEP * sign : remaining;
      remaining -= step;
      this.x += step;
      if (level.rectSolid(this.x, this.y + 0.5, this.w, this.h - 1)) {
        // 退回并贴墙
        this.x -= step;
        this.vx = 0;
        // 沿斜坡向上滑（贴墙时允许爬坡 1 像素）
        if (!this.tryStepUp(level, sign)) break;
      }
    }
  };

  // 遇到 1~2 像素高的坎时自动抬升，避免贴墙卡住。
  // 只允许抬 1~2 像素 —— 抬得动的是小台阶，抬不动的是墙，不能靠它「爬」上台沿。
  Player.prototype.tryStepUp = function (level, sign) {
    var probeX = this.x + (sign > 0 ? this.w - 1 : 0) + sign;
    var feetY = this.bottom() - 1;
    for (var up = 1; up <= 2; up++) {
      // 抬起后落脚点必须是空的，且整条身体也不能插进地形
      if (!level.rectSolid(probeX, feetY - up, 1, 1) &&
          !level.rectSolid(this.x + sign, this.y - up, this.w, this.h)) {
        this.y -= up;
        this.x += sign;
        return true;
      }
    }
    return false;
  };

  Player.prototype.moveY = function (dy, level, prevBottom) {
    if (dy === 0) { this.onGround = this.detectGround(level, prevBottom); return 0; }
    var remaining = dy;
    var sign = dy > 0 ? 1 : -1;
    var landed = 0;
    while (remaining !== 0) {
      var step = Math.abs(remaining) > MAX_STEP ? MAX_STEP * sign : remaining;
      remaining -= step;
      this.y += step;
      if (sign > 0) {
        // 下落：先看实心地面
        if (level.rectSolid(this.x, this.y + 0.5, this.w, this.h - 0.5)) {
          var snapped = this.snapToGround(level);
          if (snapped !== null) { this.y = snapped; }
          else { this.y -= step; }
          this.vy = 0;
          this.onGround = true;
          landed = 1;
          break;
        }
        // 再看单向平台
        if (this.dropThrough <= 0) {
          var top = level.platformBelow(this.x, this.y, this.w, this.h, prevBottom);
          if (top >= 0) {
            this.y = top - this.h;
            this.vy = 0;
            this.onGround = true;
            landed = 1;
            break;
          }
        }
      } else {
        if (level.rectSolid(this.x, this.y, this.w, this.h)) {
          this.y -= step;
          this.vy = 0;
          break;
        }
      }
    }
    if (!landed) this.onGround = this.detectGround(level, prevBottom);
    return landed;
  };

  // 落地时精确贴到瓦片顶面。
  // 注意必须用「整个碰撞盒」判断，不能只探一行像素 —— 只探一行会让玩家卡在
  // 平台侧面时被判定为「已经站好」，从而永久卡死。
  Player.prototype.snapToGround = function (level) {
    for (var up = 1; up <= 20; up++) {
      if (!level.rectSolid(this.x, this.y - up, this.w, this.h)) {
        return this.y - up;
      }
    }
    return null;
  };

  // 防卡死：一帧结束后如果碰撞盒仍与地形重叠，沿最小位移方向推出去。
  // 优先向上（正常情况下玩家落在平台顶面），向上不行再左右推。
  Player.prototype.deEmbed = function (level) {
    if (!level.rectSolid(this.x, this.y, this.w, this.h)) return;
    var up;
    for (up = 1; up <= 24; up++) {
      if (!level.rectSolid(this.x, this.y - up, this.w, this.h)) {
        this.y -= up;
        if (this.vy > 0) this.vy = 0;
        this.onGround = true;
        return;
      }
    }
    for (var s = 1; s <= 24; s++) {
      if (!level.rectSolid(this.x - s, this.y, this.w, this.h)) {
        this.x -= s;
        this.vx = 0;
        return;
      }
      if (!level.rectSolid(this.x + s, this.y, this.w, this.h)) {
        this.x += s;
        this.vx = 0;
        return;
      }
    }
  };

  Player.prototype.detectGround = function (level, prevBottom) {
    if (level.rectSolid(this.x, this.bottom() + 0.5, this.w, 1)) return true;
    if (this.dropThrough <= 0) {
      var top = level.platformBelow(this.x, this.bottom() - 0.5, this.w, 1,
        prevBottom === undefined ? this.bottom() : prevBottom);
      if (top >= 0 && Math.abs(top - this.bottom()) <= 1.5) return true;
    }
    return false;
  };

  // 45° 斜坡贴合：取碰撞盒左右中三点中最低的可行表面
  Player.prototype.snapSlope = function (level) {
    var feet = this.bottom();
    var best = null;
    var xs = [this.x + 1, this.x + this.w / 2, this.x + this.w - 1];
    for (var i = 0; i < xs.length; i++) {
      var tx = Math.floor(xs[i] / TS);
      var ty = Math.floor((feet - 1) / TS);
      var surf = level.slopeSurface(tx, ty, xs[i] - tx * TS);
      if (surf === null) continue;
      if (surf >= feet - 12 && surf <= feet + 2) {
        if (best === null || surf > best) best = surf;
      }
    }
    if (best !== null) {
      this.y = best - this.h;
      if (this.vy > 0) this.vy = 0;
      this.onGround = true;
    }
  };

  // ------------------------------------------------------------- 动画
  // §3.2 6 组动作，8 至 12 帧每秒，逐帧硬切
  var FPS = { idle: 8, walk: 10, jump: 12, pickup: 10, talk: 8, celebrate: 12 };

  Player.prototype.updateAnim = function (dt, forceTalk, forcedAnim) {
    var want;
    if (forcedAnim) want = forcedAnim;
    else if (this.pickupTimer > 0) want = 'pickup';
    else if (forceTalk) want = 'talk';
    else if (!this.onGround) want = 'jump';
    else if (Math.abs(this.vx) > 4) want = 'walk';
    else want = 'idle';

    if (want !== this.anim) {
      this.anim = want;
      this.animTime = 0;
      this.animFrame = 0;
    } else {
      this.animTime += dt;
      var fps = FPS[want] || 10;
      var frames = CT.Sprites.ANIM[want].frames.length;
      var f = Math.floor(this.animTime * fps);
      if (want === 'pickup' || want === 'celebrate') {
        this.animFrame = Math.min(frames - 1, f);   // 一次性动作不循环
      } else if (want === 'jump') {
        // 上升 2 帧、下落 1 帧、落地缓冲 1 帧（§3.2）
        if (this.onGround) this.animFrame = 0;
        else if (this.vy < 0) this.animFrame = f % 2 === 0 ? 1 : 2;
        else this.animFrame = 3;
      } else if (want === 'idle') {
        // 静止时几乎完全不动：保持同一帧，每 3 秒眨一下眼。
        // 原先 idle 以 8fps 在 4 帧间循环（呼吸 + 眨眼），站着不动时
        // 整个身体一直在动，观感很吵。这里改成「不动 + 偶尔眨眼」。
        var cyc = this.animTime % 3.0;
        this.animFrame = (cyc > 2.82 && cyc < 2.96) ? 3 : 0;
      } else {
        this.animFrame = f % frames;
      }
    }
    if (this.pickupTimer > 0) this.pickupTimer -= dt;
    if (this.talkTimer > 0) this.talkTimer -= dt;
  };

  // 精灵绘制左上角（碰撞盒居中偏下，§3.1）
  Player.prototype.spriteX = function () { return Math.round(this.x - (SPRITE_W - BOX_W) / 2); };
  Player.prototype.spriteY = function () { return Math.round(this.y - (SPRITE_H - 1 - BOX_H)); };

  Player.SPEED = SPEED;
  Player.JUMP_V = JUMP_V;
  Player.GRAVITY = GRAVITY;
  Player.BOX_W = BOX_W;
  Player.BOX_H = BOX_H;
  Player.SPRITE_W = SPRITE_W;
  Player.SPRITE_H = SPRITE_H;
  Player.COYOTE = COYOTE;
  Player.JUMP_BUFFER = JUMP_BUFFER;

  CT.Player = Player;
})();

</script>
  <script>
/* ==== src/game/camera.js ==== */
/* 晶途拾光 — 镜头
 * --------------------------------------------------------------------------
 * §4.6 交互与镜头
 *   镜头跟随使用 0.12 的插值系数，画面在关卡边界处硬限制；
 *   玩家到达隐藏区域入口时，镜头先向内偏移 32 像素做一次提示性窥视，
 *   0.8 秒后回正。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});
  var VW = 480, VH = 270;
  var LERP = 0.12;

  function Camera() {
    this.x = 0; this.y = 0;
    this.tx = 0; this.ty = 0;
    this.peek = null;      // {dx, dy, t, dur}
    this.shake = 0;        // 本作不使用镜头抖动（§2.3 不制造突发惊吓）
  }

  Camera.prototype.snapTo = function (player, level) {
    var t = this.targetFor(player, level);
    this.x = t.x; this.y = t.y;
    // 这里也必须钳一次。进关瞬间主角靠左时 targetFor 会给出负的 x，
    // 而开场对话激活期间 stepPlaying 提前 return、update() 不跑，
    // 负偏移会一直留着，把左边界墙画到屏幕中间。
    this.clampTo(level);
    this.tx = this.x; this.ty = this.y;
  };

  Camera.prototype.targetFor = function (player, level) {
    var x = player.centreX() - VW / 2;
    // 竖直方向略微上移取景：主角坐在屏幕偏下方，上方留出更多天空与平台，
    // 同时减少地面以下可见的实心面积。
    var y = player.y + player.h / 2 - VH * 0.66;
    return { x: x, y: y };
  };

  Camera.prototype.clampTo = function (level) {
    var maxX = Math.max(0, level.pxW - VW);
    var maxY = Math.max(0, level.pxH - VH);
    if (this.x < 0) this.x = 0;
    if (this.x > maxX) this.x = maxX;
    if (this.y < 0) this.y = 0;
    if (this.y > maxY) this.y = maxY;
  };

  Camera.prototype.update = function (dt, player, level) {
    var t = this.targetFor(player, level);
    var px = t.x, py = t.y;

    // §4.6 隐藏区域窥视：偏移 32 像素，0.8 秒后回正
    if (this.peek) {
      this.peek.t += dt;
      var k = this.peek.t / this.peek.dur;
      if (k >= 1) {
        this.peek = null;
      } else {
        // 缓入缓出的三角权重，避免镜头突然跳动
        var w = k < 0.15 ? (k / 0.15) : (k > 0.75 ? (1 - (k - 0.75) / 0.25) : 1);
        px += this.peek.dx * w;
        py += this.peek.dy * w;
      }
    }

    this.tx = px; this.ty = py;
    this.x += (this.tx - this.x) * LERP;
    this.y += (this.ty - this.y) * LERP;
    this.clampTo(level);
  };

  // 触发一次窥视（隐藏区域入口）
  Camera.prototype.startPeek = function (dx, dy) {
    if (this.peek) return false;
    this.peek = { dx: dx, dy: dy, t: 0, dur: 0.8 };
    return true;
  };

  Camera.prototype.renderX = function () { return Math.round(this.x); };
  Camera.prototype.renderY = function () { return Math.round(this.y); };

  Camera.VW = VW; Camera.VH = VH; Camera.LERP = LERP;
  CT.Camera = Camera;
})();

</script>
  <script>
/* ==== src/game/mech.js ==== */
/* 晶途拾光 — 机关与谜题
 * --------------------------------------------------------------------------
 * §4.3 六类机关，每类都必须能在教学关单独出现，再进入组合使用：
 *   踩压开关  站上去即触发，离开即复位；玩家要找重物或分时踩踏
 *   光路方块  推动反光块改变光束方向，把光引到晶座
 *   时序踏板  按正确顺序踩踏才开门；踩错只熄灭灯，无惩罚
 *   风场推力  持续风力推动角色与浮台
 *   水流转向  闸门与转盘改变水流方向，开闸、抬高水位、浮起平台
 *   符文拼图  收集碎片并按纹样拼接
 *
 * 三条硬性限制（§4.3）：
 *   单关同时生效的机关不超过 3 种；正确解必须能在场景内被观察到；
 *   连续失败 3 次给第一级提示，6 次给第二级提示。
 *
 * 门用「改写关卡瓦片 + doorMask 标记」的方式实现：这样玩家碰撞仍然走
 * level.rectSolid 一条路径，不需要在物理里额外插一层动态碰撞体。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});
  var TS = 16;

  function MechWorld(level, themeKey, particles, audio) {
    this.level = level;
    this.theme = themeKey;
    this.P = CT.Palette.get(themeKey);
    this.particles = particles;
    this.audio = audio;
    this.time = 0;

    this.doors = [];
    this.plates = [];
    this.pads = [];
    this.emitters = [];
    this.receivers = [];
    this.pushables = [];
    this.zones = [];
    this.valves = [];
    this.floats = [];
    this.altars = [];

    this.sequenceProgress = 0;
    this.sequenceDone = false;
    this.sequenceFlash = 0;
    this.failCount = {};
    this.hintLevel = {};
    this.beamPath = [];            // 供渲染的光路点集
    this.beamSolved = false;
    this.waterLevel = 0;           // 0..1 水位进度
    this.waterTarget = 0;
    this.runeTotal = 0;
    this.runeCollected = 0;
    this.solved = {};
    this.hazards = [];

    this._build();
  }

  MechWorld.prototype._build = function () {
    var L = this.level;
    var list = L.mechanisms || [];
    this.doorById = {};
    this.plateById = {};
    for (var i = 0; i < list.length; i++) {
      var m = list[i];
      if (m.type === 'door') {
        var d = {
          id: m.id, tx: m.at[0], ty: m.at[1], h: m.h || 3,
          open: !!m.open, anim: m.open ? 1 : 0,
        };
        this.doors.push(d);
        this.doorById[d.id] = d;
        this._applyDoorTiles(d);
      } else if (m.type === 'pressure_switch') {
        var p = { id: m.id, tx: m.at[0], ty: m.at[1], targets: m.targets || [], pressed: false, anim: 0 };
        this.plates.push(p);
        this.plateById[p.id] = p;
      } else if (m.type === 'stone') {
        this.pushables.push({
          id: m.id, kind: 'stone',
          x: m.at[0] * TS + 2, y: m.at[1] * TS + 4, w: 12, h: 12,
          axis: m.axis || 'x', min: m.min, max: m.max, vx: 0,
        });
      } else if (m.type === 'mirror') {
        this.pushables.push({
          id: m.id, kind: 'mirror',
          x: m.at[0] * TS + 2, y: m.at[1] * TS + 4, w: 12, h: 12,
          axis: m.axis || 'x', min: m.min, max: m.max, want: m.want, vx: 0,
          wantTx: m.want,
        });
      } else if (m.type === 'emitter') {
        this.emitters.push({ id: m.id, tx: m.at[0], ty: m.at[1], dir: m.dir, target: m.target });
      } else if (m.type === 'receiver') {
        this.receivers.push({ id: m.id, tx: m.at[0], ty: m.at[1], target: m.target, lit: false });
      } else if (m.type === 'sequence_pad') {
        this.pads.push({ id: m.id, tx: m.at[0], ty: m.at[1], index: m.index, order: m.order, door: m.door, lit: false });
      } else if (m.type === 'wind') {
        this.zones.push({
          id: m.id, x: m.at[0] * TS, y: m.at[1] * TS,
          w: m.w * TS, h: m.h * TS, fx: m.fx || 0, fy: m.fy || 0,
        });
      } else if (m.type === 'water_valve') {
        this.valves.push({ id: m.id, tx: m.at[0], ty: m.at[1], target: m.target, on: false, anim: 0 });
      } else if (m.type === 'float_platform') {
        this.floats.push({
          id: m.id, x: m.at[0] * TS, y: m.at[1] * TS, w: (m.w || 3) * TS, h: 6,
          lowY: m.lowY * TS, highY: m.highY * TS, y0: m.at[1] * TS,
        });
      } else if (m.type === 'rune_altar') {
        this.altars.push({ id: m.id, tx: m.at[0], ty: m.at[1], done: false });
      }
    }
    // 滚石障碍物：地面来回滚动，碰到扣命
    var hzList = L.hazards || [];
    for (var hi = 0; hi < hzList.length; hi++) {
      var hz = hzList[hi];
      this.hazards.push({
        id: hz.id,
        x: hz.at[0] * TS + 1,
        y: hz.at[1] * TS + 2,      // 石块高 14，贴在瓦片下沿
        w: 14, h: 14,
        minX: hz.range[0] * TS,
        maxX: hz.range[1] * TS,
        speed: hz.speed || 36,
        dir: hz.dir || 1,
        spin: 0,
      });
    }

    // 符文碎片总数来自关卡的 kind === 'rune' 宝物
    for (var k = 0; k < (this.level.treasures || []).length; k++) {
      if (this.level.treasures[k].kind === 'rune') this.runeTotal++;
    }
  };

  // 门的台阶式开关：改写瓦片，让物理只认 level.rectSolid 一条路径
  MechWorld.prototype._applyDoorTiles = function (d) {
    var L = this.level;
    for (var r = 0; r < d.h; r++) {
      var ty = d.ty - r;
      if (ty < 0) continue;
      L.setTile(d.tx, ty, d.open ? CT.TILE.EMPTY : CT.TILE.SOLID);
      L.setDoorTile(d.tx, ty, d.open ? 0 : 1);
    }
  };

  MechWorld.prototype._setDoor = function (id, open) {
    var d = this.doorById[id];
    if (!d || d.open === open) return;
    d.open = open;
    this._applyDoorTiles(d);
    if (this.audio) this.audio.sfx(open ? 'stone_door' : 'switch_down');
    if (this.particles) {
      for (var r = 0; r < d.h; r++) {
        this.particles.dust(d.tx * TS + 8, (d.ty - r) * TS + 8, this.P);
      }
    }
    // 记录解密，用于存档与提示
    this.solved[id] = open ? 1 : 0;
  };

  // ------------------------------------------------------------ 玩家碰撞体
  MechWorld.prototype.playerBox = function (p) { return { x: p.x, y: p.y, w: p.w, h: p.h }; };

  function overlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // 推力处理：先尝试把可推动物让开，让不开就把玩家退回去
  MechWorld.prototype.resolvePushables = function (player, level) {
    for (var i = 0; i < this.pushables.length; i++) {
      var o = this.pushables[i];
      var pbox = { x: player.x, y: player.y, w: player.w, h: player.h };
      var obox = { x: o.x, y: o.y, w: o.w, h: o.h };
      if (!overlap(pbox, obox)) continue;

      var dx = 0;
      if (pbox.x + pbox.w / 2 < obox.x + obox.w / 2) dx = (pbox.x + pbox.w) - obox.x;   // 向右推
      else dx = pbox.x - (obox.x + obox.w);                                              // 向左推
      var wantX = o.x + dx;

      // 边界（关卡生成期给定的滑轨）
      var minX = o.min !== undefined ? o.min * TS + 2 : 0;
      var maxX = o.max !== undefined ? o.max * TS + 2 : level.pxW;
      if (wantX < minX) wantX = minX;
      if (wantX > maxX) wantX = maxX;

      var moved = 0;
      if (wantX !== o.x) {
        var dir = wantX > o.x ? 1 : -1;
        // 逐像素试探，撞墙即停
        while (o.x !== wantX) {
          var nx = o.x + dir;
          if (level.rectSolid(nx, o.y, o.w, o.h)) break;
          var hitOther = false;
          for (var j = 0; j < this.pushables.length; j++) {
            if (j === i) continue;
            var b2 = this.pushables[j];
            if (nx < b2.x + b2.w && nx + o.w > b2.x && o.y < b2.y + b2.h && o.y + o.h > b2.y) { hitOther = true; break; }
          }
          if (hitOther) break;
          o.x = nx;
          moved++;
        }
      }
      // 把玩家退回到不重叠的位置
      if (moved * Math.sign(dx) !== dx) {
        if (dx > 0) player.x = o.x - player.w - 0.01;
        else player.x = o.x + o.w + 0.01;
        player.vx = 0;
      }
    }
  };

  // ---------------------------------------------------------------- 更新
  // 起跳钩子：音效与粒子在这里统一出口，player 不需要知道音频系统
  MechWorld.prototype.onPlayerJump = function (player) {
    if (this.audio) this.audio.sfx('jump');
  };

  MechWorld.prototype.onPlayerLand = function (player) {
    if (this.audio) this.audio.sfx('land');
    if (this.particles) this.particles.dust(player.centreX(), player.bottom(), this.P);
  };

  MechWorld.prototype.update = function (dt, player, collected) {
    this.time += dt;
    var L = this.level;
    var P = this.P;

    this.resolvePushables(player, L);

    // 滚石来回滚动
    for (var bi = 0; bi < this.hazards.length; bi++) {
      var bo = this.hazards[bi];
      bo.x += bo.dir * bo.speed * dt;
      bo.spin += bo.dir * bo.speed * dt;
      if (bo.x <= bo.minX) { bo.x = bo.minX; bo.dir = 1; }
      if (bo.x >= bo.maxX) { bo.x = bo.maxX; bo.dir = -1; }
      // 滚动时偶尔扬起一点尘土：既是视觉提示，也说明它在动
      if (this.particles && bo.dustT === undefined) bo.dustT = 0;
      if (this.particles) {
        bo.dustT -= dt;
        if (bo.dustT <= 0) {
          bo.dustT = 0.18;
          this.particles.spawn(1, bo.x + (bo.dir > 0 ? 1 : bo.w - 1), bo.y + bo.h - 2,
            -bo.dir * 12, -8, 0.26, this.P.c[2], 2, 2);
        }
      }
    }

    // ---- 踩压开关
    var anyTargets = {};
    for (var i = 0; i < this.plates.length; i++) {
      var pl = this.plates[i];
      var top = pl.ty * TS + TS;           // 开关面与地面同高
      var wasPressed = pl.pressed;
      var pbox = { x: player.x, y: player.y, w: player.w, h: player.h };
      var pr = { x: pl.tx * TS + 1, y: top - 6, w: 14, h: 10 };
      pl.pressed = overlap(pbox, pr);
      // 石块也算重物
      if (!pl.pressed) {
        for (var s = 0; s < this.pushables.length; s++) {
          var st = this.pushables[s];
          if (st.kind !== 'stone') continue;
          if (overlap({ x: st.x, y: st.y, w: st.w, h: st.h }, pr)) { pl.pressed = true; break; }
        }
      }
      pl.anim = pl.pressed ? Math.min(1, pl.anim + dt * 8) : Math.max(0, pl.anim - dt * 8);
      if (pl.pressed && !wasPressed) {
        if (this.audio) this.audio.sfx('switch_down');
      }
      // 复位型开关：离开即复位（§4.3 踩压开关）
      for (var t = 0; t < pl.targets.length; t++) {
        var tid = pl.targets[t];
        if (pl.pressed) anyTargets[tid] = true;
      }
    }
    // 所有门：若其所有触发条件都满足则开
    for (var di = 0; di < this.doors.length; di++) {
      var d = this.doors[di];
      var shouldOpen = !!anyTargets[d.id] || this._doorHeld(d.id);
      this._setDoor(d.id, shouldOpen);
      d.anim = d.open ? Math.min(1, d.anim + dt * 6) : Math.max(0, d.anim - dt * 6);
    }

    // ---- 时序踏板
    if (this.pads.length) {
      var pbox2 = { x: player.x, y: player.y, w: player.w, h: player.h };
      for (var pi = 0; pi < this.pads.length; pi++) {
        var pad = this.pads[pi];
        var ptop = pad.ty * TS + TS;
        var pr2 = { x: pad.tx * TS + 1, y: ptop - 5, w: 14, h: 8 };
        var on = overlap(pbox2, pr2);
        if (on && !pad.wasOn) this._stepPad(pad);
        pad.wasOn = on;
        pad.lit = this._padLit(pad);
      }
      if (this.sequenceFlash > 0) this.sequenceFlash -= dt;
    }

    // ---- 光路
    if (this.emitters.length) this._updateBeam();

    // ---- 风场
    if (this.zones.length) {
      for (var zi = 0; zi < this.zones.length; zi++) {
        var z = this.zones[zi];
        var zb = { x: z.x, y: z.y, w: z.w, h: z.h };
        if (overlap({ x: player.x, y: player.y, w: player.w, h: player.h }, zb)) {
          player.externalVX += z.fx;
          player.externalVY += z.fy;
        }
      }
    }

    // ---- 水流 / 水位
    if (this.valves.length) {
      var pbox3 = { x: player.x, y: player.y, w: player.w, h: player.h };
      for (var vi = 0; vi < this.valves.length; vi++) {
        var v = this.valves[vi];
        var vtop = v.ty * TS + TS;
        var vr = { x: v.tx * TS + 1, y: vtop - 6, w: 14, h: 10 };
        var onV = overlap(pbox3, vr);
        if (onV && !v.wasOn) {
          v.on = true;
          this.waterTarget = 1;
          this._setDoor(v.target, true);
          this._holdDoor(v.target, true);
          if (this.audio) this.audio.sfx('water_gate');
        }
        v.wasOn = onV;
        v.anim = v.on ? Math.min(1, v.anim + dt * 3) : v.anim;
      }
      this.waterLevel += (this.waterTarget - this.waterLevel) * Math.min(1, dt * 1.6);
      // 浮台随水位上升，并托住玩家
      for (var fi = 0; fi < this.floats.length; fi++) {
        var f = this.floats[fi];
        var ny = f.lowY + (f.highY - f.lowY) * this.waterLevel;
        var fprev = f.y;
        f.y = Math.round(ny);
        // 玩家站在浮台上则一起上升
        if (player.onGround &&
            player.x + player.w > f.x && player.x < f.x + f.w &&
            Math.abs(player.bottom() - fprev) <= 3) {
          player.y += (f.y - fprev);
        }
      }
    }

    // ---- 符文拼图
    if (this.altars.length) {
      this.runeCollected = 0;
      if (collected) {
        for (var ri = 0; ri < (this.level.treasures || []).length; ri++) {
          var tr = this.level.treasures[ri];
          if (tr.kind === 'rune' && collected[tr.id]) this.runeCollected++;
        }
      }
      for (var ai = 0; ai < this.altars.length; ai++) {
        var al = this.altars[ai];
        var atop = al.ty * TS + TS;
        var ar = { x: al.tx * TS, y: atop - 16, w: TS, h: 16 };
        var near = player.centreX() > ar.x - 24 && player.centreX() < ar.x + ar.w + 24 &&
          Math.abs(player.bottom() - atop) < 28;
        al.near = near;
        if (al.done) { this._setDoor('final', true); this._holdDoor('final', true); }
      }
    }

    // 已解机关计数（用于图鉴与进度显示）
    var solvedCount = 0;
    for (var k in this.solved) if (this.solved[k]) solvedCount++;
    this.solvedCount = solvedCount;
  };

  MechWorld.prototype._doorHeld = function (id) {
    this._held = this._held || {};
    return !!this._held[id];
  };
  MechWorld.prototype._holdDoor = function (id, v) {
    this._held = this._held || {};
    this._held[id] = v;
  };

  // 交互键在符文台附近触发拼合
  MechWorld.prototype.interact = function (player, collected) {
    for (var ai = 0; ai < this.altars.length; ai++) {
      var al = this.altars[ai];
      if (!al.near) continue;
      if (al.done) return { type: 'rune_already' };
      if (this.runeCollected >= this.runeTotal && this.runeTotal > 0) {
        al.done = true;
        this.solved['rune_' + this.level.id] = 1;
        if (this.audio) this.audio.sfx('rune_merge');
        if (this.particles) this.particles.sparkle(al.tx * TS + 8, al.ty * TS, this.P.c[15]);
        return { type: 'rune_solved' };
      }
      return { type: 'rune_incomplete', need: this.runeTotal - this.runeCollected };
    }
    return null;
  };

  MechWorld.prototype._padLit = function (pad) {
    if (this.sequenceDone) return true;
    for (var i = 0; i < pad.order.length; i++) {
      if (pad.order[i] === pad.index) return i < this.sequenceProgress;
    }
    return false;
  };

  MechWorld.prototype._stepPad = function (pad) {
    if (this.sequenceDone) return;
    var need = pad.order[this.sequenceProgress];
    if (pad.index === need) {
      this.sequenceProgress++;
      if (this.audio) this.audio.sfx('pad_ok');
      if (this.sequenceProgress >= pad.order.length) {
        this.sequenceDone = true;
        for (var i = 0; i < this.pads.length; i++) {
          this._setDoor(this.pads[i].door, true);
          this._holdDoor(this.pads[i].door, true);
        }
        this.solved['pads_' + this.level.id] = 1;
        if (this.audio) this.audio.sfx('stone_door');
      }
    } else if (pad.index !== pad.order[this.sequenceProgress - 1]) {
      // 踩错只熄灭灯，无惩罚（§4.3）
      this.sequenceProgress = 0;
      this.sequenceFlash = 0.35;
      if (this.audio) this.audio.sfx('pad_bad');
    }
  };

  // 光束追踪：右行 -> 遇反光块向上 -> 命中晶座
  MechWorld.prototype._updateBeam = function () {
    this.beamPath.length = 0;
    var solvedAll = true;
    for (var ei = 0; ei < this.emitters.length; ei++) {
      var em = this.emitters[ei];
      var rx = -1;
      // 找同高度的反光块
      for (var i = 0; i < this.pushables.length; i++) {
        var o = this.pushables[i];
        if (o.kind !== 'mirror') continue;
        var oRow = Math.floor((o.y + o.h / 2) / TS);
        if (oRow !== em.ty) continue;
        var oCol = Math.floor((o.x + o.w / 2) / TS);
        if (oCol <= em.tx) continue;
        if (this.level.rectSolid((em.tx + oCol) / 2 | 0, em.ty, 1, 1)) continue;
        if (rx < 0 || oCol < rx) rx = oCol;
      }
      var ok = false;
      if (rx > em.tx) {
        this.beamPath.push([em.tx * TS + TS, em.ty * TS + TS / 2, rx * TS, em.ty * TS + TS / 2]);
        // 竖直向上
        var upTop = em.ty;
        for (var ty = em.ty - 1; ty >= 0; ty--) {
          if (this.level.rectSolid(rx, ty, 1, 1)) break;
          upTop = ty;
          // 命中晶座
          var hit = false;
          for (var ri = 0; ri < this.receivers.length; ri++) {
            if (this.receivers[ri].tx === rx && this.receivers[ri].ty === ty) { hit = true; break; }
          }
          if (hit) { ok = true; break; }
        }
        this.beamPath.push([rx * TS + TS / 2, em.ty * TS + TS / 2, rx * TS + TS / 2, upTop * TS + TS / 2]);
      }
      // 反光块是否已对准
      var aligned = false;
      for (var k = 0; k < this.pushables.length; k++) {
        var oo = this.pushables[k];
        if (oo.kind !== 'mirror') continue;
        if (Math.floor((oo.x + oo.w / 2) / TS) === oo.wantTx) aligned = true;
      }
      var open = aligned && ok;
      if (!open) solvedAll = false;
      this._setDoor(em.target, open);
      this._holdDoor(em.target, open);
      for (var rr = 0; rr < this.receivers.length; rr++) {
        if (this.receivers[rr].target === em.target) this.receivers[rr].lit = open;
      }
    }
    this.beamSolved = solvedAll;
  };

  // ---------------------------------------------------------------- 绘制
  MechWorld.prototype.draw = function (fb, camX, camY, blobCache) {
    var P = this.P;
    var i, x, y;

    // 踩压开关
    for (i = 0; i < this.plates.length; i++) {
      var pl = this.plates[i];
      x = pl.tx * TS - camX; y = pl.ty * TS + TS - camY;
      if (x < -20 || x > 500 || y < -20 || y > 290) continue;
      var hgt = Math.round(4 - pl.anim * 3);
      fb.fillRect(x + 1, y - hgt, 14, hgt + 1, P.c[11]);
      fb.hline(x + 1, y - hgt, 14, pl.pressed ? P.c[15] : P.c[2]);
      fb.hline(x + 1, y, 14, P.c[12]);
      fb.setClip(0, 0, 480, 270);
      fb.resetClip();
    }

    // 时序踏板
    for (i = 0; i < this.pads.length; i++) {
      var pad = this.pads[i];
      x = pad.tx * TS - camX; y = pad.ty * TS + TS - camY;
      if (x < -20 || x > 500 || y < -20 || y > 290) continue;
      fb.fillRect(x + 1, y - 3, 14, 4, P.c[11]);
      var lit = pad.lit;
      fb.hline(x + 2, y - 3, 12, lit ? P.c[15] : P.c[12]);
      if (lit) {
        fb.fillRectDither(x + 3, y - 2, 10, 2, P.c[15], 8);
      }
      // 踏板上的序号刻痕：顺序线索要求「必须能在场景内被观察到」
      fb.fillRect(x + 6, y - 2, 4, 1, lit ? P.c[0] : P.c[7]);
    }

    // 门
    for (i = 0; i < this.doors.length; i++) {
      var d = this.doors[i];
      drawDoor(fb, d, camX, camY, P);
    }

    // 滚石：圆形石块 + 高光 + 底部投影，轮廓用最暗色压边，一眼能看出是障碍
    for (i = 0; i < this.hazards.length; i++) {
      var hb = this.hazards[i];
      var hx = Math.round(hb.x) - camX;
      var hy = Math.round(hb.y) - camY;
      if (hx < -24 || hx > 500 || hy < -24 || hy > 290) continue;
      var cxh = hx + 7, cyh = hy + 7;
      fb.ellipse(cxh, cyh, 7, 7, P.c[12]);      // 外圈描边
      fb.ellipse(cxh, cyh, 6, 6, P.c[11]);      // 石体
      fb.ellipse(cxh, cyh - 1, 4, 4, P.c[3]);   // 受光面
      fb.ellipse(cxh - 2, cyh - 3, 1, 1, P.c[1]); // 高光
      // 随滚动位移移动的两条纹理，暗示它在滚而不是在滑
      var sp = (((hb.spin * 0.5) | 0) % 10 + 10) % 10;
      fb.px(cxh - 3 + (sp > 4 ? 1 : 0), cyh + 1, P.c[6]);
      fb.fillRect(cxh - 2, cyh + 2, 3, 1, P.c[6]);
      fb.fillRect(cxh + 2, cyh - 2 + (sp > 5 ? 1 : 0), 2, 1, P.c[6]);
      fb.hline(hx + 3, hy + 14, 8, P.c[13]);    // 地面投影
    }

    // 可推动物
    for (i = 0; i < this.pushables.length; i++) {
      var o = this.pushables[i];
      x = Math.round(o.x) - camX; y = Math.round(o.y) - camY;
      if (x < -24 || x > 500 || y < -24 || y > 290) continue;
      if (o.kind === 'stone') {
        fb.fillRect(x, y, 12, 12, P.c[11]);
        fb.fillRect(x + 1, y + 1, 10, 9, P.c[3]);
        fb.hline(x + 1, y + 1, 10, P.c[2]);
        fb.hline(x, y + 11, 12, P.c[12]);
        fb.vline(x, y, 12, P.c[12]);
        fb.vline(x + 11, y, 12, P.c[12]);
      } else {
        // 反光块：斜面对角高光
        fb.fillRect(x, y, 12, 12, P.c[12]);
        fb.fillRect(x + 1, y + 1, 10, 10, P.c[3]);
        for (var k = 0; k < 9; k++) {
          fb.px(x + 2 + k, y + 2 + k, P.c[0]);
          fb.px(x + 3 + k, y + 2 + k, P.c[2]);
        }
        fb.hline(x + 1, y + 1, 10, P.c[2]);
      }
    }

    // 发射器与晶座
    for (i = 0; i < this.emitters.length; i++) {
      var em = this.emitters[i];
      x = em.tx * TS - camX; y = em.ty * TS - camY;
      fb.fillRect(x + 2, y + 4, 12, 8, P.c[12]);
      fb.fillRect(x + 3, y + 5, 10, 6, P.c[4]);
      fb.fillRect(x + 12, y + 7, 4, 2, P.c[15]);
    }
    for (i = 0; i < this.receivers.length; i++) {
      var rc = this.receivers[i];
      x = rc.tx * TS - camX; y = rc.ty * TS - camY;
      fb.fillRect(x + 3, y + 8, 10, 6, P.c[11]);
      fb.ellipse(x + 8, y + 6, 4, 4, rc.lit ? P.c[15] : P.c[12]);
      fb.ellipse(x + 8, y + 6, 2, 2, rc.lit ? P.c[0] : P.c[7]);
    }

    // 光路：抖动像素线（§7.2 渐变只用抖动）
    for (i = 0; i < this.beamPath.length; i++) {
      var seg = this.beamPath[i];
      drawBeam(fb, seg[0] - camX, seg[1] - camY, seg[2] - camX, seg[3] - camY, P.c[15], P.c[0]);
    }

    // 风场
    for (i = 0; i < this.zones.length; i++) {
      var z = this.zones[i];
      var zx = z.x - camX, zy = z.y - camY;
      if (zx > 500 || zx + z.w < -20) continue;
      for (var w = 0; w < 18; w++) {
        var ph = (this.time * 1.4 + w * 0.37) % 1;
        var px2 = zx + ((w * 37) % z.w);
        var py2 = zy + z.h - ph * z.h;
        if (py2 < zy) continue;
        fb.fillRect(Math.round(px2), Math.round(py2), 1, 3 + (w % 3), P.c[2]);
        fb.fillRectDither(Math.round(px2) + 1, Math.round(py2), 2, 2, P.c[1], 6);
      }
    }

    // 水位与浮台
    if (this.floats.length) {
      for (i = 0; i < this.floats.length; i++) {
        var f = this.floats[i];
        x = f.x - camX; y = f.y - camY;
        fb.fillRect(x, y, f.w, 6, P.c[9]);
        fb.hline(x, y, f.w, P.c[1]);
        fb.hline(x, y + 5, f.w, P.c[13]);
      }
      // 水面用 50% 透明叠色（§7.2 水面允许 50%）
      var wl = this.waterLevel;
      if (wl > 0.02) {
        for (i = 0; i < this.valves.length; i++) {
          var v = this.valves[i];
          var topY = (v.ty + 1) * TS - Math.round(wl * 96);
          var wy = topY - camY;
          if (wy > -10 && wy < 280) {
            fb.fillRectDither(0, wy, 480, 270 - wy, P.c[4], 4);
            fb.hline(0, wy, 480, P.c[1]);
          }
        }
      }
    }

    // 阀门
    for (i = 0; i < this.valves.length; i++) {
      var vv = this.valves[i];
      x = vv.tx * TS - camX; y = vv.ty * TS + TS - camY;
      fb.fillRect(x + 1, y - 6, 14, 7, P.c[11]);
      fb.hline(x + 1, y - 6, 14, vv.on ? P.c[15] : P.c[2]);
      fb.fillRect(x + 6, y - 9, 4, 4, vv.on ? P.c[15] : P.c[7]);
    }

    // 符文台
    for (i = 0; i < this.altars.length; i++) {
      var al = this.altars[i];
      x = al.tx * TS - camX; y = al.ty * TS + TS - camY;
      fb.fillRect(x, y - 14, 16, 15, P.c[12]);
      fb.fillRect(x + 1, y - 13, 14, 13, P.c[11]);
      var ratio = this.runeTotal ? this.runeCollected / this.runeTotal : 0;
      for (var s2 = 0; s2 < 3; s2++) {
        var on2 = s2 < Math.round(ratio * 3);
        fb.fillRect(x + 3 + s2 * 4, y - 10, 3, 5, on2 ? P.c[15] : P.c[6]);
      }
      fb.hline(x, y - 1, 16, P.c[12]);
    }
  };

  function drawDoor(fb, d, camX, camY, P) {
    var x = d.tx * TS - camX;
    var topY = (d.ty - d.h + 1) * TS - camY;
    var hgt = d.h * TS;
    if (x < -20 || x > 500) return;
    // 门框
    fb.fillRect(x, topY, TS, hgt, P.c[12]);
    var open = d.anim;
    if (open < 1) {
      var squeeze = Math.round(open * hgt * 0.5);
      fb.fillRect(x + 1, topY + squeeze, TS - 2, hgt - squeeze * 2, P.c[4]);
      for (var r = 0; r < hgt; r += 4) {
        fb.hline(x + 2, topY + squeeze + r, TS - 4, P.c[6]);
      }
      fb.vline(x + 7, topY + squeeze, 1, P.c[12]);
      fb.fillRect(x + 6, topY + hgt / 2 - 2 + squeeze, 4, 3, P.c[8]);
    }
    fb.hline(x, topY, TS, P.c[13]);
    fb.hline(x, topY + hgt - 1, TS, P.c[13]);
  }

  function drawBeam(fb, x0, y0, x1, y1, color, core) {
    var i;
    if (y0 === y1) {
      var xs = Math.min(x0, x1), xe = Math.max(x0, x1);
      fb.fillRectDither(Math.round(xs), Math.round(y0) - 1, Math.round(xe - xs), 2, color, 11);
      fb.fillRectDither(Math.round(xs), Math.round(y0), Math.round(xe - xs), 1, core, 12);
    } else if (x0 === x1) {
      var ys = Math.min(y0, y1), ye = Math.max(y0, y1);
      fb.fillRectDither(Math.round(x0) - 1, Math.round(ys), 2, Math.round(ye - ys), color, 11);
      fb.fillRectDither(Math.round(x0), Math.round(ys), 1, Math.round(ye - ys), core, 12);
    }
  }

  // ------------------------------------------------------------------ 提示
  // §4.3 连续失败 3 次 -> 第一级提示；6 次 -> 第二级提示
  MechWorld.prototype.fail = function (key) {
    this.failCount[key] = (this.failCount[key] || 0) + 1;
    var n = this.failCount[key];
    if (n >= 6) this.hintLevel[key] = 2;
    else if (n >= 3) this.hintLevel[key] = 1;
    return this.hintLevel[key] || 0;
  };

  MechWorld.prototype.hasDoorOpen = function () {
    for (var i = 0; i < this.doors.length; i++) if (!this.doors[i].open) return false;
    return true;
  };

  CT.MechWorld = MechWorld;
})();

</script>
  <script>
/* ==== src/game/particles.js ==== */
/* 晶途拾光 — 粒子
 * --------------------------------------------------------------------------
 * §7.4 粒子系统只允许三种：
 *   环境粒子（落叶、雪絮、星尘、气泡）
 *   交互粒子（踩踏扬尘、拾取闪光）
 *   提示粒子（路标气泡）
 * 单屏同屏粒子数上限 60，单个粒子尺寸不超过 4 × 4 像素，
 * 禁止发光拖尾与镜头光晕。
 *
 * 实现为一个固定池：所有粒子在构造期一次分配，运行期不再 new 任何对象，
 * 因此不会在 60 帧的热路径上触发 GC。
 */
(function () {
  'use strict';
  var CT = (window.CT = window.CT || {});

  var MAX = 60;                 // §7.4 单屏上限
  var KIND = { AMBIENT: 0, INTERACT: 1, HINT: 2 };

  function Particles() {
    this.n = 0;
    // 预分配池
    this.x = new Float32Array(MAX);
    this.y = new Float32Array(MAX);
    this.vx = new Float32Array(MAX);
    this.vy = new Float32Array(MAX);
    this.life = new Float32Array(MAX);
    this.maxLife = new Float32Array(MAX);
    this.kind = new Uint8Array(MAX);
    this.color = new Uint32Array(MAX);
    this.w = new Uint8Array(MAX);
    this.h = new Uint8Array(MAX);
    this.phase = new Float32Array(MAX);
    this.ambientTimer = 0;
    this.ambientKind = 0;       // 0 落叶 1 雪絮 2 星尘 3 气泡
    this.ambientColor = 0;
  }

  Particles.prototype.clear = function () { this.n = 0; this.ambientTimer = 0; };

  Particles.prototype.setTheme = function (themeKey, P) {
    // 每个主题的环境粒子有自己的形态与颜色
    if (themeKey === 'forest') { this.ambientKind = 0; this.ambientColor = P.c[7]; }
    else if (themeKey === 'amber') { this.ambientKind = 3; this.ambientColor = P.c[11]; }
    else if (themeKey === 'cloud') { this.ambientKind = 1; this.ambientColor = P.c[0]; }
    else if (themeKey === 'water') { this.ambientKind = 3; this.ambientColor = P.c[15]; }
    else { this.ambientKind = 2; this.ambientColor = P.c[0]; }
    this.P = P;
  };

  // 分配一个槽位；池满则复用最老的
  Particles.prototype._alloc = function () {
    if (this.n < MAX) return this.n++;
    var oldest = 0, best = Infinity;
    for (var i = 0; i < MAX; i++) {
      if (this.life[i] < best) { best = this.life[i]; oldest = i; }
    }
    return oldest;
  };

  Particles.prototype.spawn = function (kind, x, y, vx, vy, life, color, w, h) {
    var i = this._alloc();
    this.x[i] = x; this.y[i] = y;
    this.vx[i] = vx; this.vy[i] = vy;
    this.life[i] = life; this.maxLife[i] = life;
    this.kind[i] = kind;
    this.color[i] = color >>> 0;
    this.w[i] = w; this.h[i] = h;
    this.phase[i] = Math.random() * 6.283;
    return i;
  };

  // §7.4 交互粒子：踩踏扬尘
  Particles.prototype.dust = function (x, y, P) {
    for (var i = 0; i < 4; i++) {
      this.spawn(KIND.INTERACT, x, y,
        (Math.random() - 0.5) * 40, -10 - Math.random() * 20,
        0.25 + Math.random() * 0.2, P.c[2], 2, 2);
    }
  };

  // §7.4 交互粒子：拾取闪光
  Particles.prototype.sparkle = function (x, y, color) {
    for (var i = 0; i < 8; i++) {
      var a = (i / 8) * Math.PI * 2;
      this.spawn(KIND.INTERACT, x, y,
        Math.cos(a) * 42, Math.sin(a) * 42,
        0.3 + Math.random() * 0.2, color, 2, 2);
    }
  };

  // §7.4 提示粒子：路标气泡
  Particles.prototype.hintBubble = function (x, y, color) {
    this.spawn(KIND.HINT, x, y, 0, -14, 0.9, color, 3, 3);
  };

  // 环境粒子按主题持续滴落
  Particles.prototype.ambientTick = function (dt, camX, camY) {
    this.ambientTimer -= dt;
    if (this.ambientTimer > 0) return;
    this.ambientTimer = 0.16;
    var k = this.ambientKind;
    var x = camX + Math.random() * 480;
    var y = camY - 6;
    if (k === 0) {
      // 落叶：左右飘
      this.spawn(KIND.AMBIENT, x, y, -12 + Math.random() * 24, 26 + Math.random() * 18,
        3.2, this.ambientColor, 3, 2);
    } else if (k === 1) {
      // 雪絮：慢速下落
      this.spawn(KIND.AMBIENT, x, y, -6 + Math.random() * 12, 16 + Math.random() * 10,
        4.5, this.ambientColor, 2, 2);
    } else if (k === 2) {
      // 星尘：几乎静止的悬浮
      this.spawn(KIND.AMBIENT, x, camY + Math.random() * 270, -4 + Math.random() * 8,
        -6 + Math.random() * 12, 3.0, this.ambientColor, 2, 2);
    } else {
      // 气泡：从底部上升
      this.spawn(KIND.AMBIENT, x, camY + 276, -6 + Math.random() * 12, -30 - Math.random() * 20,
        2.6, this.ambientColor, 2, 2);
    }
  };

  Particles.prototype.update = function (dt) {
    var n = this.n;
    var i = 0;
    while (i < n) {
      this.life[i] -= dt;
      if (this.life[i] <= 0) {
        // 交换删除，保持池紧凑
        n--;
        if (i !== n) {
          this.x[i] = this.x[n]; this.y[i] = this.y[n];
          this.vx[i] = this.vx[n]; this.vy[i] = this.vy[n];
          this.life[i] = this.life[n]; this.maxLife[i] = this.maxLife[n];
          this.kind[i] = this.kind[n]; this.color[i] = this.color[n];
          this.w[i] = this.w[n]; this.h[i] = this.h[n];
          this.phase[i] = this.phase[n];
        }
        continue;
      }
      var k = this.kind[i];
      if (k === KIND.AMBIENT) {
        // 环境粒子轻微摆动（落叶/气泡感）
        this.vx[i] += Math.sin(this.phase[i] + this.life[i] * 3) * 14 * dt;
        if (this.vx[i] > 30) this.vx[i] = 30;
        if (this.vx[i] < -30) this.vx[i] = -30;
      } else if (k === KIND.INTERACT) {
        this.vy[i] += 80 * dt;
        this.vx[i] *= (1 - 2.2 * dt);
      }
      this.x[i] += this.vx[i] * dt;
      this.y[i] += this.vy[i] * dt;
      i++;
    }
    this.n = n;
  };

  Particles.prototype.draw = function (fb, camX, camY) {
    for (var i = 0; i < this.n; i++) {
      var x = Math.round(this.x[i] - camX);
      var y = Math.round(this.y[i] - camY);
      if (x < -8 || y < -8 || x > 488 || y > 278) continue;
      // 生命末段用抖动淡出（§7.2 渐变只用抖动实现）
      var t = this.life[i] / this.maxLife[i];
      var w = this.w[i], h = this.h[i];
      if (t < 0.3) {
        if (t < 0.15 && this.kind[i] === KIND.INTERACT) continue;
        fb.fillRectDither(x, y, w, h, this.color[i], Math.max(1, Math.round(t * 16)));
